name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without code changes: audit the lockfile weekly too (D9.1).
  schedule:
    - cron: "41 3 * * 1" # Mondays 06:41 Africa/Nairobi

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI image (pinned by digest) avoids the gitleaks action's licence key requirement.
      - name: Scan the full git history
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocks PRs that add dependencies with high/critical advisories or copyleft licences that
      # would bind a SaaS product or the distributed site app (ARCHITECTURE D-24).
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Fails on high or critical advisories in production dependencies (the remediation time
      # frames are in docs/SECURITY_CHECKLIST.md, V15.1.1). Reads the lockfile; no install needed.
      - run: pnpm audit --prod --audit-level high
      # CycloneDX SBOM of the production dependency tree (ASVS V15.1.2), kept with the run.
      - run: pnpm sbom --sbom-format cyclonedx --lockfile-only --prod --sbom-type application > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
