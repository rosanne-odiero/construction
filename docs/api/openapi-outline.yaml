  /projects/{projectId}/cost-entries:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listCostEntries
      summary: List cost entries (every shilling, tagged)
      description: >-
        Append-only entries from payroll, supplier invoices, expenses, plant usage and M-Pesa
        charges, each tagged with site, BQ item or cost code, category, supplier or worker, and
        payment reference.
      tags: [finance]
      x-permission: finance.view
      parameters:
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/CostCategory" }
        - name: costCodeId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: bqItemId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of cost entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/CostEntry" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postCostAdjustment
      summary: Post a manual adjusting or reversing cost entry
      description: Entries are never edited or deleted. A correction references the entry it reverses.
      tags: [finance]
      x-permission: finance.post_adjustment
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostEntry" }
      responses:
        "201":
          description: Entry posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEntry" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /projects/{projectId}/budgets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
