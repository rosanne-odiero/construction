      tags: [quality-safety]
      x-permission: safety.issue_ppe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PpeIssue" }
      responses:
        "201":
          description: PPE issue recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PpeIssue" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sites/{siteId}/inductions:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: recordInductions
      summary: Record site inductions for one or more labourers
      tags: [quality-safety]
      x-permission: safety.induct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InductionBatch" }
      responses:
        "201":
          description: Induction records created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InductionBatch" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ------------------------------------------------------------------- plant
  /plant:
    get:
      operationId: listPlant
      summary: List the plant and equipment register
      tags: [plant]
      x-permission: plant.view
      parameters:
        - name: ownership
          in: query
          schema: { type: string, enum: [owned, hired] }
        - $ref: "#/components/parameters/SiteFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of plant items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Plant" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: registerPlant
      summary: Add owned or hired plant to the register
      tags: [plant]
      x-permission: plant.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Plant" }
      responses:
        "201":
          description: Plant registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plant" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /plant/{plantId}/usage:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      operationId: recordPlantUsage
      summary: Record days or hours of plant use with operator and BQ item
      description: Hired plant usage posts a cost entry at the hire rate.
      tags: [plant]
      x-permission: plant.record_usage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantUsage" }
      responses:
        "201":
          description: Usage recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantUsage" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /plant/{plantId}/fuel-issues:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      operationId: recordFuelIssue
      summary: Record fuel issued to plant
      description: >-
        Posts a fuel issue to the site store's stock ledger. Consumption per hour against the
        meter reading is tracked and outliers raise an alert.
      tags: [plant]
      x-permission: plant.issue_fuel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuelIssue" }
      responses:
        "201":
          description: Fuel issue recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FuelIssue" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /plant/{plantId}/maintenance:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    post:
      operationId: recordPlantMaintenance
      summary: Record a breakdown, service or repair
      tags: [plant]
      x-permission: plant.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantMaintenance" }
      responses:
        "201":
          description: Maintenance recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantMaintenance" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------- documents-compliance
  /projects/{projectId}/documents:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listDocuments
      summary: List project documents
      tags: [documents-compliance]
      x-permission: documents.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: category
          in: query
          schema:
            type: string
            enum: [drawing, contract, bq, permit, certificate, insurance, other]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of documents with their current version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Document" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDocument
      summary: Add a document with its first version
      tags: [documents-compliance]
      x-permission: documents.upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Document" }
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /documents/{documentId}/versions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: addDocumentVersion
      summary: Upload a new version of a document
      description: Earlier versions stay available; the new one becomes current.
      tags: [documents-compliance]
      x-permission: documents.upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentVersion" }
      responses:
        "201":
          description: Version added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVersion" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /compliance-items:
    get:
      operationId: listComplianceItems
      summary: List the compliance register
      description: >-
        County approval, NCA project and contractor registration, NEMA licence, CAR and WIBA
        insurance, OSH registration, site signboard and more. Omit `projectId` to include
        company-level items.
      tags: [documents-compliance]
      x-permission: compliance.view
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
        - name: status
          in: query
          schema: { type: string, enum: [valid, expiring, expired, missing] }
        - name: expiringWithinDays
          in: query
          description: Only items that expire within this many days
          schema: { type: integer, minimum: 1, maximum: 365 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of compliance items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/ComplianceItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createComplianceItem
      summary: Add an item to the compliance register
      description: Reminder lead times (for example 60, 30 and 7 days) drive `document_expiry` alerts.
      tags: [documents-compliance]
      x-permission: compliance.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceItem" }
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceItem" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ----------------------------------------------------------- notifications
  /notification-templates:
    get:
      operationId: listNotificationTemplates
      summary: List notification templates (EN/SW, per channel)
      tags: [notifications]
      x-permission: notifications.manage_templates
      parameters:
        - name: eventKey
          in: query
          schema: { type: string, examples: [payment.sent] }
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/NotificationChannel" }
        - name: locale
          in: query
          schema: { $ref: "#/components/schemas/Locale" }
      responses:
        "200":
          description: Templates (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/NotificationTemplate" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createNotificationTemplateVersion
      summary: Create a tenant override version of a template
      description: >-
        ICU message format. SMS bodies are checked against segment limits; WhatsApp templates must
        reference a name already approved by Meta.
      tags: [notifications]
      x-permission: notifications.manage_templates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplate" }
      responses:
        "201":
          description: Template version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Get the caller's notification preferences
      tags: [notifications]
      x-permission: authenticated
      responses:
        "200":
          description: Preferences per event and channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: setNotificationPreferences
      summary: Replace the caller's notification preferences
      description: Critical security notifications are always sent and cannot be switched off.
      tags: [notifications]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferences" }
      responses:
        "200":
          description: Preferences saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications
      description: >-
        The caller's own notifications, or the tenant's delivery log (including SMS to labourers
        without accounts, with masked numbers) for holders of `notifications.view_log`.
      tags: [notifications]
      x-permission: authenticated
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, tenant], default: mine }
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/NotificationChannel" }
        - name: status
          in: query
          schema: { type: string, enum: [queued, sent, delivered, failed] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Notification" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ------------------------------------------------------------------ alerts
  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts
      tags: [alerts]
      x-permission: alerts.view
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/AlertKind" }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, critical] }
        - name: status
          in: query
          schema: { type: string, enum: [open, acknowledged, resolved], default: open }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of alerts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Alert" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /alerts/{alertId}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    post:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      tags: [alerts]
      x-permission: alerts.manage
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /alerts/{alertId}/resolve:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    post:
      operationId: resolveAlert
      summary: Resolve an alert with a note
      tags: [alerts]
      x-permission: alerts.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Alert" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ----------------------------------------------------------------- reports
  /reports/types:
    get:
      operationId: listReportTypes
      summary: List available report types and their parameters
      description: >-
        Muster roll, payroll summary, labourer ledger, material reconciliation, stock valuation,
        supplier statements, valuation history, cost report, M-Pesa reconciliation and audit log.
      tags: [reports]
      x-permission: reports.view
      responses:
        "200":
          description: Report types (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/ReportType" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /reports/exports:
    post:
      operationId: createReportExport
      summary: Start a report export (PDF, Excel or CSV)
      description: >-
        Runs in the worker; poll `GET /jobs/{jobId}`. Each report type also checks its own module
        permission. Exports are audited.
      tags: [reports]
      x-permission: reports.export
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportExportRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJob
      summary: Get the status of a background job (with download URL when done)
      description: Used by every asynchronous operation (exports, imports, timesheet generation).
      tags: [reports]
      x-permission: authenticated
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /report-schedules:
    get:
      operationId: listReportSchedules
      summary: List scheduled email reports
      tags: [reports]
      x-permission: reports.schedule
      responses:
        "200":
          description: Schedules (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/ReportSchedule" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReportSchedule
      summary: Schedule a report to be emailed
      description: Cron-like schedule evaluated in Africa/Nairobi. Recipients must be tenant members.
      tags: [reports]
      x-permission: reports.schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSchedule" }
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /dashboards/owner:
    get:
      operationId: getOwnerDashboard
      summary: Get the owner dashboard across projects
      description: >-
        Cash position, spend by category, budget burn, labour cost per day, top variances,
        upcoming payments and open alerts.
      tags: [reports]
      x-permission: reports.view_owner_dashboard
      parameters:
        - $ref: "#/components/parameters/OnDate"
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ------------------------------------------------------------------- files
  /files/upload-intents:
    post:
      operationId: createUploadIntent
      summary: Get a pre-signed PUT URL for an upload
      description: >-
        The URL is short-lived and constrained to the declared content type, exact size and
        SHA-256 (sent as `x-amz-checksum-sha256`). The object lands under `quarantine/`. The
        worker sniffs the type from magic bytes, runs the malware scanner, extracts EXIF, makes
        thumbnails and promotes it to `private/`, after which the file can be referenced by ID.
      tags: [files]
      x-permission: files.upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileUploadIntentRequest" }
      responses:
        "201":
          description: Upload intent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUploadIntent" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /files/{fileId}/download-url:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      operationId: getFileDownloadUrl
      summary: Get a short-lived pre-signed download URL
      description: >-
        Issued only after an authorisation check on the record that owns the file. Files still in
        quarantine, or found infected, return 409.
      tags: [files]
      x-permission: files.download
      parameters:
        - name: variant
          in: query
          schema: { type: string, enum: [original, thumbnail, shared], default: original }
      responses:
        "200":
          description: Download URL
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ----------------------------------------------------------- client-portal
  /portal/client/projects:
    get:
      operationId: listClientProjects
      summary: List the client's projects
      tags: [client-portal]
      x-permission: portal.client.view
      responses:
        "200":
          description: Project summaries (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/ClientProjectSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /portal/client/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getClientProjectSummary
      summary: Get a project summary for the client
      description: >-
        Progress percentage, S-curve, milestones, original and revised contract sum, amount due,
        latest diary summaries and pending variation orders. Amounts can be shown in USD, GBP or
        EUR for display only.
      tags: [client-portal]
      x-permission: portal.client.view
      parameters:
        - name: displayCurrency
          in: query
          schema: { $ref: "#/components/schemas/Currency" }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/client/projects/{projectId}/photos:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listClientProjectPhotos
      summary: List the project's photo timeline with verified location and time
      description: Only photos released to the client. Shared variants have location metadata stripped from the file; the verified badge and site name are shown instead.
      tags: [client-portal]
      x-permission: portal.client.view
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of photos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Photo" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/client/projects/{projectId}/statement:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getClientStatement
      summary: Get payment certificates, payments and the balance due
      tags: [client-portal]
      x-permission: portal.client.view
      parameters:
        - name: displayCurrency
          in: query
          schema: { $ref: "#/components/schemas/Currency" }
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientStatement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/client/projects/{projectId}/stk-push:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: payCertificateByStkPush
      summary: Pay a payment certificate by M-Pesa STK Push
      description: >-
        Prompts the given M-Pesa number. The payment shows as pending until the matched callback
        or an STK Query confirms it; the portal polls the payment status. Diaspora clients without
        M-Pesa can pay by bank transfer, recorded by Finance.
      tags: [client-portal]
      x-permission: portal.client.pay
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientStkPushRequest" }
      responses:
        "202":
          description: Prompt sent; payment pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /portal/client/projects/{projectId}/variation-orders/{variationOrderId}/decision:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/VariationOrderId"
    post:
      operationId: decideVariationOrderAsClient
      summary: Approve or reject a variation order with a comment
      tags: [client-portal]
      x-permission: portal.client.decide_variation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientDecision" }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariationOrder" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /portal/client/fx-rates:
    get:
      operationId: listFxRates
      summary: Get display FX rates (KES per USD, GBP and EUR)
      description: For display only; all payments settle in KES. Shows the source and time of each rate.
      tags: [client-portal]
      x-permission: portal.client.view
      responses:
        "200":
          description: Latest rates (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/FxRate" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # --------------------------------------------------------- supplier-portal
  /portal/supplier/lpos:
    get:
      operationId: listSupplierLpos
      summary: List LPOs issued to the supplier
      tags: [supplier-portal]
      x-permission: portal.supplier.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of LPOs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Lpo" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /portal/supplier/deliveries:
    get:
      operationId: listSupplierDeliveries
      summary: List deliveries (GRNs) against the supplier's LPOs
      description: Shows counted and rejected quantities so disputes surface before invoicing.
      tags: [supplier-portal]
      x-permission: portal.supplier.view
      parameters:
        - name: lpoId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of GRNs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Grn" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /portal/supplier/invoices:
    post:
      operationId: submitSupplierInvoice
      summary: Submit an invoice against an LPO
      description: The eTIMS invoice number is requested and missing numbers are flagged. Triggers the three-way match.
      tags: [supplier-portal]
      x-permission: portal.supplier.invoice
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInvoice" }
      responses:
        "201":
          description: Invoice submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvoice" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /portal/supplier/payments:
    get:
      operationId: listSupplierPayments
      summary: List payment status for the supplier's invoices
      tags: [supplier-portal]
      x-permission: portal.supplier.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Payment" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /portal/supplier/statement:
    get:
      operationId: getSupplierStatement
      summary: Get the supplier's statement of account
      tags: [supplier-portal]
      x-permission: portal.supplier.view
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierStatement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ---------------------------------------------------------------- platform
  /platform/tenants:
    get:
      operationId: listTenants
      summary: List tenants (platform super admin)
      description: Cross-tenant. Runs under the audited `pmb_platform` database role.
      tags: [platform]
      x-permission: platform.tenants.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of tenants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Tenant" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /platform/tenants/{tenantId}/suspend:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      operationId: suspendTenant
      summary: Suspend a tenant (platform super admin)
      description: >-
        Blocks sign-in and API access for the tenant's members and pauses outgoing payments. Data
        is kept. Inbound provider callbacks are still stored so no payment result is lost.
      tags: [platform]
      x-permission: platform.tenants.suspend
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Tenant suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ---------------------------------------------------------------- webhooks
  /webhooks/mpesa/{channelToken}/{kind}/{requestToken}:
    parameters:
      - $ref: "#/components/parameters/ChannelToken"
      - $ref: "#/components/parameters/CallbackKind"
      - $ref: "#/components/parameters/RequestToken"
    post:
      operationId: receiveDarajaCallback
      summary: Receive a Daraja result, STK or timeout callback
      description: >-
        Daraja callbacks are not signed, so they are protected in layers: HTTPS only, an
        unguessable per-channel token **and** a per-request token in the URL, and a configurable
        Safaricom IP allowlist. Processing is **store raw, respond 200 fast, then queue**: the raw
        body is appended to `payment_callbacks` (secrets redacted) before anything else, and a
        worker processes it. The worker matches it to the stored pending request by
        `CheckoutRequestID` and `MerchantRequestID` (STK) or `ConversationID` and
        `OriginatorConversationID` (B2C, B2B, Transaction Status, Account Balance, Reversal),
        **never by phone number**, which may be masked. Unknown or unmatched callbacks are kept as
        `unmatched`, alerted and never applied. Duplicate and out-of-order callbacks are no-ops
        (monotonic state transitions and a unique M-Pesa receipt).
      tags: [webhooks]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DarajaCallback" }
      responses:
        "200":
          description: Stored and queued. Also returned for duplicates and unknown request tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DarajaAck" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /webhooks/mpesa/{channelToken}/c2b/validation:
    parameters:
      - $ref: "#/components/parameters/ChannelToken"
    post:
      operationId: validateC2bPayment
      summary: Accept or reject a Paybill payment before it completes (C2B validation)
      description: >-
        Answered **synchronously** within Daraja's timeout, so it reads only cached data. The bill
        reference (account number) must match an open project code or invoice, and the amount must
        be within the configured limits. The raw request is stored either way. Used only when
        external validation is enabled for the shortcode.
      tags: [webhooks]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/C2bPayment" }
      responses:
        "200":
          description: Accept or reject decision for Daraja
          content:
            application/json:
              schema: { $ref: "#/components/schemas/C2bValidationResponse" }
              examples:
                accept:
                  value: { ResultCode: "0", ResultDesc: Accepted }
                reject:
                  value: { ResultCode: C2B00012, ResultDesc: Rejected }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /webhooks/mpesa/{channelToken}/c2b/confirmation:
    parameters:
      - $ref: "#/components/parameters/ChannelToken"
    post:
      operationId: confirmC2bPayment
      summary: Receive a completed Paybill or Till payment (C2B confirmation)
      description: >-
        Stored raw, acknowledged and queued. Matched by `TransID` (unique) and the bill reference
        to a project or invoice, then recorded as a `confirmed` incoming payment with the M-Pesa
        receipt. Unknown references are held as unmatched for Finance to allocate.
      tags: [webhooks]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/C2bPayment" }
      responses:
        "200":
          description: Stored and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DarajaAck" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /webhooks/africastalking/ussd:
    post:
      operationId: handleUssdSession
      summary: Labourer self-service USSD menu (Africa's Talking)
      description: >-
        A stateless menu engine: the `text` path (for example `1*2`) selects the screen and session
        state lives in Redis. The labourer picks English or Kiswahili and signs in with their ID
        number and PIN (Argon2id, lockout after a configurable number of failures). Menus show
        days worked this period, amount earned, payments received and advances outstanding, for
        the caller only. Responses start with `CON` (more input) or `END` (session closed) and
        must arrive within the provider's timeout. Errors are also answered with `END` text.
        Requests must come from the provider IP allowlist with the configured service code.
      tags: [webhooks]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/UssdRequest" }
      responses:
        "200":
          description: Next USSD screen
          content:
            text/plain:
              schema: { $ref: "#/components/schemas/UssdResponse" }
              examples:
                menuSw:
                  value: "CON Karibu PM-Buddy\n1. Siku za kazi\n2. Malipo\n3. Mikopo"
                endEn:
                  value: "END You were paid KES 4,200 on 07/11/2026. Ref SKB1X2Y3Z4."
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /webhooks/africastalking/sms-delivery:
    post:
      operationId: receiveSmsDeliveryReport
      summary: Receive an SMS delivery report (Africa's Talking)
      description: >-
        Updates the notification by provider message ID. Failed payslip SMS are retried with
        backoff and can fall back to WhatsApp where the worker has opted in.
      tags: [webhooks]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SmsDeliveryReport" }
      responses:
        "200":
          description: Recorded
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /webhooks/whatsapp:
    get:
      operationId: verifyWhatsappWebhook
      summary: WhatsApp Cloud API webhook verification
      description: >-
        Echoes `hub.challenge` when `hub.mode` is `subscribe` and `hub.verify_token` matches the
        configured token.
      tags: [webhooks]
      security: []
      x-permission: public
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema: { type: string, enum: [subscribe] }
        - name: hub.verify_token
          in: query
          required: true
          schema: { type: string }
        - name: hub.challenge
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The challenge, echoed
          content:
            text/plain:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: receiveWhatsappEvents
      summary: Receive WhatsApp delivery statuses and inbound messages
      description: >-
        `X-Hub-Signature-256` (HMAC-SHA256 of the raw body with the app secret) is verified before
        anything is stored. Statuses update notifications. Inbound messages are only checked for
        opt-out keywords in this version.
      tags: [webhooks]
      security: []
      x-permission: public
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string, pattern: "^sha256=[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsappWebhookEvent" }
      responses:
        "200":
          description: Received
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /webhooks/attendance-terminals/{deviceToken}:
    parameters:
      - $ref: "#/components/parameters/TerminalDeviceToken"
    post:
      operationId: ingestTerminalPush
      summary: Ingest attendance records pushed by a biometric terminal
      description: >-
        For ZKTeco-style terminals using their push protocol, through an `AttendanceDeviceAdapter`.
        The unguessable token identifies one registered terminal on one site, the serial number
        in the payload must match the registration and an optional IP allowlist applies.
        Templates never leave the terminal: only the terminal user ID, time and verify method
        arrive. Records become attendance events with method `terminal_push` and go through the
        same anomaly rules as site-app events.
      tags: [webhooks, attendance]
      security: []
      x-permission: public
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Vendor push format, for example tab-separated ATTLOG lines
          application/json:
            schema: { $ref: "#/components/schemas/TerminalPushBatch" }
      responses:
        "200":
          description: Accepted by the adapter
          content:
            text/plain:
              schema: { type: string, examples: [OK] }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-pmb_at
      description: >-
        Web access token: a JWT (EdDSA or ES256, 10-minute TTL) with the claims `sub`, `tid`
        (active tenant), `sid`, `amr`, `auth_time` and `mfa_at`, in an httpOnly, Secure,
        SameSite=Lax cookie with Path=/. Combine with `csrfHeader` on state-changing requests.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Site-app access token with the same claims, held in memory only. The refresh token lives
        in SecureStore (Android Keystore). Refresh and sync requests also need `deviceProof`.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Double-submit CSRF token. It must equal the `__Host-pmb_csrf` cookie set by the web app,
        and `Origin` (or `Referer`) must be the app origin. Required with cookie auth on POST, PUT,
        PATCH and DELETE, including the pre-session auth endpoints; ignored on safe methods and
        for bearer callers.
    deviceProof:
      type: apiKey
      in: header
      name: X-Device-Proof
      description: >-
        Proof of possession for a registered site-app device: an Ed25519 signature, made with the
        device key in the Keystore-backed secure store, over the latest server nonce, the HTTP
        method, path, a timestamp and the body hash. Format
        `keyId=<deviceId>,nonce=<nonce>,ts=<unix>,sig=<base64url>`. The next nonce comes back in
        the `X-Device-Nonce` response header. A missing or stale nonce returns 401 with problem
        code `device-nonce-required` and a fresh nonce.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-pmb_rt
      description: >-
        Opaque, rotating refresh token (stored server-side as a SHA-256 hash) in an httpOnly,
        Secure, SameSite=Strict cookie with Path=/api/v1/auth, so it is only sent to the auth
        endpoints.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID, unique per logical operation and reused on retries. Same key and
        body replays the stored response; same key with a different body returns 422.
      schema: { type: string, format: uuid }
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      description: >-
        Action-bound token from `POST /auth/step-up`. Required on operations marked
        `x-step-up: true`. A missing or expired token, or one bound to a different action or
        amount, returns 401 `step-up-required`.
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `pageInfo.nextCursor`. Omit it for the first page.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: >-
        Language for messages, previews and rendered documents. Supported values are `en` and
        `sw`. Anything else falls back to the user's preference, then the tenant default, then
        `en`.
      schema: { type: string, default: en, examples: [sw] }
    Search:
      name: q
      in: query
      description: >-
        Case-insensitive search on names, numbers and codes (trigram index). Encrypted fields are
        only matched exactly, through blind indexes.
      schema: { type: string, minLength: 2, maxLength: 100 }
    From:
      name: from
      in: query
      description: Start of the range, inclusive (Africa/Nairobi business date)
      schema: { $ref: "#/components/schemas/BusinessDate" }
    To:
      name: to
      in: query
      description: End of the range, inclusive (Africa/Nairobi business date)
      schema: { $ref: "#/components/schemas/BusinessDate" }
    OnDate:
      name: onDate
      in: query
      description: Evaluate as of this business date. Defaults to today in Africa/Nairobi.
      schema: { $ref: "#/components/schemas/BusinessDate" }
    ProjectFilter:
      name: projectId
      in: query
      description: Limit results to one project
      schema: { $ref: "#/components/schemas/Uuid" }
    SiteFilter:
      name: siteId
      in: query
      description: Limit results to one site
      schema: { $ref: "#/components/schemas/Uuid" }
    LabourerFilter:
      name: labourerId
      in: query
      description: Limit results to one labourer
      schema: { $ref: "#/components/schemas/Uuid" }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    AdvanceId:
      name: advanceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    AnomalyId:
      name: anomalyId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BqId:
      name: bqId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BqImportJobId:
      name: bqImportJobId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BqVersionId:
      name: bqVersionId
      in: path
