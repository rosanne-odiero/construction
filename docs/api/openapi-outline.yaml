# PM-Buddy REST API: OpenAPI 3.1 outline (Phase 0, design only).
# Related: ../ARCHITECTURE.md (modules §4, tenancy §6, auth §7, RBAC §8, data §9, sync §12,
# payments §14, USSD §16, files §17) and ../ERD.md (entity and field names, camelCase here).
openapi: 3.1.0
info:
  title: PM-Buddy API
  version: 0.1.0-outline
  summary: Phase 0 outline of the PM-Buddy REST API. Design only, nothing is implemented yet.
  description: |
    Outline of the REST API for **PM-Buddy**, a multi-tenant construction project management
    SaaS for Kenya. Clients are the Next.js web app (office, client and supplier portals), the
    Expo site app (offline-first, kiosk mode) and inbound provider callbacks (Safaricom Daraja,
    Africa's Talking, WhatsApp, biometric terminals).

    Every backend module from ARCHITECTURE §4 is covered with its key operations. Schemas are
    **skeletal** (key properties only) and reuse the entity and field names from the ERD in
    camelCase. From D1.1 the Zod schemas in `packages/validation` become the source of truth and
    the NestJS app publishes the complete, generated spec at `/api/docs`.

    ## Conventions

    - **Tenant from the session, never from the request.** The active tenant is the `tid` claim
      of the access token. No tenant ID is accepted in paths, bodies or headers. The only
      exceptions are `POST /tenants` (create a company), `POST /auth/switch-tenant` (checked
      against the caller's memberships) and the cross-tenant `/platform/*` endpoints for platform
      admins. PostgreSQL row-level security on `tenant_id` backs this up (ARCHITECTURE §6).
    - **Authorisation.** `x-permission` names the permission checked by the policy guard, for
      example `payments.approve`. Project-scoped permissions are evaluated against the project in
      the path or the project that owns the resource (`ProjectMembership`). Pseudo-values:
      `public` (no session needed: pre-auth, health and webhooks, which are protected by other
      means) and `authenticated` (any signed-in principal acting on their own resources).
    - **Step-up MFA.** Operations marked `x-step-up: true` need a recent TOTP or passkey check
      that is **bound to the action** (entity ID and amount hash). Get a token from
      `POST /auth/step-up` and send it in `X-Step-Up-Token`. Otherwise the API answers `401` with
      problem type `https://pm-buddy.dev/problems/step-up-required`, which describes the action
      to confirm. Operations that accept `X-Step-Up-Token` without `x-step-up` may require it by
      tenant policy.
    - **Idempotency.** Operations marked `x-idempotent: true` (every financial POST and the sync
      push) require an `Idempotency-Key` header (UUID). Same key and same body replays the stored
      response. Same key with a different body returns `422 idempotency-key-reused`. A duplicate
      that arrives while the first request is still running returns
      `409 idempotency-request-in-progress`. Keys are kept for 24 hours (configurable).
    - **Money** is `{ "amountMinor": 125000000, "currency": "KES" }`: an integer number of minor
      units (cents), never a float. KES is the settlement currency. USD, GBP and EUR are for
      display to diaspora clients only.
    - **Decimals** (quantities, rates, percentages, coordinates) are JSON **strings** such as
      `"12.5000"`, matching `numeric(20,4)` in PostgreSQL and `decimal.js` in `packages/domain`.
    - **Dates and times** use ISO 8601 in the API. `format: date` (`YYYY-MM-DD`) is a business
      date in **Africa/Nairobi** (attendance day, pay period, valuation date). `format: date-time`
      is an RFC 3339 timestamp with offset, returned in UTC (`Z`). `DD/MM/YYYY` is display-only
      in the UI and is never accepted or returned by the API.
    - **Phone numbers** are normalised to `2547XXXXXXXX` or `2541XXXXXXXX`.
    - **IDs** are UUIDv7 strings. Site-app records use client-generated UUIDv7s so they can be
      created offline.
    - **Pagination** is cursor-based. Send `cursor` and `limit` (1 to 200, default 50). Lists
      return `{ "data": [...], "pageInfo": { "nextCursor": "...", "hasMore": true } }`. Cursors
      are opaque and stable when new rows are inserted.
    - **Errors** use RFC 9457 `application/problem+json` with the extension members `code` (a
      stable machine code), `errors[]` (field errors with a JSON Pointer) and `traceId`. Problem
      type URIs live under `https://pm-buddy.dev/problems/`.
    - **Language.** `Accept-Language: en` or `sw` selects the language for problem titles and
      details, payslip and notification previews, PDFs and exports. Data stays language-neutral.
      Unsupported languages fall back to the user's preference, then the tenant default, then
      `en`.
    - **Updates.** `PATCH` uses JSON Merge Patch (RFC 7396, `application/merge-patch+json`)
      against the resource schema; `required` does not apply to patches. Editable aggregates
      carry `version`; a stale `version` returns `409 version-conflict`.
    - **Sensitive fields** (ID numbers, KRA PINs, phone numbers, bank details, do-not-rehire
      reasons) are returned masked. Full values come only from explicit, audited reveal
      endpoints that need a `*.view_sensitive` permission and respond with
      `Cache-Control: no-store`. Biometric templates are never returned by any endpoint.
    - **Async work** (imports, exports, timesheet generation, payouts) returns `202 Accepted`
      with a `Job` or a pending resource. Payments are never final in the HTTP response: they
      become `confirmed` only from a matched Daraja result callback or a Transaction Status
      query (ARCHITECTURE §14).
    - **Rate limits.** `429` with `Retry-After`. Authentication, OTP and reveal endpoints have
      stricter per-identifier, per-IP and per-device limits.
    - **Versioning.** The major version is in the path (`/api/v1`). Changes within v1 are
      additive only.
  license:
    name: Proprietary
    identifier: LicenseRef-PM-Buddy-Proprietary
servers:
  - url: http://localhost:4000/api/v1
    description: Local development (NestJS API from docker-compose)
  - url: https://app.example.com/api/v1
    description: Production placeholder. The web app calls the API same-origin through Next.js rewrites.
security:
  - cookieAuth: []
    csrfHeader: []
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes for orchestrators and load balancers.
  - name: auth
    description: >-
      Sign-up, identifier verification, OTP, password login, logout, rotating refresh tokens,
      password reset and active-tenant switching.
  - name: mfa
    description: >-
      TOTP and passkey (WebAuthn) enrolment and sign-in, recovery codes and action-bound step-up.
      MFA is mandatory for Owner/Director, Finance and Admin roles.
  - name: sessions
    description: >-
      The caller's sessions, and site-app device binding (Ed25519 key pairs used for request
      proofs and signed offline records).
  - name: tenancy
    description: >-
      Companies (tenants), invitations, memberships and project-scoped role assignments with
      approval limits.
  - name: users-roles
    description: The signed-in principal, the role catalogue and the permission catalogue.
  - name: audit
    description: Append-only, hash-chained audit log of every change, approval, login and export.
  - name: config-rules
    description: >-
      Effective-dated, scoped and versioned configuration: generic config rules, statutory rules
      with bands, public holidays and overtime rules. Changes need maker-checker approval.
  - name: projects
    description: Projects, work breakdown structure (WBS), milestones and the project dashboard.
  - name: sites
    description: Sites and their GPS geofences (polygon or radius), versioned by effective date.
  - name: schedule
    description: Gantt schedule, activity dependencies, baselines and the delay log.
  - name: bq
    description: >-
      Bill of Quantities: the Excel import pipeline with column mapping and totals
      reconciliation, versions, the bill, section and item tree, exports and rate build-ups.
  - name: variations
    description: >-
      Architect's and Engineer's Instructions, Variation Orders with approval and client decision,
      and original vs revised contract sum.
  - name: progress-valuations
    description: >-
      Progress measurement against BQ items, earned value (EVM) and S-curve, interim valuations,
      payment certificates and retention.
  - name: labour
    description: >-
      Labourer registry (sensitive fields masked), accreditations, trades, rates, gangs and daily
      assignments, ledgers, do-not-rehire and productivity.
  - name: consent-biometrics
    description: >-
      Data Protection Act controls: consent capture and withdrawal, biometric enrolments behind a
      DPIA gate, encrypted roster templates for kiosks and data subject requests.
  - name: attendance
    description: >-
      Attendance devices, events and the muster roll, anomaly review, manual overrides and
      timesheets.
  - name: sync
    description: Offline-first push and pull sync for the site app, with signed records.
  - name: payroll
    description: >-
      Pay periods, payroll batches with maker-checker approval, payslips, statutory exports,
      salary advances and piece-rate jobs.
  - name: payments
    description: >-
      Safaricom Daraja through the PaymentProvider interface (STK Push, C2B, B2C, B2B, Transaction
      Status, Account Balance, Reversal), plus recorded cash and bank payments.
  - name: reconciliation
    description: M-Pesa statement uploads and reconciliation runs (matched, unmatched, disputed).
  - name: procurement
    description: >-
      Material catalogue and units, suppliers, price history, requisitions, RFQs and quotations,
      LPOs, goods received notes, supplier invoices (eTIMS) and three-way match.
  - name: stores
    description: >-
      Site stores, the append-only stock ledger, issues, returns, transfers, stock takes and
      material variance.
  - name: finance
    description: >-
      Cost entries, budgets and commitments, petty cash, the M-Pesa SMS parser, budget vs actual
      and the cash-flow forecast.
  - name: site-diary-photos
    description: Daily site diaries with approval and locking, and server-verified progress photos.
  - name: quality-safety
    description: >-
      Inspections, test results, snags, safety incidents, corrective actions, toolbox talks, PPE
      issues and inductions.
  - name: plant
    description: Plant and equipment register, usage, fuel issues and maintenance.
  - name: documents-compliance
    description: Versioned document repository and the compliance register with expiry reminders.
  - name: notifications
    description: EN/SW notification templates, per-user preferences and the notification log.
  - name: alerts
    description: One inbox for anomalies and thresholds (budget, variance, payouts, expiries).
  - name: reports
    description: Report catalogue, PDF/Excel/CSV export jobs, scheduled reports and the owner dashboard.
  - name: files
    description: Pre-signed uploads to quarantine, malware scanning, and short-lived download URLs.
  - name: client-portal
    description: >-
      Client and project-owner portal, built for diaspora clients: progress, verified photos,
      statements, STK Push payments, variation decisions and FX display.
  - name: supplier-portal
    description: Supplier portal for LPOs, deliveries, invoices, payment status and statements.
  - name: platform
    description: Cross-tenant administration for platform super admins only (separate, audited DB role).
  - name: webhooks
    description: >-
      Inbound provider callbacks with `security: []`, protected by unguessable URL tokens, IP
      allowlists and provider signatures where available. Raw payloads are stored (secrets
      redacted), acknowledged fast and processed from a queue.
paths:
  # ------------------------------------------------------------------ health
  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: The process is up and its event loop responds. No dependency checks.
      tags: [health]
      security: []
      x-permission: public
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Checks PostgreSQL (through PgBouncer), Redis, object storage and the queue backlog
        threshold. Returns 503 with the failing checks when the instance should not get traffic.
      tags: [health]
      security: []
      x-permission: public
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Not ready. At least one dependency check failed.
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  # -------------------------------------------------------------------- auth
  /auth/sign-up:
    post:
      operationId: signUp
      summary: Sign up with an email or phone number and a password
      description: >-
        Creates an unverified user and sends a verification OTP (SMS or WhatsApp for phones, email
        otherwise). The response is the same whether or not the identifier is already registered,
        to prevent account enumeration. Passwords are hashed with Argon2id, must be 12 to 128
        characters and are checked against breached-password lists. The company is created
        afterwards with `POST /tenants`.
      tags: [auth]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "202":
          description: Accepted. A verification OTP is sent if the identifier can be used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpDispatch" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verify:
    post:
      operationId: verifyIdentifier
      summary: Verify an email or phone number with an OTP
      description: >-
        Confirms the OTP sent at sign-up (or by `POST /auth/otp` with purpose `verify`) and signs
        the user in. Browsers receive the session in cookies. Registered site-app devices (requests
        with a valid `X-Device-Proof`) also receive tokens in the body.
      tags: [auth]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerifyRequest" }
      responses:
        "200":
          description: Verified and signed in, or MFA enrolment is required next
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/otp:
    post:
      operationId: sendOtp
      summary: Send a one-time code by SMS, WhatsApp or email
      description: >-
        Six digits, valid for five minutes, stored hashed and rate-limited per identifier, IP and
        device. Purposes are `verify`, `login` (second factor for low-privilege roles only),
        `password_reset` and `payout_phone_change`. Always returns 202 to prevent enumeration.
      tags: [auth]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpSendRequest" }
      responses:
        "202":
          description: Accepted. The code is sent if the identifier and purpose are valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpDispatch" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      operationId: login
      summary: Sign in with an identifier and password
      description: >-
        Returns `authenticated` with session cookies (`__Host-pmb_at` access token, 10-minute TTL,
        and `__Secure-pmb_rt` refresh token), `mfa_required` with a short-lived single-use
        `mfaToken` and the allowed methods, or `mfa_enrolment_required` for privileged roles that
        have no factor yet (the session can then only call the MFA enrolment endpoints). Failed
        attempts count towards a lockout with exponential backoff.
      tags: [auth]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in, or a second factor or MFA enrolment is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out of the current session
      description: Revokes the session and its refresh-token family and clears the auth cookies.
      tags: [auth]
      x-permission: authenticated
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: >-
        Refresh tokens are opaque 256-bit values, stored as SHA-256 hashes and **rotated on every
        use**. Presenting a token that was already used revokes the whole token family and alerts
        the user. Browsers send the `__Secure-pmb_rt` cookie (Path=/api/v1/auth). The site app
        sends the token in the body together with `X-Device-Proof`.
      tags: [auth]
      security:
        - refreshCookie: []
          csrfHeader: []
        - deviceProof: []
      x-permission: public
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New access token (and rotated refresh token) issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset code
      description: Always returns 202 to prevent account enumeration. Sends an OTP if the account exists.
      tags: [auth]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpDispatch" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with the reset code
      description: >-
        Revokes every session and refresh-token family of the user. MFA is still required at the
        next sign-in.
      tags: [auth]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/switch-tenant:
    post:
      operationId: switchTenant
      summary: Switch the active tenant of the session
      description: >-
        Re-issues the access token with a new `tid` claim after checking that the caller has an
        active membership in that tenant. This is the only way the tenant context changes; no
        other endpoint reads a tenant ID from the request.
      tags: [auth]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchTenantRequest" }
      responses:
        "200":
          description: Session now points at the requested tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # --------------------------------------------------------------------- mfa
  /auth/login/mfa:
    post:
      operationId: completeLoginMfa
      summary: Complete sign-in with a TOTP, recovery or OTP code
      description: >-
        Exchanges the `mfaToken` from `POST /auth/login` and a second-factor code for a full
        session. SMS OTP is accepted only for roles that do not require TOTP or passkey MFA.
        Passkeys use `POST /auth/passkeys/authentication/verify` instead.
      tags: [mfa]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginMfaRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/passkeys/authentication/options:
    post:
      operationId: getPasskeyAuthenticationOptions
      summary: Get WebAuthn options to sign in or step up with a passkey
      description: >-
        Purpose `login` (usernameless, or with an identifier), `second_factor` (with the
        `mfaToken` from password sign-in) or `step_up` (needs a session; the challenge is derived
        from the action hash, so the assertion confirms that specific action). Challenges are
        single use and expire after five minutes.
      tags: [mfa]
      security:
        - cookieAuth: []
          csrfHeader: []
        - bearerAuth: []
        - csrfHeader: []
        - {}
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyAuthenticationOptionsRequest" }
      responses:
        "200":
          description: PublicKeyCredentialRequestOptionsJSON for `navigator.credentials.get()`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/passkeys/authentication/verify:
    post:
      operationId: verifyPasskeyAuthentication
      summary: Sign in with a passkey assertion
      description: >-
        Verifies the assertion for purpose `login` or `second_factor` and establishes the
        session. Assertions for purpose `step_up` are sent to `POST /auth/step-up` instead.
      tags: [mfa]
      security: [{ csrfHeader: [] }, {}]
      x-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyAssertion" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/step-up:
    post:
      operationId: stepUp
      summary: Confirm a sensitive action with TOTP or a passkey
      description: >-
        Returns a short-lived, single-use step-up token **bound to the action**. It carries a hash
        of the action type, entity ID and amount (for example a payroll batch ID and its net
        total), a lightweight form of transaction signing. Send it as `X-Step-Up-Token` with the
        sensitive request. The validity window is configurable (`auth.step_up.max_age`).
      tags: [mfa]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpRequest" }
      responses:
        "200":
          description: Step-up token for exactly this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepUpGrant" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mfa/totp:
    post:
      operationId: startTotpEnrolment
      summary: Start TOTP enrolment
      description: >-
        Creates a pending TOTP factor (RFC 6238) and returns the `otpauth://` URI and secret
        **once**. Activate it with `POST /mfa/totp/{factorId}/verify`. Adding a factor when one is
        already active needs step-up; the first, mandatory enrolment does not.
      tags: [mfa]
      x-permission: authenticated
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "201":
          description: Pending TOTP factor created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrolment" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mfa/totp/{factorId}/verify:
    parameters:
      - $ref: "#/components/parameters/FactorId"
    post:
      operationId: verifyTotpEnrolment
      summary: Activate a TOTP factor with its first code
      description: Activating the user's first factor also returns one-time recovery codes.
      tags: [mfa]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeRequest" }
      responses:
        "200":
          description: Factor active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaActivation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mfa/passkeys/registration/options:
    post:
      operationId: getPasskeyRegistrationOptions
      summary: Get WebAuthn options to register a passkey
      description: Same step-up rule as TOTP enrolment. Excludes credentials already registered.
      tags: [mfa]
      x-permission: authenticated
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "200":
          description: PublicKeyCredentialCreationOptionsJSON for `navigator.credentials.create()`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyOptions" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /mfa/passkeys/registration/verify:
    post:
      operationId: verifyPasskeyRegistration
      summary: Register a passkey from the attestation response
      tags: [mfa]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRegistrationRequest" }
      responses:
        "201":
          description: Passkey registered and active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaActivation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Regenerate one-time recovery codes
      description: Invalidates all previous codes. New codes are shown once and stored hashed.
      tags: [mfa]
      x-permission: authenticated
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "200":
          description: New recovery codes
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  # ---------------------------------------------------------------- sessions
  /sessions:
    get:
      operationId: listSessions
      summary: List the caller's active sessions
      tags: [sessions]
      x-permission: authenticated
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of sessions. The current session is flagged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Session" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: revokeSession
      summary: Revoke one of the caller's sessions
      description: >-
        Revokes the session and its refresh-token family. Revoking the current session signs the
        caller out.
      tags: [sessions]
      x-permission: authenticated
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices:
    post:
      operationId: registerDevice
      summary: Bind a site-app phone or kiosk tablet
      description: >-
        The site app generates an Ed25519 key pair in the Android Keystore-backed secure store
        and sends the public key. Kiosks and shared site phones also send the one-time
        provisioning code from the QR shown by `POST /sites/{siteId}/attendance-devices`, which
        binds the device to that site. From then on, refresh and sync requests carry
        `X-Device-Proof`, and the response header `X-Device-Nonce` supplies the next nonce.
      tags: [sessions]
      security: [{ bearerAuth: [] }]
      x-permission: devices.register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "201":
          description: Device registered
          headers:
            X-Device-Nonce: { $ref: "#/components/headers/DeviceNonce" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /devices/{deviceId}/revoke:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      operationId: revokeDevice
      summary: Revoke a lost or retired device
      description: >-
        Revokes the device key, its sessions and its site binding. Pushes and proofs signed by a
        revoked key are rejected and raise an alert.
      tags: [sessions]
      x-permission: devices.revoke
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Device revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ----------------------------------------------------------------- tenancy
  /tenants:
    post:
      operationId: createTenant
      summary: Create a company (tenant)
      description: >-
        Creates the tenant, makes the caller its Owner/Director and switches the session to it.
        The caller's identifier must be verified. The Owner role requires MFA, so a caller without
        a factor is moved to `mfa_enrolment_required` until they enrol one.
      tags: [tenancy]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Tenant" }
      responses:
        "201":
          description: Tenant created; the session now points at it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /tenant:
    get:
      operationId: getCurrentTenant
      summary: Get the active tenant
      description: The tenant comes from the session (`tid`), so there is no tenant ID in the path.
      tags: [tenancy]
      x-permission: tenant.view
      responses:
        "200":
          description: Active tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateCurrentTenant
      summary: Update the active tenant's profile
      description: Name, legal name, KRA PIN, NCA registration and default locale (`en` or `sw`).
      tags: [tenancy]
      x-permission: tenant.manage
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/Tenant" }
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /invitations:
    post:
      operationId: createInvitation
      summary: Invite a person by email or phone
      description: >-
        Staff, client, supplier or consultant invitations, optionally scoped to one project with a
        role and approval limit. The token goes out by email, SMS or WhatsApp, is stored as a
        SHA-256 hash and expires after a configurable time. Roles that require MFA force
        enrolment at first sign-in.
      tags: [tenancy]
      x-permission: users.invite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Invitation" }
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: >-
        The invitee must be signed in with the invited, verified email or phone. Creates the
        membership and, for project-scoped invitations, the project membership.
      tags: [tenancy]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAccept" }
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /memberships:
    get:
      operationId: listMemberships
      summary: List members of the active tenant
      tags: [tenancy]
      x-permission: users.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          schema: { type: string, enum: [staff, client, supplier, consultant] }
        - name: status
          in: query
          schema: { type: string, enum: [invited, active, suspended] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of memberships with user summaries and tenant-wide roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Membership" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /memberships/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/MembershipId"
    patch:
      operationId: updateMembership
      summary: Change a member's tenant-wide roles, approval limits or status
      description: >-
        Privilege changes need step-up. Removing the last Owner is refused with 409. Suspending a
        membership revokes the member's sessions for this tenant.
      tags: [tenancy]
      x-permission: users.manage_roles
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/Membership" }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/memberships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectMemberships
      summary: List the project team
      tags: [tenancy, projects]
      x-permission: projects.view_team
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of project memberships
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/ProjectMembership" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: assignProjectMembership
      summary: Assign a member to the project with a role and approval limit
      description: >-
        Project roles add to tenant-wide roles for this project only. `approvalLimit` caps what the
        member can approve, for example `payments.approve` up to KES 2,000,000. Needs step-up
        because it can grant approval rights.
      tags: [tenancy, projects]
      x-permission: projects.manage_team
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectMembership" }
      responses:
        "201":
          description: Member assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMembership" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ------------------------------------------------------------- users-roles
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in principal
      description: >-
        Profile, active tenant, memberships across tenants, effective tenant-wide permissions,
        project roles, MFA state and the current session. The web app uses it to build navigation;
        the API still enforces every permission on every call.
      tags: [users-roles]
      x-permission: authenticated
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /roles:
    get:
      operationId: listRoles
      summary: List system and custom roles with their permissions
      tags: [users-roles]
      x-permission: users.view
      responses:
        "200":
          description: Roles (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Role" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /permissions:
    get:
      operationId: listPermissions
      summary: List the permission catalogue
      description: Seeded from `packages/types`. The `module` filter matches the backend module names.
      tags: [users-roles]
      x-permission: users.view
      parameters:
        - name: module
          in: query
          schema: { type: string, examples: [payments] }
      responses:
        "200":
          description: Permissions (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Permission" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ------------------------------------------------------------------- audit
  /audit-log:
    get:
      operationId: listAuditLog
      summary: Search the audit log
      description: >-
        Append-only and hash-chained per tenant (`prevHash`, `hash`). Filters combine with AND.
        Exports go through `POST /reports/exports` (type `audit_log`) and are audited themselves.
      tags: [audit]
      x-permission: audit.view
      parameters:
        - name: entityType
          in: query
          schema: { type: string, examples: [payroll_batch] }
        - name: entityId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: actorUserId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: action
          in: query
          schema:
            type: string
            enum: [create, update, delete, approve, reject, login, export, reveal, override]
        - $ref: "#/components/parameters/ProjectFilter"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of audit entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/AuditLogEntry" } } }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ------------------------------------------------------------ config-rules
  /config-rules:
    get:
      operationId: listConfigRules
      summary: List configuration rule versions
      tags: [config-rules]
      x-permission: config.view
      parameters:
        - name: key
          in: query
          schema: { type: string, examples: [payroll.shif] }
        - name: scope
          in: query
          schema: { type: string, enum: [platform, tenant, project] }
        - name: complianceStatus
          in: query
          schema: { type: string, enum: [draft, needs_review, approved] }
        - $ref: "#/components/parameters/OnDate"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of rule versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/ConfigRule" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: proposeConfigRule
      summary: Propose a new configuration rule version
      description: >-
        Creates a version in `draft` or `needs_review`. The value is validated against the Zod
        schema registered for the key, and overlapping effective ranges at the same scope are
        rejected. Keys under `payroll.*` and `mpesa.*` need `config.manage_statutory`. Approved
        versions are immutable; corrections are new versions.
      tags: [config-rules]
      x-permission: config.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigRule" }
      responses:
        "201":
          description: Proposed version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRule" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /config-rules/resolve:
    get:
      operationId: resolveConfigRule
      summary: Resolve the effective value of a key
      description: >-
        Returns the most specific approved version active on `onDate` (project, then tenant, then
        platform) and its version ID, which calculations store as a snapshot. A fallback to an
        unapproved version is flagged so the UI can show the COMPLIANCE-REVIEW banner.
      tags: [config-rules]
      x-permission: config.view
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string, examples: [bq.vat.rate] }
        - $ref: "#/components/parameters/ProjectFilter"
        - $ref: "#/components/parameters/OnDate"
      responses:
        "200":
          description: Effective value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedConfigRule" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /config-rules/{configRuleId}/approve:
    parameters:
      - $ref: "#/components/parameters/ConfigRuleId"
    post:
      operationId: approveConfigRule
      summary: Approve a proposed configuration rule version (maker-checker)
      description: >-
        The approver must differ from the proposer. Step-up is always enforced for statutory,
        payment-limit and tariff keys, and for other keys when tenant policy says so. Approval
        never changes records that already snapshot an earlier version.
      tags: [config-rules]
      x-permission: config.approve
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Version approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRule" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /statutory-rules:
    get:
      operationId: listStatutoryRules
      summary: List statutory rules with their bands
      description: >-
        PAYE, NSSF, SHIF, Affordable Housing Levy and NITA. Every seed value is COMPLIANCE-REVIEW
        until a human approves it (brief §6).
      tags: [config-rules]
      x-permission: config.view
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [paye, nssf, shif, ahl, nita] }
        - $ref: "#/components/parameters/OnDate"
      responses:
        "200":
          description: Statutory rule versions (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/StatutoryRule" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: proposeStatutoryRule
      summary: Propose a statutory rule version with its bands
      tags: [config-rules]
      x-permission: config.manage_statutory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatutoryRule" }
      responses:
        "201":
          description: Proposed version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatutoryRule" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /statutory-rules/{statutoryRuleId}/approve:
    parameters:
      - $ref: "#/components/parameters/StatutoryRuleId"
    post:
      operationId: approveStatutoryRule
      summary: Approve a statutory rule version (maker-checker, step-up)
      tags: [config-rules]
      x-permission: config.manage_statutory
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Version approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatutoryRule" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /public-holidays:
    get:
      operationId: listPublicHolidays
      summary: List public holidays
      tags: [config-rules]
      x-permission: config.view
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Holidays in the range (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/PublicHoliday" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPublicHoliday
      summary: Add a gazetted or ad hoc public holiday
      description: Takes effect for timesheets that are not yet approved. Approved timesheets keep their snapshot.
      tags: [config-rules]
      x-permission: config.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicHoliday" }
      responses:
        "201":
          description: Holiday added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicHoliday" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /overtime-rules:
    get:
      operationId: listOvertimeRules
      summary: List overtime rules
      tags: [config-rules]
      x-permission: config.view
      parameters:
        - $ref: "#/components/parameters/OnDate"
      responses:
        "200":
          description: Overtime rule versions (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/OvertimeRule" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: proposeOvertimeRule
      summary: Propose an overtime rule version
      description: >-
        Weekday, rest-day and public-holiday thresholds and multipliers. Stays `needs_review`
        (COMPLIANCE-REVIEW) until approved with `POST /overtime-rules/{overtimeRuleId}/approve`.
      tags: [config-rules]
      x-permission: config.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OvertimeRule" }
      responses:
        "201":
          description: Proposed version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OvertimeRule" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /overtime-rules/{overtimeRuleId}/approve:
    parameters:
      - $ref: "#/components/parameters/OvertimeRuleId"
    post:
      operationId: approveOvertimeRule
      summary: Approve an overtime rule version (maker-checker)
      tags: [config-rules]
      x-permission: config.approve
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Version approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OvertimeRule" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ---------------------------------------------------------------- projects
  /projects:
    get:
      operationId: listProjects
      summary: List projects the caller can see
      description: >-
        Roles with tenant-wide access see every project. Everyone else sees only the projects
        they are a member of.
      tags: [projects]
      x-permission: projects.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { type: string, enum: [planning, active, practical_completion, dlp, closed] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Project" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createProject
      summary: Create a project
      description: >-
        The `code` is unique in the tenant and doubles as the M-Pesa C2B account number. Send an
        existing `clientId` or a new `client` inline. Sites are added next.
      tags: [projects]
      x-permission: projects.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Project" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      x-permission: projects.view
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      summary: Update a project
      description: >-
        Once a BQ version is approved, the contract sum is derived from BQ versions and approved
        variations and cannot be patched directly.
      tags: [projects]
      x-permission: projects.manage
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/Project" }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectDashboard
      summary: Get the project status dashboard
      description: >-
        Percent complete, budget burn, cash position, labour on site today, open issues and
        alerts. Served from read models refreshed by jobs; `asOf` shows how fresh they are.
      tags: [projects]
      x-permission: projects.view_dashboard
      parameters:
        - $ref: "#/components/parameters/OnDate"
      responses:
        "200":
          description: Project KPIs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/wbs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listWbsNodes
      summary: List the work breakdown structure
      description: A flat list ordered by `sort`, with `parentId` to build the tree.
      tags: [projects]
      x-permission: projects.view
      responses:
        "200":
          description: WBS nodes (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/WbsNode" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createWbsNode
      summary: Add a WBS node (phase or work package)
      tags: [projects]
      x-permission: projects.manage_plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WbsNode" }
      responses:
        "201":
          description: Node created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WbsNode" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listMilestones
      summary: List milestones
      tags: [projects]
      x-permission: projects.view
      responses:
        "200":
          description: Milestones (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Milestone" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMilestone
      summary: Add a milestone
      description: >-
        Payment-linked milestones feed the cash-flow forecast and appear on the client portal.
      tags: [projects]
      x-permission: projects.manage_plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Milestone" }
      responses:
        "201":
          description: Milestone created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ------------------------------------------------------------------- sites
  /projects/{projectId}/sites:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listSites
      summary: List the project's sites
      tags: [sites]
      x-permission: projects.view
      responses:
        "200":
          description: Sites (single page) with their active geofence
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Site" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createSite
      summary: Add a site to the project
      description: >-
        Add a geofence next with `POST /sites/{siteId}/geofences`. Attendance checks and photo
        verification need one.
      tags: [sites]
      x-permission: sites.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Site" }
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sites/{siteId}/geofences:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listGeofences
      summary: List a site's geofence versions
      tags: [sites]
      x-permission: projects.view
      responses:
        "200":
          description: Geofence versions, newest first (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Geofence" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createGeofence
      summary: Set a new geofence version for the site
      description: >-
        A GeoJSON polygon (WGS 84) or a centre plus radius. The new version applies from
        `activeFrom`; earlier events keep the result computed with the version active at the
        time. Site devices receive it on the next sync pull for offline checks.
      tags: [sites]
      x-permission: sites.manage_geofence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Geofence" }
      responses:
        "201":
          description: Geofence version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Geofence" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------- schedule
  /projects/{projectId}/schedule:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getSchedule
      summary: Get the Gantt schedule
      description: >-
        Activities, dependencies, the selected baseline (for baseline vs actual bars) and the
        delay log, in one payload for the Gantt view.
      tags: [schedule]
      x-permission: schedule.view
      parameters:
        - name: baselineId
          in: query
          description: Baseline to compare against. Defaults to the latest baseline.
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/schedule/activities:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createScheduleActivity
      summary: Add a schedule activity
      tags: [schedule]
      x-permission: schedule.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleActivity" }
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleActivity" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schedule/activities/{activityId}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    patch:
      operationId: updateScheduleActivity
      summary: Update an activity's dates or progress
      tags: [schedule]
      x-permission: schedule.edit
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/ScheduleActivity" }
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleActivity" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /schedule/activities/{activityId}/predecessors:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    put:
      operationId: setActivityPredecessors
      summary: Replace an activity's predecessor links
      description: FS, SS, FF or SF links with a lag in days. A cycle is rejected with 409 `dependency-cycle`.
      tags: [schedule]
      x-permission: schedule.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityPredecessors" }
      responses:
        "200":
          description: Links saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPredecessors" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/schedule/baselines:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: captureScheduleBaseline
      summary: Freeze the current plan as a named baseline
      tags: [schedule]
      x-permission: schedule.baseline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleBaseline" }
      responses:
        "201":
          description: Baseline captured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleBaseline" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schedule/activities/{activityId}/delay-events:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      operationId: recordDelayEvent
      summary: Log a delay against an activity
      description: >-
        Causes are rain, materials, late payment, approvals, design change or other. Delays
        recorded in the site diary create the same record.
      tags: [schedule]
      x-permission: schedule.record_delay
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelayEvent" }
      responses:
        "201":
          description: Delay logged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelayEvent" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ---------------------------------------------------------------------- bq
  /projects/{projectId}/bq-imports:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: uploadBqImport
      summary: Upload a BQ workbook (.xlsx) to start an import
      description: >-
        Multipart upload of an `.xlsx` file (type sniffed from magic bytes, malware-scanned, size
        limit configurable). Parsing runs in a sandboxed worker with row and cell limits. Next
        steps are sheets and preview, column mapping, validation (totals reconciliation) and
        commit. Send `bqId` to create a new version of an existing BQ, or `bqName` for a new BQ.
      tags: [bq]
      x-permission: bq.import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BqImportUpload" }
      responses:
        "202":
          description: Upload accepted; parsing runs in the background
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqImportJob" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /bq-imports/{bqImportJobId}:
    parameters:
      - $ref: "#/components/parameters/BqImportJobId"
    get:
      operationId: getBqImportJob
      summary: Get an import job's status, totals and issues
      tags: [bq]
      x-permission: bq.import
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bq-imports/{bqImportJobId}/sheets:
    parameters:
      - $ref: "#/components/parameters/BqImportJobId"
    get:
      operationId: getBqImportSheets
      summary: List workbook sheets with preview rows for the mapping screen
      description: >-
        Sheet names, row counts, the detected header row, suggested column mapping and raw
        preview rows (cell values as strings), so the QS can map columns for any format.
      tags: [bq]
      x-permission: bq.import
      parameters:
        - name: sheetName
          in: query
          description: Return preview rows for this sheet only
          schema: { type: string }
        - name: previewRows
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Sheets and preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqImportSheets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bq-imports/{bqImportJobId}/mapping:
    parameters:
      - $ref: "#/components/parameters/BqImportJobId"
    put:
      operationId: setBqImportMapping
      summary: Save the column mapping for the import
      description: >-
        Maps spreadsheet columns to item ref, description, unit, quantity, rate, amount and notes,
        and sets how bills and sections are detected. Can be saved as a reusable template for a
        QS firm's format. Moves the job to `mapped`.
      tags: [bq]
      x-permission: bq.import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ColumnMapping" }
      responses:
        "200":
          description: Mapping saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqImportJob" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bq-imports/{bqImportJobId}/validate:
    parameters:
      - $ref: "#/components/parameters/BqImportJobId"
    post:
      operationId: validateBqImport
      summary: Validate the mapped import and reconcile totals
      description: >-
        Recomputes every amount (quantity x rate) and every bill and section total and compares
        them with the totals in the sheet. Returns row-level issues (unknown units, missing rates,
        amount mismatches, orphan items) and whether the grand totals match. Moves the job to
        `validated` when there are no blocking errors.
      tags: [bq]
      x-permission: bq.import
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqImportValidation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bq-imports/{bqImportJobId}/commit:
    parameters:
      - $ref: "#/components/parameters/BqImportJobId"
    post:
      operationId: commitBqImport
      summary: Commit a validated import as a draft BQ version
      description: >-
        Creates the bill, section and item hierarchy as a `draft` BQ version. Refused with 409
        `bq-import-has-errors` while blocking issues remain, or `bq-totals-mismatch` when the
        totals differ, unless `acceptTotalsDifference` is set with a reason (audited).
      tags: [bq]
      x-permission: bq.import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BqImportCommit" }
      responses:
        "201":
          description: Draft BQ version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqVersion" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/bq-versions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listBqVersions
      summary: List BQ versions of the project
      tags: [bq]
      x-permission: bq.view
      parameters:
        - name: bqId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: status
          in: query
          schema: { type: string, enum: [draft, approved, superseded] }
      responses:
        "200":
          description: BQ versions, newest first (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/BqVersion" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bq-versions/{bqVersionId}/approve:
    parameters:
      - $ref: "#/components/parameters/BqVersionId"
    post:
      operationId: approveBqVersion
      summary: Approve a draft BQ version
      description: >-
        Maker-checker: the approver must differ from the person who imported or edited it. The
        approved version becomes current and the previous one is superseded. Item `lineageId`
        values keep progress and costs linked across versions.
      tags: [bq]
      x-permission: bq.approve
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Version approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bq-versions/{bqVersionId}/tree:
    parameters:
      - $ref: "#/components/parameters/BqVersionId"
    get:
      operationId: getBqTree
      summary: Get the bill, section and item hierarchy
      description: >-
        Bills (preliminaries, measured work, provisional sums, PC sums, contingencies, dayworks)
        with sections and items, totals per node, VAT and the contract sum. Large BQs can be
        loaded one bill at a time with `billId`.
      tags: [bq]
      x-permission: bq.view
      parameters:
        - name: billId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: depth
          in: query
          schema: { type: string, enum: [bills, sections, items], default: items }
      responses:
        "200":
          description: BQ tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqTree" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bq-versions/{bqVersionId}/exports:
    parameters:
      - $ref: "#/components/parameters/BqVersionId"
    post:
      operationId: exportBqVersion
      summary: Export a BQ version to Excel or PDF
      tags: [bq]
      x-permission: bq.export
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /rate-buildups:
    get:
      operationId: listRateBuildUps
      summary: List rate build-ups
      tags: [bq]
      x-permission: bq.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of rate build-ups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/RateBuildUp" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRateBuildUp
      summary: Create a rate build-up
      description: >-
        For example 1 m³ of class 25 concrete (1:2:4) = X bags of cement + Y t of sand + Z t of
        ballast + labour hours, with wastage. Used to compute theoretical material consumption
        from measured progress.
      tags: [bq]
      x-permission: bq.manage_buildups
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateBuildUp" }
      responses:
        "201":
          description: Build-up created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateBuildUp" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rate-buildups/{rateBuildUpId}:
    parameters:
      - $ref: "#/components/parameters/RateBuildUpId"
    get:
      operationId: getRateBuildUp
      summary: Get a rate build-up with its components
      tags: [bq]
      x-permission: bq.view
      responses:
        "200":
          description: Rate build-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateBuildUp" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceRateBuildUp
      summary: Replace a rate build-up
      description: >-
        Creates a new revision. Variance figures already computed keep the revision they used.
      tags: [bq]
      x-permission: bq.manage_buildups
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateBuildUp" }
      responses:
        "200":
          description: Build-up replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateBuildUp" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteRateBuildUp
      summary: Delete an unused rate build-up
      description: Soft delete. Refused with 409 while items in an approved BQ version reference it.
      tags: [bq]
      x-permission: bq.manage_buildups
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # -------------------------------------------------------------- variations
  /projects/{projectId}/instructions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listInstructions
      summary: List Architect's and Engineer's Instructions
      tags: [variations]
      x-permission: variations.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of instructions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Instruction" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createInstruction
      summary: Record an instruction (AI or EI)
      description: >-
        Consultants issue instructions directly in the web app. Staff record instructions
        received on paper together with the scanned file.
      tags: [variations]
      x-permission: variations.manage_instructions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Instruction" }
      responses:
        "201":
          description: Instruction recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /instructions/{instructionId}:
    parameters:
      - $ref: "#/components/parameters/InstructionId"
    patch:
      operationId: updateInstruction
      summary: Update an instruction
      tags: [variations]
      x-permission: variations.manage_instructions
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/Instruction" }
      responses:
        "200":
          description: Updated instruction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instruction" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteInstruction
      summary: Delete an instruction that has no variation orders
      description: Soft delete. Refused with 409 once a variation order references it.
      tags: [variations]
      x-permission: variations.manage_instructions
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/variation-orders:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listVariationOrders
      summary: List variation orders with their lines
      tags: [variations]
      x-permission: variations.view
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, submitted, approved, rejected] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of variation orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/VariationOrder" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createVariationOrder
      summary: Draft a variation order linked to an instruction
      description: >-
        Lines add, omit or adjust BQ items (matched by `bqItemLineageId`) or add new items. The
        amount can be positive or negative.
      tags: [variations]
      x-permission: variations.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariationOrder" }
      responses:
        "201":
          description: Draft variation order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariationOrder" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /variation-orders/{variationOrderId}/submit:
    parameters:
      - $ref: "#/components/parameters/VariationOrderId"
    post:
      operationId: submitVariationOrder
      summary: Submit a draft variation order for approval
      tags: [variations]
      x-permission: variations.create
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariationOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /variation-orders/{variationOrderId}/approve:
    parameters:
      - $ref: "#/components/parameters/VariationOrderId"
    post:
      operationId: approveVariationOrder
      summary: Approve a variation order
      description: >-
        Maker-checker: the approver must differ from the author. Produces a new BQ version (source
        `variation`) and updates the revised contract sum. Where the contract needs the client's
        consent, `clientDecision` is tracked separately and shown on the client portal.
      tags: [variations]
      x-permission: bq.approve_variation
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariationOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /variation-orders/{variationOrderId}/reject:
    parameters:
      - $ref: "#/components/parameters/VariationOrderId"
    post:
      operationId: rejectVariationOrder
      summary: Reject a variation order
      tags: [variations]
      x-permission: bq.approve_variation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariationOrder" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /variation-orders/{variationOrderId}/client-decision:
    parameters:
      - $ref: "#/components/parameters/VariationOrderId"
    post:
      operationId: recordVariationClientDecision
      summary: Record a client decision received outside the portal
      description: >-
        For decisions sent by letter or email, with the evidence file. Clients deciding in the
        portal use `POST /portal/client/projects/{projectId}/variation-orders/{variationOrderId}/decision`.
      tags: [variations]
      x-permission: variations.record_client_decision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientDecision" }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariationOrder" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bqs/{bqId}/comparison:
    parameters:
      - $ref: "#/components/parameters/BqId"
    get:
      operationId: compareBqVersions
      summary: Compare BQ versions (original vs revised contract sum)
      description: >-
        Defaults to the first approved version against the current one. Shows totals by bill, the
        effect of each approved variation order, and the original and revised contract sums.
      tags: [variations]
      x-permission: bq.view
      parameters:
        - name: baseVersionId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: compareVersionId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BqVersionComparison" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ----------------------------------------------------- progress-valuations
  /projects/{projectId}/progress-measurements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProgressMeasurements
      summary: List progress measurements
      tags: [progress-valuations]
      x-permission: progress.view
      parameters:
        - name: bqItemId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of measurements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/ProgressMeasurement" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: recordProgressMeasurement
      summary: Record quantity completed on a BQ item, with photo evidence
      description: >-
        Usually captured offline in the site app and delivered by `POST /sync/push`. A quantity
        to date above the BQ quantity plus approved variations is flagged. `photoIds` must point
        to progress photos of the same site (verified photos are required when tenant policy
        says so).
      tags: [progress-valuations]
      x-permission: progress.measure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressMeasurement" }
      responses:
        "201":
          description: Measurement recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressMeasurement" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/evm:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getEarnedValue
      summary: Get earned value figures (PV, EV, AC, CPI, SPI)
      tags: [progress-valuations]
      x-permission: progress.view_evm
      parameters:
        - $ref: "#/components/parameters/OnDate"
      responses:
        "200":
          description: Earned value summary as of the date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvmSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/evm/s-curve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getSCurve
      summary: Get S-curve series (planned vs earned vs actual cost)
      tags: [progress-valuations]
      x-permission: progress.view_evm
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: interval
          in: query
          schema: { type: string, enum: [week, month], default: week }
      responses:
        "200":
          description: Cumulative series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SCurveSeries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/valuations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createValuation
      summary: Start an interim valuation
      description: Creates a draft for `valuationDate` from approved measurements. Compute it next.
      tags: [progress-valuations]
      x-permission: valuations.prepare
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Valuation" }
      responses:
        "201":
          description: Draft valuation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Valuation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /valuations/{valuationId}/compute:
    parameters:
      - $ref: "#/components/parameters/ValuationId"
    post:
      operationId: computeValuation
      summary: Compute a draft valuation
      description: >-
        Gross value of work done + materials on site - retention (configurable percentage with an
        optional cap) - previous certificates = amount due, plus VAT. Snapshots the retention and
        VAT rule versions used. Can be repeated while the valuation is a draft.
      tags: [progress-valuations]
      x-permission: valuations.prepare
      responses:
        "200":
          description: Valuation with computed lines and totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Valuation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /valuations/{valuationId}/approve:
    parameters:
      - $ref: "#/components/parameters/ValuationId"
    post:
      operationId: approveValuation
      summary: Approve a computed valuation
      description: Maker-checker. Locks the valuation lines and the measurements they used.
      tags: [progress-valuations]
      x-permission: valuations.approve
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Valuation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /valuations/{valuationId}/certificate:
    parameters:
      - $ref: "#/components/parameters/ValuationId"
    post:
      operationId: issuePaymentCertificate
      summary: Issue an interim payment certificate (IPC) for an approved valuation
      description: >-
        Allocates the certificate number, records the retention held, renders the PDF in the
        background (language from `Accept-Language`) and opens a receivable that the client can
        pay by STK Push or by Paybill (C2B) with the project code as the account number.
      tags: [progress-valuations]
      x-permission: certificates.issue
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCertificate" }
      responses:
        "201":
          description: Certificate issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCertificate" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /payment-certificates/{certificateId}/pdf:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    get:
      operationId: getPaymentCertificatePdf
      summary: Get a short-lived download URL for the certificate PDF
      tags: [progress-valuations]
      x-permission: certificates.view
      responses:
        "200":
          description: Pre-signed URL to the rendered PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadUrl" }
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/retention:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listRetentionEntries
      summary: List retention held and released
      tags: [progress-valuations]
      x-permission: valuations.view
      responses:
        "200":
          description: Retention ledger with balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionLedger" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{projectId}/retention/releases:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: releaseRetention
      summary: Release retention at practical completion or at the end of the DLP
      description: >-
        The split between practical completion and the end of the defects liability period is
        configurable. Creates a release entry and a certificate line that the client pays.
      tags: [progress-valuations]
      x-permission: certificates.issue
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionRelease" }
      responses:
        "201":
          description: Release recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionEntry" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  # ------------------------------------------------------------------ labour
  /labourers:
    get:
      operationId: listLabourers
      summary: List labourers (sensitive fields masked)
      tags: [labour]
      x-permission: labour.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ProjectFilter"
        - name: tradeId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: skillLevel
          in: query
          schema: { type: string, enum: [skilled, semi_skilled, unskilled] }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, left] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of labourers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Labourer" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: registerLabourer
      summary: Register a labourer
      description: >-
        Registration is **blocked for anyone under 18** (`422 underage`, computed from
        `dateOfBirth` on the Africa/Nairobi business date). The ID number is checked against a
        blind index to catch duplicates and ghost workers (`409 duplicate-labourer`). Sensitive
        fields are encrypted at field level and always returned masked.
      tags: [labour]
      x-permission: labour.register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Labourer" }
      responses:
        "201":
          description: Labourer registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Labourer" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Underage" }
  /labourers/{labourerId}:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    get:
      operationId: getLabourer
      summary: Get a labourer (sensitive fields masked)
      tags: [labour]
      x-permission: labour.view
      responses:
        "200":
          description: Labourer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Labourer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLabourer
      summary: Update a labourer
      description: >-
        The M-Pesa payout number cannot be changed here (see
        `PUT /labourers/{labourerId}/payout-phone`). A corrected date of birth is checked again
        (`422 underage`).
      tags: [labour]
      x-permission: labour.edit
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/Labourer" }
      responses:
        "200":
          description: Updated labourer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Labourer" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Underage" }
  /labourers/{labourerId}/payout-phone:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    put:
      operationId: changeLabourerPayoutPhone
      summary: Change a labourer's M-Pesa payout number
      description: >-
        A payee change, so it needs step-up. The OTP sent to the new number (purpose
        `payout_phone_change`) proves the worker controls it. Raises an `unusual_payout` review
        alert and, by tenant policy, holds the next payout to the new number until reviewed.
      tags: [labour]
      x-permission: labour.change_payee
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutPhoneChange" }
      responses:
        "200":
          description: Payout number changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Labourer" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /labourers/{labourerId}/sensitive-fields/reveal:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    post:
      operationId: revealLabourerSensitiveFields
      summary: Reveal selected sensitive fields of a labourer (audited)
      description: >-
        Returns full values for the requested fields only. Every call is audit-logged with its
        reason and rate-limited, and the response is `Cache-Control: no-store`. POST is used so
        that values never appear in URLs, caches or prefetches.
      tags: [labour]
      x-permission: labour.view_sensitive
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevealRequest" }
      responses:
        "200":
          description: Requested fields in clear text
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabourerSensitive" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /labourers/{labourerId}/accreditations:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    post:
      operationId: addAccreditation
      summary: Add an accreditation (NCA card, welding, working at heights)
      description: Expiry dates raise `accreditation_expiry` alerts with a configurable lead time.
      tags: [labour]
      x-permission: labour.edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Accreditation" }
      responses:
        "201":
          description: Accreditation added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accreditation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /trades:
    get:
      operationId: listTrades
      summary: List trades (configurable, with English and Kiswahili names)
      tags: [labour]
      x-permission: labour.view
      responses:
        "200":
          description: Trades (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Trade" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}/labour-rates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: setLabourRate
      summary: Set the default rate for a trade and skill level on the project
      description: >-
        Effective-dated: a new rate closes the previous one. Individual workers can carry an
        override on their project engagement. Hourly, daily or piece basis.
      tags: [labour]
      x-permission: labour.manage_rates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabourRate" }
      responses:
        "201":
          description: Rate set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabourRate" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/gangs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listGangs
      summary: List gangs (crews) on the project
      tags: [labour]
      x-permission: labour.view
      responses:
        "200":
          description: Gangs (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Gang" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createGang
      summary: Create a gang with a foreman
      tags: [labour]
      x-permission: labour.manage_gangs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Gang" }
      responses:
        "201":
          description: Gang created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gang" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /gangs/{gangId}/assignments/{workDate}:
    parameters:
      - $ref: "#/components/parameters/GangId"
      - $ref: "#/components/parameters/WorkDate"
    put:
      operationId: setGangAssignments
      summary: Set a gang's roster for a business date
      description: >-
        Assigns workers to a site and BQ activity for the day. A worker already assigned to
        another site on the same date is rejected with `409 two-sites`. Rosters reach site devices
        on the next sync pull.
      tags: [labour]
      x-permission: labour.assign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GangAssignmentSet" }
      responses:
        "200":
          description: Roster saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GangAssignmentSet" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /labourers/{labourerId}/ledger:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    get:
      operationId: getLabourerLedger
      summary: Get a labourer's ledger
      description: >-
        Days worked, hours, overtime, total earned, total paid and advances outstanding, per
        project and overall.
      tags: [labour]
      x-permission: labour.view_ledger
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabourerLedger" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /labourers/{labourerId}/do-not-rehire:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    post:
      operationId: setDoNotRehire
      summary: Flag a labourer as do-not-rehire
      description: >-
        A reason is required. The flag is visible to managers only, and the reason is encrypted
        and readable only through the reveal endpoint.
      tags: [labour]
      x-permission: labour.manage_do_not_rehire
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Flag set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Labourer" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /labourers/{labourerId}/do-not-rehire/clear:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    post:
      operationId: clearDoNotRehire
      summary: Clear the do-not-rehire flag
      description: A reason is required and audited.
      tags: [labour]
      x-permission: labour.manage_do_not_rehire
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Flag cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Labourer" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/productivity:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProductivity
      summary: Get output per worker-day by trade, gang or labourer
      description: >-
        For example square metres of blockwork per mason-day, from approved progress
        measurements and attendance. Comparable across gangs and projects.
      tags: [labour]
      x-permission: labour.view_productivity
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: tradeId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: groupBy
          in: query
          schema: { type: string, enum: [trade, gang, labourer], default: gang }
      responses:
        "200":
          description: Productivity figures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductivityReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ------------------------------------------------------ consent-biometrics
  /labourers/{labourerId}/consents:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    post:
      operationId: captureConsent
      summary: Capture a consent decision
      description: >-
        Records explicit, informed consent (or refusal) for one purpose, such as face or
        fingerprint attendance, shown or read aloud in English or Kiswahili, with the text
        version, method, witness and timestamp. Refusing biometric consent never blocks work: the
        card + photo + supervisor attendance method is always available.
      tags: [consent-biometrics]
      x-permission: consent.capture
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Consent" }
      responses:
        "201":
          description: Consent decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /consents/{consentId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ConsentId"
    post:
      operationId: withdrawConsent
      summary: Withdraw a consent
      description: >-
        Withdrawing biometric consent revokes the active enrolments for that modality at once,
        removes them from kiosk rosters and schedules template deletion. The labourer continues
        with the non-biometric method. No reason is needed from the data subject.
      tags: [consent-biometrics]
      x-permission: consent.capture
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentWithdrawal" }
      responses:
        "200":
          description: Consent withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /labourers/{labourerId}/biometric-enrolments:
    parameters:
      - $ref: "#/components/parameters/LabourerId"
    post:
      operationId: createBiometricEnrolment
      summary: Enrol a biometric template from a kiosk
      description: >-
        **DPIA gate.** Refused with `409 dpia-not-approved` until the tenant's DPIA is recorded
        as approved (`PUT /biometrics/dpia`), and with `409 consent-required` without an active
        explicit consent for the modality. The kiosk sends only a template or embedding (never
        raw images), encrypted to the biometrics service key. Templates are stored under a
        separate KEK and are never returned by any endpoint.
      tags: [consent-biometrics]
      security:
        - bearerAuth: []
          deviceProof: []
      x-permission: biometrics.enrol
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BiometricEnrolmentCreate" }
      responses:
        "201":
          description: Enrolment active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BiometricEnrolment" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DpiaNotApproved" }
  /biometric-enrolments/{enrolmentId}/revoke:
    parameters:
      - $ref: "#/components/parameters/EnrolmentId"
    post:
      operationId: revokeBiometricEnrolment
      summary: Revoke an enrolment
      description: The enrolment drops out of kiosk roster packages at the next sync.
      tags: [consent-biometrics]
      x-permission: biometrics.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Enrolment revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BiometricEnrolment" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /biometric-enrolments/{enrolmentId}:
    parameters:
      - $ref: "#/components/parameters/EnrolmentId"
    delete:
      operationId: deleteBiometricEnrolment
      summary: Delete an enrolment and crypto-erase its templates
      description: >-
        Destroys the template ciphertext and its wrapped key, keeping a tombstone with the
        deletion time for accountability. The same deletion runs automatically a configurable
        time after the worker's engagement ends.
      tags: [consent-biometrics]
      x-permission: biometrics.delete
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sites/{siteId}/roster-templates:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: downloadRosterTemplates
      summary: Download the encrypted biometric roster package for a kiosk
      description: >-
        Contains only active enrolments of workers on **this site's** roster, for on-device 1:N
        matching limited to the site. The package is encrypted to the requesting device's key,
        expires, and is replaced at each sync. Use `If-None-Match` with the previous ETag.
      tags: [consent-biometrics]
      security:
        - bearerAuth: []
          deviceProof: []
      x-permission: biometrics.sync_roster
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Encrypted roster package
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterTemplatePackage" }
        "304":
          description: The device already has the current package
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DpiaNotApproved" }
  /data-subject-requests:
    get:
      operationId: listDataSubjectRequests
      summary: List data subject requests
      tags: [consent-biometrics]
      x-permission: privacy.manage_dsr
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [received, in_progress, completed, rejected] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/DataSubjectRequest" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDataSubjectRequest
      summary: Log a data subject request (access, correction, deletion, objection)
      description: The due date comes from the configured statutory response time (COMPLIANCE-REVIEW).
      tags: [consent-biometrics]
      x-permission: privacy.manage_dsr
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataSubjectRequest" }
      responses:
        "201":
          description: Request logged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSubjectRequest" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /biometrics/dpia:
    put:
      operationId: recordDpiaStatus
      summary: Record the tenant's DPIA and ODPC registration status
      description: >-
        Biometric enrolment, kiosk rosters and biometric capture methods stay disabled until the
        status is `approved`. Setting it to `withdrawn` disables them again immediately.
      tags: [consent-biometrics]
      x-permission: privacy.approve_dpia
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DpiaStatus" }
      responses:
        "200":
          description: DPIA status saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DpiaStatus" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # -------------------------------------------------------------- attendance
  /sites/{siteId}/attendance-devices:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: registerAttendanceDevice
      summary: Register a kiosk, phone or terminal to the site
      description: >-
        Returns a one-time provisioning code and QR payload (valid for 15 minutes) that the site
        app exchanges in `POST /devices`. Terminals get a per-device push URL token instead.
        Enabling a biometric capture method is refused with `409 dpia-not-approved` until the
        DPIA is approved. A fallback method (`qr_card_photo` or `nfc_card_photo`) is always
        enabled.
      tags: [attendance]
      x-permission: attendance.manage_devices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceDevice" }
      responses:
        "201":
          description: Device registered, pending activation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceDevice" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DpiaNotApproved" }
  /attendance/events:
    get:
      operationId: listAttendanceEvents
      summary: List attendance events
      description: Append-only. Corrections are new events that supersede earlier ones.
      tags: [attendance]
      x-permission: attendance.view
      parameters:
        - $ref: "#/components/parameters/SiteFilter"
        - $ref: "#/components/parameters/LabourerFilter"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: method
          in: query
          schema: { $ref: "#/components/schemas/CaptureMethod" }
        - name: flagged
          in: query
          description: Only events with at least one open anomaly
          schema: { type: boolean }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/AttendanceEvent" } }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sites/{siteId}/muster-roll:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getMusterRoll
      summary: Get the muster roll for a site and business date
      description: >-
        One row per rostered or present worker: first check-in, last check-out, hours, capture
        method, geofence result and open anomalies.
      tags: [attendance]
      x-permission: attendance.view
      parameters:
        - name: date
          in: query
          required: true
          schema: { $ref: "#/components/schemas/BusinessDate" }
        - name: gangId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Muster roll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusterRoll" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /attendance/anomalies:
    get:
      operationId: listAttendanceAnomalies
      summary: List attendance anomalies
      tags: [attendance]
      x-permission: attendance.review
      parameters:
        - $ref: "#/components/parameters/SiteFilter"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/AnomalyKind" }
        - name: status
          in: query
          schema: { type: string, enum: [open, accepted, rejected], default: open }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of anomalies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/AttendanceAnomaly" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /attendance/anomalies/{anomalyId}/review:
    parameters:
      - $ref: "#/components/parameters/AnomalyId"
    post:
      operationId: reviewAttendanceAnomaly
      summary: Accept or reject a flagged attendance event
      description: Rejected events are excluded from timesheets. The review note is required and audited.
      tags: [attendance]
      x-permission: attendance.review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnomalyReview" }
      responses:
        "200":
          description: Anomaly reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceAnomaly" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /attendance/overrides:
    post:
      operationId: createAttendanceOverride
      summary: Record a manual attendance override
      description: >-
        Creates a new event with method `manual_override`, optionally superseding an earlier
        event. A reason is required, the event is always flagged for review and the change is
        audit-logged. Step-up is required when tenant policy `attendance.override.step_up` is on.
        Refused with 409 once the timesheet for that day is locked.
      tags: [attendance]
      x-permission: attendance.override
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceOverride" }
      responses:
        "201":
          description: Override event created and flagged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEvent" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /pay-periods/{payPeriodId}/timesheets/generate:
    parameters:
      - $ref: "#/components/parameters/PayPeriodId"
    post:
      operationId: generateTimesheets
      summary: Build draft timesheets from attendance for a pay period
      description: >-
        Applies the configured rules: normal hours, breaks, lateness grace, half-day, absence,
        and overtime multipliers for weekdays, rest days and public holidays. Re-running replaces
        drafts only; approved timesheets are untouched.
      tags: [attendance]
      x-permission: timesheets.generate
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /timesheets:
    get:
      operationId: listTimesheets
      summary: List timesheets
      tags: [attendance]
      x-permission: timesheets.view
      parameters:
        - name: payPeriodId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - $ref: "#/components/parameters/LabourerFilter"
        - name: status
          in: query
          schema: { type: string, enum: [draft, approved, locked] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of timesheets with their daily lines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Timesheet" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /timesheets/{timesheetId}/approve:
    parameters:
      - $ref: "#/components/parameters/TimesheetId"
    post:
      operationId: approveTimesheet
      summary: Approve a timesheet
      description: >-
        Refused with 409 while the timesheet has open anomalies. Approved timesheets feed payroll
        and lock when the payroll batch is approved.
      tags: [attendance]
      x-permission: timesheets.approve
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # -------------------------------------------------------------------- sync
  /sync/push:
    post:
      operationId: pushSyncBatch
      summary: Push a batch of signed offline records
      description: >-
        Each record (attendance event, diary entry, GRN, stock issue, progress measurement, photo
        metadata, safety incident) carries a client UUIDv7, `deviceSeq`, device time,
        `elapsedRealtimeMs` and `bootId`, a GPS fix and an Ed25519 signature over its canonical
        payload. The server verifies the device and every signature, deduplicates by record ID,
        runs the anomaly rules (geofence, duplicates, clock drift, two sites, impossible travel,
        mock location) and answers per record with `accepted`, `duplicate` or `rejected` plus a
        reason, and returns the server time for the clock anchor. Approved or locked records are
        never overwritten (server wins); drafts are last-write-wins with an audit trail.
      tags: [sync]
      security:
        - bearerAuth: []
          deviceProof: []
      x-permission: sync.push
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Per-record results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /sync/pull:
    get:
      operationId: pullSyncChanges
      summary: Pull changes since a cursor
      description: >-
        Roster and labourers (masked), gangs and assignments, geofences, BQ items, materials,
        approvals, configuration and revocations for the device's site, in change-log order.
        Omit the cursor for a full snapshot. A cursor older than the change-log retention returns
        410 and the device starts again without a cursor.
      tags: [sync]
      security:
        - bearerAuth: []
          deviceProof: []
      x-permission: sync.pull
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Changes and the next cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: Cursor expired. Pull again without a cursor for a full snapshot.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  # ----------------------------------------------------------------- payroll
  /projects/{projectId}/pay-periods:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createPayPeriod
      summary: Open a pay period for the project
      description: Daily, weekly, fortnightly or monthly. Periods of the same project cannot overlap.
      tags: [payroll]
      x-permission: payroll.manage_periods
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayPeriod" }
      responses:
        "201":
          description: Pay period opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPeriod" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /pay-periods/{payPeriodId}/payroll-batches:
    parameters:
      - $ref: "#/components/parameters/PayPeriodId"
    post:
      operationId: preparePayrollBatch
      summary: Prepare a payroll batch for the period (maker)
      description: >-
        Computes gross pay (attendance x rate + overtime + piece-rate output + allowances) and net
        pay (gross - advances - statutory deductions - other deductions) from approved
        timesheets, and snapshots every rule version used. Rules still under COMPLIANCE-REVIEW
        are listed in `ruleWarnings`. Large batches compute in the background and move to
        `prepared` when done.
      tags: [payroll]
      x-permission: payroll.prepare
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollBatch" }
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollBatch" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /payroll-batches/{payrollBatchId}:
    parameters:
      - $ref: "#/components/parameters/PayrollBatchId"
    get:
      operationId: getPayrollBatch
      summary: Get a payroll batch with totals, approvals and rule warnings
      tags: [payroll]
      x-permission: payroll.view
      responses:
        "200":
          description: Payroll batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payroll-batches/{payrollBatchId}/lines:
    parameters:
      - $ref: "#/components/parameters/PayrollBatchId"
    get:
      operationId: listPayrollLines
      summary: List payroll lines with per-worker payout status
      tags: [payroll]
      x-permission: payroll.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { type: string, enum: [pending, sent, confirmed, failed, reversed] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of payroll lines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/PayrollLine" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payroll-batches/{payrollBatchId}/review:
    parameters:
      - $ref: "#/components/parameters/PayrollBatchId"
    post:
      operationId: reviewPayrollBatch
      summary: Review a prepared batch (Finance checker)
      description: >-
        The reviewer must not be the preparer (`403 maker-checker-violation`). Decision `return`
        sends the batch back to draft with a comment.
      tags: [payroll]
      x-permission: payroll.review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecision" }
      responses:
        "200":
          description: Batch reviewed or returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollBatch" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payroll-batches/{payrollBatchId}/approve:
    parameters:
      - $ref: "#/components/parameters/PayrollBatchId"
    post:
      operationId: approvePayrollBatch
      summary: Approve a reviewed batch (Owner/Director, step-up MFA)
      description: >-
        Needs a step-up token bound to this batch ID and its `totalNet`, an approval limit at or
        above the total (`403 approval-limit-exceeded`) and an approver who is neither the
        preparer nor the reviewer. Locks the timesheets. Disbursement is a separate call
        (`POST /payroll-batches/{payrollBatchId}/disburse`).
      tags: [payroll]
      x-permission: payroll.approve
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Batch approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollBatch" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payroll-batches/{payrollBatchId}/lines/{payrollLineId}/payslip:
    parameters:
      - $ref: "#/components/parameters/PayrollBatchId"
      - $ref: "#/components/parameters/PayrollLineId"
    get:
      operationId: previewPayslip
      summary: Preview a payslip and its SMS text
      description: >-
        Days, rate, gross, deductions, net and (once paid) the M-Pesa reference, in English or
        Kiswahili, with the SMS segment count.
      tags: [payroll]
      x-permission: payroll.view
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Payslip preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payslip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /statutory-exports:
    post:
      operationId: createStatutoryExport
      summary: Export a statutory remittance file (CSV)
      description: >-
        PAYE, NSSF, SHIF, Affordable Housing Levy or NITA for a month, from approved payroll.
        Column layouts are configurable templates mapped to the official upload formats
        (COMPLIANCE-REVIEW).
      tags: [payroll]
      x-permission: payroll.export_statutory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatutoryExportRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /advances:
    get:
      operationId: listAdvances
      summary: List salary advances
      tags: [payroll]
      x-permission: payroll.view_advances
      parameters:
        - $ref: "#/components/parameters/LabourerFilter"
        - $ref: "#/components/parameters/ProjectFilter"
        - name: status
          in: query
          schema: { type: string, enum: [pending_payment, active, recovered, cancelled] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of advances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Advance" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdvance
      summary: Issue a salary advance with a recovery schedule
      description: >-
        The money goes out as a payment (M-Pesa B2C or cash) that follows the normal approval
        rules. Per-worker limits are configurable. Recoveries are deducted automatically by
        future payroll batches.
      tags: [payroll]
      x-permission: payroll.manage_advances
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Advance" }
      responses:
        "201":
          description: Advance created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Advance" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /advances/{advanceId}:
    parameters:
      - $ref: "#/components/parameters/AdvanceId"
    get:
      operationId: getAdvance
      summary: Get an advance with its recovery schedule and recoveries
      tags: [payroll]
      x-permission: payroll.view_advances
      responses:
        "200":
          description: Advance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Advance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: cancelAdvance
      summary: Cancel an advance that has not been paid out
      tags: [payroll]
      x-permission: payroll.manage_advances
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /advances/{advanceId}/recovery-schedule:
    parameters:
      - $ref: "#/components/parameters/AdvanceId"
    put:
      operationId: setAdvanceRecoverySchedule
      summary: Replace the remaining recovery schedule
      description: >-
        Instalments must cover the outstanding balance. Recoveries already deducted by approved
        payroll cannot change.
      tags: [payroll]
      x-permission: payroll.manage_advances
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverySchedule" }
      responses:
        "200":
          description: Schedule replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Advance" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/piece-rate-jobs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createPieceRateJob
      summary: Create a piece-rate job
      description: >-
        Measured quantity x agreed rate for a labourer or a gang, linked to a BQ item (for
        example plastering per square metre).
      tags: [payroll]
      x-permission: payroll.manage_piece_rate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PieceRateJob" }
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PieceRateJob" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /piece-rate-jobs/{pieceRateJobId}/approve:
    parameters:
      - $ref: "#/components/parameters/PieceRateJobId"
    post:
      operationId: approvePieceRateJob
      summary: Approve the measured quantity of a piece-rate job
      description: The approved amount flows into the next payroll batch for the worker or gang.
      tags: [payroll]
      x-permission: payroll.approve_piece_rate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PieceRateApproval" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PieceRateJob" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ---------------------------------------------------------------- payments
  /payment-channels:
    get:
      operationId: listPaymentChannels
      summary: List the tenant's Daraja payment channels
      description: >-
        Shortcodes, purposes, environment and credential status. Secrets are never returned; the
        record only holds a reference into the secrets manager.
      tags: [payments]
      x-permission: payments.view_channels
      responses:
        "200":
          description: Channels (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/PaymentChannel" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPaymentChannel
      summary: Configure a Daraja channel (shortcode and credentials)
      description: >-
        Credentials (consumer key and secret, STK passkey, initiator name and password) are
        write-only. They go straight to the secrets manager and the database keeps only a
        reference. The callback URL token is generated by the server. For C2B channels the
        validation and confirmation URLs are registered with Daraja when the channel is activated.
      tags: [payments]
      x-permission: payments.manage_channels
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentChannel" }
      responses:
        "201":
          description: Channel created (secrets stored by reference)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentChannel" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payment-channels/{channelId}/balance-checks:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: checkAccountBalance
      summary: Request the M-Pesa account balance
      description: >-
        Asynchronous: the result arrives by callback and is stored on the provider request. The
        same check runs automatically before every bulk payout (float check).
      tags: [payments]
      x-permission: payments.view_balance
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Balance query submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProviderRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /payments/stk-push:
    post:
      operationId: initiateStkPush
      summary: Request a client payment by M-Pesa Express (STK Push)
      description: >-
        Sends a payment prompt to the payer's phone for a deposit or instalment against a payment
        certificate or invoice. Returns 202 with the payment `pending`. It becomes `confirmed`
        only from the matched STK callback (matched by `CheckoutRequestID`, never by phone
        number) or an STK Query. Transaction limits are configurable.
      tags: [payments]
      x-permission: payments.request_client_payment
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StkPushRequest" }
      responses:
        "202":
          description: Prompt requested; payment pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /payroll-batches/{payrollBatchId}/disburse:
    parameters:
      - $ref: "#/components/parameters/PayrollBatchId"
    post:
      operationId: disbursePayrollBatch
      summary: Pay an approved payroll batch by bulk M-Pesa B2C
      description: >-
        Checks the float first: the Account Balance must cover net pay plus estimated charges,
        otherwise `409 insufficient-float`. Then queues one B2C SalaryPayment per line through
        the outbox, rate-limited, each with its own idempotency key and
        `OriginatorConversationID`. Lines move through `pending`, `sent`, `confirmed`, `failed`
        and `reversed` as callbacks arrive; missing callbacks trigger Transaction Status queries.
        Receiver names in results are compared with worker names and mismatches are flagged.
        Cash and bank lines are excluded and recorded with `POST /payments/manual`.
      tags: [payments]
      x-permission: payments.disburse
      x-step-up: true
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "202":
          description: Disbursement started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Disbursement" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /payments/b2b:
    post:
      operationId: createSupplierPayment
      summary: Prepare a supplier payment by M-Pesa B2B (Paybill or Till)
      description: >-
        Pays an approved supplier invoice. The recipient shortcode and account reference come
        from the supplier record, never from the request. Refused with `409 three-way-mismatch`
        until the invoice's three-way match is `matched` or `overridden`. The payment then waits
        for `POST /payments/{paymentId}/approve`.
      tags: [payments]
      x-permission: payments.prepare
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierPaymentRequest" }
      responses:
        "201":
          description: Payment created, awaiting approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /payments/manual:
    post:
      operationId: recordManualPayment
      summary: Record a cash or bank payment
      description: >-
        Cash needs an evidence file (photo of the signed receipt or a signature) and a reason.
        Bank transfers need the bank reference. Recorded payments follow the same approval rules
        and are flagged in reports.
      tags: [payments]
      x-permission: payments.record_manual
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualPaymentRequest" }
      responses:
        "201":
          description: Payment recorded, awaiting approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /payments:
    get:
      operationId: listPayments
      summary: List payments
      tags: [payments]
      x-permission: payments.view
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
        - name: direction
          in: query
          schema: { type: string, enum: [in, out] }
        - name: purpose
          in: query
          schema: { $ref: "#/components/schemas/PaymentPurpose" }
        - name: method
          in: query
          schema: { $ref: "#/components/schemas/PaymentMethod" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Payment" } } }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      operationId: getPayment
      summary: Get a payment
      tags: [payments]
      x-permission: payments.view
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payments/{paymentId}/provider-requests:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      operationId: listPaymentProviderRequests
      summary: Get the provider timeline of a payment
      description: >-
        Every Daraja request (redacted), its state transitions and the callbacks matched to it,
        oldest first.
      tags: [payments]
      x-permission: payments.view
      responses:
        "200":
          description: Provider requests (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/PaymentProviderRequest" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payments/{paymentId}/approve:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      operationId: approvePayment
      summary: Approve an outgoing payment (checker, step-up MFA)
      description: >-
        For supplier, advance, petty cash and manual payments. The approver must differ from the
        preparer and hold an approval limit that covers the amount. Unusual payouts (new
        recipient with a large amount, many payouts to one number, payouts outside business
        hours) need a second approval. Approved M-Pesa payments are queued through the outbox.
      tags: [payments]
      x-permission: payments.approve
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Approved and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payments/{paymentId}/status-queries:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      operationId: queryTransactionStatus
      summary: Trigger a Transaction Status query
      description: >-
        Used after a timeout or to resolve a disputed item. A failed payment is retried only after
        a status query confirms it was not processed, so nobody is paid twice.
      tags: [payments]
      x-permission: payments.reconcile
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Status query submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProviderRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /payments/{paymentId}/reversals:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      operationId: reversePayment
      summary: Request a reversal of a confirmed M-Pesa payment
      description: The payment becomes `reversed` only when the reversal result callback confirms it.
      tags: [payments]
      x-permission: payments.reverse
      x-step-up: true
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "202":
          description: Reversal submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentProviderRequest" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /payment-callbacks:
    get:
      operationId: listPaymentCallbacks
      summary: List stored provider callbacks (unmatched by default)
      description: >-
        Unknown or unmatched callbacks are stored, raise an `unmatched_callback` alert and are
        never applied to payments.
      tags: [payments]
      x-permission: payments.view_callbacks
      parameters:
        - name: matchStatus
          in: query
          schema:
            type: string
            enum: [matched, unmatched, duplicate, invalid]
            default: unmatched
        - name: channelId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of callbacks (payloads redacted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/PaymentCallback" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ---------------------------------------------------------- reconciliation
  /payment-channels/{channelId}/statements:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: uploadMpesaStatement
      summary: Upload an M-Pesa statement (CSV) and start a reconciliation run
      description: >-
        The statement exported from the M-Pesa organisation portal. Lines are matched to payments
        by receipt number, then amount and time, giving matched, unmatched and disputed items.
        Charges on the statement are booked as project cost entries.
      tags: [reconciliation]
      x-permission: reconciliation.run
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/StatementUpload" }
      responses:
        "202":
          description: Reconciliation run started
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reconciliation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /reconciliations:
    get:
      operationId: listReconciliations
      summary: List reconciliation runs
      description: Includes the daily automatic runs and statement uploads.
      tags: [reconciliation]
      x-permission: reconciliation.view
      parameters:
        - name: channelId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of runs with counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/Reconciliation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /reconciliations/{reconciliationId}/items:
    parameters:
      - $ref: "#/components/parameters/ReconciliationId"
    get:
      operationId: listReconciliationItems
      summary: List the items of a reconciliation run
      tags: [reconciliation]
      x-permission: reconciliation.view
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [matched, unmatched, disputed, resolved] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/ReconciliationItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reconciliations/{reconciliationId}/items/{reconciliationItemId}/resolve:
    parameters:
      - $ref: "#/components/parameters/ReconciliationId"
      - $ref: "#/components/parameters/ReconciliationItemId"
    post:
      operationId: resolveReconciliationItem
      summary: Resolve an unmatched or disputed item
      description: >-
        Link the item to a payment, or close it with an outcome and a note (audited). Statement
        items are never deleted.
      tags: [reconciliation]
      x-permission: reconciliation.resolve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationResolution" }
      responses:
        "200":
          description: Item resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationItem" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ------------------------------------------------------------- procurement
  /materials:
    get:
      operationId: listMaterials
      summary: List the material catalogue
      tags: [procurement]
      x-permission: procurement.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: category
          in: query
          schema:
            type: string
            enum: [cement, aggregate, steel, timber, blocks, roofing, fuel, other]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of materials
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Material" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMaterial
      summary: Add a material to the catalogue
      tags: [procurement]
      x-permission: procurement.manage_catalogue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Material" }
      responses:
        "201":
          description: Material created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /units:
    get:
      operationId: listUnits
      summary: List units and conversions
      description: >-
        Kenyan units (m³, m², m, kg, t, No., bag, lorry trip, LS, Item) and conversions, including
        material-specific ones such as "1 trip of sand = N t" (effective-dated, configurable).
      tags: [procurement]
      x-permission: procurement.view
      parameters:
        - $ref: "#/components/parameters/OnDate"
      responses:
        "200":
          description: Units and active conversions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitCatalogue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /suppliers:
    get:
      operationId: listSuppliers
      summary: List suppliers (KRA PIN and bank details masked)
      tags: [procurement]
      x-permission: procurement.view
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: etimsStatus
          in: query
          schema: { type: string, enum: [registered, unknown, not_registered] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of suppliers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Supplier" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSupplier
      summary: Add a supplier
      description: >-
        KRA PIN and bank details are write-only, encrypted at field level and returned masked.
        The KRA PIN blind index prevents duplicate suppliers.
      tags: [procurement]
      x-permission: procurement.manage_suppliers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Supplier" }
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /suppliers/{supplierId}:
    parameters:
      - $ref: "#/components/parameters/SupplierId"
    patch:
      operationId: updateSupplier
      summary: Update a supplier
      description: >-
        Changing payment details (M-Pesa Paybill or Till, account reference, bank details) is a
        payee change: it needs step-up, raises an alert and holds pending payments to the
        supplier until a second user confirms.
      tags: [procurement]
      x-permission: procurement.manage_suppliers
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/Supplier" }
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /materials/{materialId}/price-history:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      operationId: getMaterialPriceHistory
      summary: Get price history for a material
      description: Prices observed on quotations, LPOs and invoices, by supplier, for price-change alerts.
      tags: [procurement]
      x-permission: procurement.view
      parameters:
        - name: supplierId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Price observations, oldest first (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/MaterialPrice" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sites/{siteId}/requisitions:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: createRequisition
      summary: Raise a material requisition from site
      description: Lines can be linked to BQ items. Also created offline and delivered by sync.
      tags: [procurement]
      x-permission: procurement.request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Requisition" }
      responses:
        "201":
          description: Draft requisition created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requisition" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /requisitions/{requisitionId}/submit:
    parameters:
      - $ref: "#/components/parameters/RequisitionId"
    post:
      operationId: submitRequisition
      summary: Submit a requisition for approval
      tags: [procurement]
      x-permission: procurement.request
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requisition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /requisitions/{requisitionId}/approve:
    parameters:
      - $ref: "#/components/parameters/RequisitionId"
    post:
      operationId: approveRequisition
      summary: Approve or reject a submitted requisition
      description: Lines over budget for their BQ item are highlighted for the approver.
      tags: [procurement]
      x-permission: procurement.approve_requisition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requisition" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /requisitions/{requisitionId}/rfqs:
    parameters:
      - $ref: "#/components/parameters/RequisitionId"
    post:
      operationId: createRfq
      summary: Go to market with an RFQ for an approved requisition
      description: The minimum number of quotations comes from config `procurement.min_quotes`.
      tags: [procurement]
      x-permission: procurement.manage_rfq
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rfq" }
      responses:
        "201":
          description: RFQ created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rfq" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rfqs/{rfqId}/quotations:
    parameters:
      - $ref: "#/components/parameters/RfqId"
    post:
      operationId: recordQuotation
      summary: Record a supplier quotation against an RFQ
      tags: [procurement]
      x-permission: procurement.manage_rfq
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Quotation" }
      responses:
        "201":
          description: Quotation recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quotation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /rfqs/{rfqId}/comparison:
    parameters:
      - $ref: "#/components/parameters/RfqId"
    get:
      operationId: compareQuotations
      summary: Compare the quotations received for an RFQ
      description: >-
        Line-by-line prices, totals, lowest price per line, delivery terms and the change against
        each supplier's price history.
      tags: [procurement]
      x-permission: procurement.view
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotationComparison" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /rfqs/{rfqId}/selection:
    parameters:
      - $ref: "#/components/parameters/RfqId"
    post:
      operationId: selectQuotation
      summary: Select the winning quotation
      description: >-
        A reason is required when the selected quotation is not the lowest, or when fewer than the
        configured minimum number of quotations were received (otherwise `409 below-min-quotes`).
      tags: [procurement]
      x-permission: procurement.select_quotation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationSelection" }
      responses:
        "200":
          description: Quotation selected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quotation" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lpos:
    get:
      operationId: listLpos
      summary: List local purchase orders
      tags: [procurement]
      x-permission: procurement.view
      parameters:
        - $ref: "#/components/parameters/ProjectFilter"
        - name: supplierId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, approved, issued, part_delivered, delivered, closed, cancelled]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of LPOs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Lpo" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLpo
      summary: Create an LPO from a selected quotation
      tags: [procurement]
      x-permission: procurement.create_lpo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Lpo" }
      responses:
        "201":
          description: Draft LPO created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lpo" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lpos/{lpoId}/approve:
    parameters:
      - $ref: "#/components/parameters/LpoId"
    post:
      operationId: approveLpo
      summary: Approve an LPO within the approver's limit
      description: Maker-checker with role approval limits. Approval creates a commitment against the budget.
      tags: [procurement]
      x-permission: procurement.approve_lpo
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lpo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lpos/{lpoId}/issue:
    parameters:
      - $ref: "#/components/parameters/LpoId"
    post:
      operationId: issueLpo
      summary: Issue an approved LPO to the supplier
      description: Renders the PDF and notifies the supplier (portal, email or WhatsApp).
      tags: [procurement]
      x-permission: procurement.issue_lpo
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lpo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lpos/{lpoId}/grns:
    parameters:
      - $ref: "#/components/parameters/LpoId"
    post:
      operationId: recordGrn
      summary: Record a delivery (goods received note)
      description: >-
        Quantities counted and rejected per line, photos of the delivery note, goods and vehicle,
        vehicle registration, receiver, GPS and time (outside-geofence receipts are flagged).
        Usually captured offline and delivered by sync. Posts receipts to the stock ledger.
      tags: [procurement, stores]
      x-permission: stores.receive
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Grn" }
      responses:
        "201":
          description: GRN recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grn" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /supplier-invoices:
    post:
      operationId: recordSupplierInvoice
      summary: Record a supplier invoice against an LPO
      description: >-
        Captures the KRA eTIMS invoice number; invoices without one are flagged because expense
        deductibility depends on it. Recording triggers the three-way match (LPO, GRN, invoice).
      tags: [procurement]
      x-permission: finance.record_invoice
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInvoice" }
      responses:
        "201":
          description: Invoice recorded; match result attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierInvoice" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /supplier-invoices/{supplierInvoiceId}/three-way-match:
    parameters:
      - $ref: "#/components/parameters/SupplierInvoiceId"
    get:
      operationId: getThreeWayMatch
      summary: Get the three-way match result for an invoice
      description: >-
        Quantity and price differences against the LPO and the GRNs, per line. A `mismatch` blocks
        payment until it is resolved or overridden.
      tags: [procurement]
      x-permission: procurement.view
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreeWayMatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /supplier-invoices/{supplierInvoiceId}/three-way-match/override:
    parameters:
      - $ref: "#/components/parameters/SupplierInvoiceId"
    post:
      operationId: overrideThreeWayMatch
      summary: Override a three-way mismatch (permission, reason and step-up)
      description: The override and its reason are audited and shown on the payment approval screen.
      tags: [procurement]
      x-permission: procurement.override_match
      x-step-up: true
      parameters:
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: Match overridden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreeWayMatch" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  # ------------------------------------------------------------------ stores
  /sites/{siteId}/stores:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: listStores
      summary: List the site's stores
      tags: [stores]
      x-permission: stores.view
      responses:
        "200":
          description: Stores (single page)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties: { data: { items: { $ref: "#/components/schemas/Store" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createStore
      summary: Create a store on the site
      tags: [stores]
      x-permission: stores.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Store" }
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stores/{storeId}/ledger:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    get:
      operationId: listStockLedger
      summary: List stock ledger entries with running balances
      description: Append-only. Corrections are adjusting entries.
      tags: [stores]
      x-permission: stores.view
      parameters:
        - name: materialId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/StockMovementKind" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of ledger entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { items: { $ref: "#/components/schemas/StockLedgerEntry" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stores/{storeId}/issues:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      operationId: issueStock
      summary: Issue stock to a BQ item or gang, or record wastage
      description: >-
        Refused with `409 insufficient-stock` when the balance is too low. Issues feed the
        theoretical-vs-actual material variance. Usually captured offline and delivered by sync.
      tags: [stores]
      x-permission: stores.issue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockIssue" }
      responses:
        "201":
          description: Ledger entry posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockLedgerEntry" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /stores/{storeId}/returns:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      operationId: returnStock
      summary: Return unused stock to the store
      tags: [stores]
      x-permission: stores.issue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockReturn" }
      responses:
        "201":
          description: Ledger entry posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockLedgerEntry" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stock-transfers:
    post:
      operationId: createStockTransfer
      summary: Dispatch stock to another site's store
      description: Posts `transfer_out` at once; `transfer_in` is posted when the receiving store confirms.
      tags: [stores]
      x-permission: stores.transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockTransfer" }
      responses:
        "201":
          description: Transfer dispatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransfer" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /stock-transfers/{stockTransferId}/receive:
    parameters:
      - $ref: "#/components/parameters/StockTransferId"
    post:
      operationId: receiveStockTransfer
      summary: Confirm receipt of a transfer
      description: Short deliveries mark the transfer `disputed` and raise an alert.
      tags: [stores]
      x-permission: stores.receive
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockTransferReceipt" }
      responses:
        "200":
          description: Transfer received or disputed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTransfer" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /stores/{storeId}/stock-takes:
    parameters:
      - $ref: "#/components/parameters/StoreId"
    post:
      operationId: createStockTake
      summary: Record a stock take with counted quantities
      description: System quantities are frozen at `countedOn`; the variance per line is computed by the server.
      tags: [stores]
      x-permission: stores.count
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockTake" }
      responses:
        "201":
          description: Stock take submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTake" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stock-takes/{stockTakeId}/approve:
    parameters:
      - $ref: "#/components/parameters/StockTakeId"
    post:
      operationId: approveStockTake
      summary: Approve a stock take and post adjustments
      description: Maker-checker. Posts `adjustment` entries for the variances and alerts on large ones.
      tags: [stores]
      x-permission: stores.approve_stock_take
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalComment" }
      responses:
        "200":
          description: Approved and adjusted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockTake" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/material-variance:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getMaterialVariance
      summary: Get theoretical vs actual material consumption
      description: >-
        Theoretical use (measured progress x rate build-ups) against stock actually issued, per
        material and BQ item. Rows above the configured threshold are flagged and raise
        `material_variance` alerts.
      tags: [stores]
      x-permission: stores.view_variance
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: materialId
          in: query
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: Variance report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialVarianceReport" }
