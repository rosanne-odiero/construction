        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyConflict" }
  /petty-cash-floats/{floatId}/counts:
    parameters:
      - $ref: "#/components/parameters/FloatId"
    post:
      operationId: countPettyCash
      summary: Record a petty cash count (reconciliation)
      description: The server computes the expected balance and the variance; large variances raise an alert.
      tags: [finance]
      x-permission: finance.count_petty_cash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PettyCashCount" }
      responses:
        "201":
          description: Count recorded with variance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PettyCashCount" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /finance/mpesa-sms/parse:
    post:
      operationId: parseMpesaSms
      summary: Parse a pasted M-Pesa confirmation SMS
      description: >-
        Returns the amount, transaction reference, counterparty, date and time, with a confidence
        per field, to pre-fill an expense or manual payment form. Nothing is stored; the user
        confirms the values. The parser lives in `packages/domain` and also runs in the site app
        offline.
      tags: [finance]
      x-permission: finance.record_expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MpesaSmsParseRequest" }
      responses:
        "200":
          description: Parsed fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MpesaSmsParseResult" }
        "400": { $ref: "#/components/responses/ProblemBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /projects/{projectId}/budget-vs-actual:
    parameters:
