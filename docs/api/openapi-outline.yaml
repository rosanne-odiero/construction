      schema: { $ref: "#/components/schemas/BusinessDate" }
    ChannelToken:
      name: channelToken
      in: path
      required: true
      description: >-
        Unguessable per-channel token (256-bit, base64url) generated by the server. Only its
        SHA-256 hash is stored.
      schema: { type: string, minLength: 43, maxLength: 64 }
    CallbackKind:
      name: kind
      in: path
      required: true
      description: Callback type registered in the outgoing Daraja request (never `c2b`).
      schema:
        type: string
        enum:
          - stk
          - b2c-result
          - b2c-timeout
          - b2b-result
          - b2b-timeout
          - status-result
          - status-timeout
          - balance-result
          - balance-timeout
          - reversal-result
          - reversal-timeout
    RequestToken:
      name: requestToken
      in: path
      required: true
      description: >-
        Per-request token (256-bit, base64url) generated when the Daraja request was sent and
        stored hashed on the provider request.
      schema: { type: string, minLength: 43, maxLength: 64 }
    TerminalDeviceToken:
      name: deviceToken
      in: path
      required: true
      description: Unguessable per-terminal token issued at registration (stored hashed)
      schema: { type: string, minLength: 43, maxLength: 64 }
  headers:
    RetryAfter:
      description: Seconds to wait before retrying
      schema: { type: integer, minimum: 1 }
    Location:
      description: URL of the created resource or of the job to poll
      schema: { type: string, format: uri-reference }
    NoStore:
      description: Always `no-store` for secrets and revealed values
      schema: { type: string, enum: [no-store] }
    ETag:
      description: Entity tag for conditional requests
      schema: { type: string }
    DeviceNonce:
      description: Fresh server nonce to sign in the next `X-Device-Proof`
      schema: { type: string }
  responses:
    ProblemBadRequest:
      description: Malformed request or failed validation (`validation-failed`), with field errors
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://pm-buddy.dev/problems/validation-failed
            title: Some fields are not valid
            status: 400
            code: validation-failed
            errors:
              - pointer: /phone
                code: invalid_phone
                detail: Use the format 2547XXXXXXXX or 2541XXXXXXXX
            traceId: 0af7651916cd43dd8448eb211c80319c
    Unauthorized:
      description: >-
        Missing, expired or invalid credentials (`unauthenticated`), a revoked session or device,
        or a missing or stale device proof (`device-nonce-required`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StepUpRequired:
      description: >-
        Not authenticated (`unauthenticated`), or the action needs a fresh MFA check bound to it
        (`step-up-required`). The problem describes the action to confirm with
        `POST /auth/step-up`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/StepUpProblem" }
          example:
            type: https://pm-buddy.dev/problems/step-up-required
            title: Confirm this action with your authenticator
            status: 401
            code: step-up-required
            stepUp:
              action: payroll.approve
              entityType: payroll_batch
              entityId: 01936f7e-8c2a-7b3d-9a41-5f0c2e8d1a77
              amount: { amountMinor: 84250000, currency: KES }
            methods: [totp, passkey]
            maxAgeSeconds: 300
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: >-
        Not allowed: missing permission or project scope (`forbidden`), maker-checker violation
        (`maker-checker-violation`), approval limit exceeded (`approval-limit-exceeded`), or, on
        webhooks, a source IP or signature that is rejected
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: >-
        Not found, or not visible to the caller. The API never reveals whether a resource of
        another tenant exists.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: >-
        The current state does not allow the action (`invalid-state`), the `version` is stale
        (`version-conflict`), a duplicate exists (`duplicate`), a business rule blocks it (for
        example `insufficient-float`, `three-way-mismatch`, `two-sites`, `below-min-quotes`), or
        a request with the same Idempotency-Key is still running
        (`idempotency-request-in-progress`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdempotencyConflict:
      description: The Idempotency-Key was already used with a different request body (`idempotency-key-reused`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://pm-buddy.dev/problems/idempotency-key-reused
            title: This Idempotency-Key was used for a different request
            status: 422
            code: idempotency-key-reused
            traceId: 5b8aa5a2d2c872e8321cf37308d69df2
    Underage:
      description: Registration blocked because the person is under 18 (`underage`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://pm-buddy.dev/problems/underage
            title: Registration blocked
            status: 422
            detail: The date of birth shows this person is under 18. Labourers must be 18 or older.
            code: underage
            errors:
              - pointer: /dateOfBirth
                code: underage
                detail: Must be 18 or older on the registration date
            traceId: 3c8f2e1d9a7b4c6e8f0a1b2c3d4e5f60
    DpiaNotApproved:
      description: >-
        Biometric processing is blocked because the tenant's DPIA is not approved
        (`dpia-not-approved`) or there is no active explicit consent for the modality
        (`consent-required`). The non-biometric attendance method keeps working.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            dpiaNotApproved:
              value:
                type: https://pm-buddy.dev/problems/dpia-not-approved
                title: Biometric attendance is not enabled yet
                status: 409
                detail: Record an approved DPIA before enrolling biometrics.
                code: dpia-not-approved
                traceId: 9d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
            consentRequired:
              value:
                type: https://pm-buddy.dev/problems/consent-required
                title: Consent is missing
                status: 409
                detail: Capture the worker's explicit consent for this modality first.
                code: consent-required
                traceId: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
    PayloadTooLarge:
      description: The body or file exceeds the configured size limit (`payload-too-large`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: >-
        The content type is not allowed, or the sniffed type does not match the declared one
        (`unsupported-media-type`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests (`rate-limited`)
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    JobAccepted:
      description: Accepted for background processing. Poll the job at `Location`.
      headers:
        Location: { $ref: "#/components/headers/Location" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Job" }
    NoContent:
      description: Done. No content.
  schemas:
    # ----------------------------------------------------------- primitives
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 (time-ordered). Records created offline use client-generated values.
      examples: ["01936f7e-8c2a-7b3d-9a41-5f0c2e8d1a77"]
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with offset, returned in UTC
      examples: ["2026-11-10T15:40:08Z"]
    BusinessDate:
      type: string
      format: date
      description: >-
        Business date in Africa/Nairobi, ISO 8601 `YYYY-MM-DD`. `DD/MM/YYYY` is display-only and
        never used in the API.
      examples: ["2026-11-10"]
    Currency:
      type: string
      enum: [KES, USD, GBP, EUR]
      description: KES settles every payment. USD, GBP and EUR are for display only.
    Money:
      type: object
      description: >-
        An amount in integer minor units (cents), never a float. Safe up to 2^53 - 1 in JSON.
        Negative values are used for credits and omissions.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Minor units, so KES 1,250,000.00 is 125000000
        currency: { $ref: "#/components/schemas/Currency" }
      examples:
        - { amountMinor: 125000000, currency: KES }
    Decimal:
      type: string
      pattern: "^-?\\d{1,16}(\\.\\d{1,4})?$"
      description: >-
        Decimal as a string, matching numeric(20,4): quantities, rates and percentages (rates are
        fractions, so 16% is "0.1600").
      examples: ["12.5000", "0.1600"]
    Coordinate:
      type: string
      pattern: "^-?\\d{1,3}(\\.\\d{1,8})?$"
      description: WGS 84 latitude or longitude in decimal degrees, as a string
      examples: ["-1.1460320"]
    Phone:
      type: string
      pattern: "^254(7|1)\\d{8}$"
      description: Kenyan mobile number normalised to 2547XXXXXXXX or 2541XXXXXXXX
      examples: ["254712345678"]
    MaskedValue:
      type: string
      readOnly: true
      description: Masked sensitive value. Full values only come from audited reveal endpoints.
      examples: ["2547****5678"]
    Locale:
      type: string
      enum: [en, sw]
    GeoFix:
      type: object
      description: GPS fix captured with a record, used for geofence and impossible-travel checks
      required: [lat, lon]
      properties:
        lat: { $ref: "#/components/schemas/Coordinate" }
        lon: { $ref: "#/components/schemas/Coordinate" }
        accuracyM: { type: integer, minimum: 0 }
        gnssTime: { $ref: "#/components/schemas/Timestamp" }
        mockLocation: { type: boolean }
    # --------------------------------------------------- envelopes, errors
    Problem:
      type: object
      description: RFC 9457 problem details with the PM-Buddy extension members
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI under https://pm-buddy.dev/problems/
        title:
          type: string
          description: Short summary, localised with Accept-Language
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          description: Human-readable explanation, localised with Accept-Language
        instance: { type: string, format: uri-reference }
        code:
          type: string
          description: Stable machine-readable code, the last segment of `type`
          examples: [validation-failed]
        errors:
          type: array
          items: { $ref: "#/components/schemas/ProblemError" }
        traceId:
          type: string
          description: OpenTelemetry trace ID to quote to support
    ProblemError:
      type: object
      required: [pointer, code]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the field in the request body
          examples: [/phone]
        code: { type: string, examples: [invalid_phone] }
        detail: { type: string }
    StepUpAction:
      type: object
      description: The action that a step-up token is bound to
      required: [action, entityType, entityId]
      properties:
        action: { type: string, examples: [payroll.approve] }
        entityType: { type: string, examples: [payroll_batch] }
        entityId: { $ref: "#/components/schemas/Uuid" }
        amount: { $ref: "#/components/schemas/Money" }
    StepUpProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            stepUp: { $ref: "#/components/schemas/StepUpAction" }
            methods:
              type: array
              items: { type: string, enum: [totp, passkey] }
            maxAgeSeconds: { type: integer }
    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
          description: Opaque cursor for the next page, or null on the last page
        hasMore: { type: boolean }
    Page:
      type: object
      description: >-
        Envelope for every collection. Each operation narrows the type of the `data` items.
        Small catalogues return a single page with `hasMore` false.
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items: {}
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    Resource:
      type: object
      description: Standard columns returned on tenant-owned resources
      properties:
        id: { type: string, format: uuid, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        createdBy: { type: string, format: uuid, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        updatedBy: { type: string, format: uuid, readOnly: true }
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency. Send back the version you read when patching.
    Job:
      type: object
      required: [id, kind, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind:
          type: string
          enum:
            - bq_import_parse
            - bq_export
            - certificate_render
            - report_export
            - statutory_export
            - timesheet_generation
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progressPct: { type: integer, minimum: 0, maximum: 100 }
        result:
          type: object
          description: Kind-specific summary, for example row counts
          additionalProperties: true
        download: { $ref: "#/components/schemas/DownloadUrl" }
        error: { $ref: "#/components/schemas/Problem" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        finishedAt: { $ref: "#/components/schemas/Timestamp" }
    DownloadUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: Short-lived pre-signed GET URL to a private bucket
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ApprovalComment:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string, maxLength: 1000 }
    ReviewDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, return] }
        comment: { type: string, maxLength: 1000 }
    ApprovalRecord:
      type: object
      description: One maker-checker step
      properties:
        step: { type: string, enum: [prepare, review, approve] }
        decision: { type: string, enum: [approved, rejected, returned] }
        actorUserId: { $ref: "#/components/schemas/Uuid" }
        at: { $ref: "#/components/schemas/Timestamp" }
        stepUpVerified: { type: boolean }
        comment: { type: string }
    ExportRequest:
      type: object
      required: [format]
      properties:
        format: { type: string, enum: [xlsx, pdf] }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string, examples: [0.1.0] }
        checks:
          type: object
          description: Result per dependency (database, redis, storage, queues)
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, down] }
              latencyMs: { type: integer }
    # --------------------------------------------------------- auth and mfa
    SignUpRequest:
      type: object
      required: [identifier, password, displayName]
      properties:
        identifier:
          type: string
          description: Email address, or a phone number (normalised to 2547 or 2541)
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
        displayName: { type: string, maxLength: 120 }
        locale: { $ref: "#/components/schemas/Locale" }
    OtpDispatch:
      type: object
      required: [channel, expiresAt]
      properties:
        channel: { type: string, enum: [sms, whatsapp, email] }
        destination: { $ref: "#/components/schemas/MaskedValue" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        resendAfterSeconds: { type: integer }
    OtpSendRequest:
      type: object
      required: [identifier, purpose]
      properties:
        identifier: { type: string }
        purpose:
          type: string
          enum: [verify, login, password_reset, payout_phone_change]
        channel: { type: string, enum: [sms, whatsapp, email] }
    OtpVerifyRequest:
      type: object
      required: [identifier, code]
      properties:
        identifier: { type: string }
        code: { type: string, pattern: "^\\d{6}$", writeOnly: true }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string, format: password, writeOnly: true }
    LoginMfaRequest:
      type: object
      required: [mfaToken, method, code]
      properties:
        mfaToken: { type: string, writeOnly: true }
        method: { type: string, enum: [totp, recovery_code, otp] }
        code: { type: string, writeOnly: true }
    AuthResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required, mfa_enrolment_required]
        user: { $ref: "#/components/schemas/User" }
        activeTenantId: { type: [string, "null"], format: uuid }
        sessionId: { $ref: "#/components/schemas/Uuid" }
        accessTokenExpiresAt: { $ref: "#/components/schemas/Timestamp" }
        mfaToken:
          type: string
          description: Short-lived, single-use token when `status` is `mfa_required`
        mfaMethods:
          type: array
          items: { type: string, enum: [totp, passkey, recovery_code, otp] }
        tokens: { $ref: "#/components/schemas/NativeTokens" }
    NativeTokens:
      type: object
      description: >-
        Only returned to registered site-app devices (requests with a valid device proof).
        Browsers receive cookies only.
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
          description: Site app only. Browsers send the refresh cookie instead.
    PasswordResetRequest:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string }
    PasswordResetConfirm:
      type: object
      required: [identifier, code, newPassword]
      properties:
        identifier: { type: string }
        code: { type: string, pattern: "^\\d{6}$", writeOnly: true }
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
    SwitchTenantRequest:
      type: object
      required: [tenantId]
      properties:
        tenantId: { $ref: "#/components/schemas/Uuid" }
    PasskeyAuthenticationOptionsRequest:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, enum: [login, second_factor, step_up] }
        identifier: { type: string, description: Optional for usernameless sign-in }
        mfaToken: { type: string, writeOnly: true }
        stepUp: { $ref: "#/components/schemas/StepUpAction" }
    PasskeyOptions:
      type: object
      description: >-
        WebAuthn options JSON produced by SimpleWebAuthn (creation or request options), passed
        unchanged to the browser
      required: [challenge]
      properties:
        challenge: { type: string, description: Base64url challenge }
        challengeId: { $ref: "#/components/schemas/Uuid" }
      additionalProperties: true
    PasskeyAssertion:
      type: object
      required: [challengeId, credential]
      properties:
        challengeId: { $ref: "#/components/schemas/Uuid" }
        mfaToken: { type: string, writeOnly: true }
        credential:
          type: object
          description: AuthenticationResponseJSON from the browser
          additionalProperties: true
    PasskeyRegistrationRequest:
      type: object
      required: [challengeId, credential]
      properties:
        challengeId: { $ref: "#/components/schemas/Uuid" }
        nickname: { type: string, maxLength: 60 }
        credential:
          type: object
          description: RegistrationResponseJSON from the browser
          additionalProperties: true
    StepUpRequest:
      type: object
      required: [action, method]
      properties:
        action: { $ref: "#/components/schemas/StepUpAction" }
        method: { type: string, enum: [totp, passkey] }
        code:
          type: string
          writeOnly: true
          description: TOTP code when `method` is `totp`
        passkeyAssertion:
          type: object
          description: >-
            AuthenticationResponseJSON for a challenge requested with purpose `step_up`
          additionalProperties: true
    StepUpGrant:
      type: object
      required: [stepUpToken, actionHash, expiresAt]
      properties:
        stepUpToken:
          type: string
          description: Send as `X-Step-Up-Token`. Single use.
        actionHash:
          type: string
          description: SHA-256 over the action, entity and amount
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    TotpEnrolment:
      type: object
      required: [factorId, otpauthUri, secret]
      properties:
        factorId: { $ref: "#/components/schemas/Uuid" }
        otpauthUri: { type: string, description: otpauth URI to render as a QR code }
        secret: { type: string, description: "Base32 secret, shown once" }
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^\\d{6}$", writeOnly: true }
    MfaFactor:
      type: object
      required: [id, kind, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [totp, passkey] }
        nickname: { type: string }
        status: { type: string, enum: [pending, active] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        lastUsedAt: { $ref: "#/components/schemas/Timestamp" }
    MfaActivation:
      type: object
      required: [factor]
      properties:
        factor: { $ref: "#/components/schemas/MfaFactor" }
        recoveryCodes: { $ref: "#/components/schemas/RecoveryCodes" }
    RecoveryCodes:
      type: object
      required: [codes, generatedAt]
      properties:
        codes:
          type: array
          minItems: 10
          items: { type: string }
        generatedAt: { $ref: "#/components/schemas/Timestamp" }
    User:
      type: object
      required: [id, displayName, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        email: { type: [string, "null"], format: email }
        phone: { $ref: "#/components/schemas/MaskedValue" }
        displayName: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        mfaRequired:
          type: boolean
          readOnly: true
          description: True for Owner/Director, Finance and Admin roles
        status: { type: string, enum: [unverified, active, locked, disabled], readOnly: true }
    Session:
      type: object
      required: [id, createdAt, lastSeenAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        current: { type: boolean }
        activeTenantId: { $ref: "#/components/schemas/Uuid" }
        deviceId: { type: [string, "null"], format: uuid }
        ip: { type: string }
        userAgent: { type: string }
        mfaAt: { type: [string, "null"], format: date-time }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        lastSeenAt: { $ref: "#/components/schemas/Timestamp" }
    Device:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { type: string, enum: [site_app, kiosk, terminal] }
        siteId: { type: [string, "null"], format: uuid }
        label: { type: string }
        model: { type: string }
        appVersion: { type: string }
        publicKeyThumbprint: { type: string, readOnly: true }
        status: { type: string, enum: [active, revoked], readOnly: true }
        lastSeenAt: { $ref: "#/components/schemas/Timestamp" }
    DeviceRegistration:
      type: object
      required: [publicKey, kind]
      properties:
        publicKey:
          type: string
          description: Ed25519 public key (32 raw bytes, base64url)
        kind: { type: string, enum: [site_app, kiosk] }
        provisioningCode:
          type: string
          writeOnly: true
          description: One-time code from the provisioning QR (kiosks and shared site phones)
        model: { type: string }
        osVersion: { type: string }
        appVersion: { type: string }
    # -------------------------------------------------------------- tenancy
    Tenant:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [name]
          properties:
            name: { type: string, examples: [Mjengo Bora Contractors] }
            legalName: { type: string }
            kraPin:
              type: string
              writeOnly: true
              pattern: "^[AP]\\d{9}[A-Z]$"
            kraPinMasked: { $ref: "#/components/schemas/MaskedValue" }
            ncaRegistrationNo: { type: string }
            defaultLocale: { $ref: "#/components/schemas/Locale" }
            status: { type: string, enum: [active, suspended], readOnly: true }
            dpiaStatus:
              type: string
              enum: [not_started, approved, withdrawn]
              readOnly: true
    Invitation:
      type: object
      required: [emailOrPhone, membershipKind, roleId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        emailOrPhone: { type: string }
        membershipKind: { type: string, enum: [staff, client, supplier, consultant] }
        roleId: { $ref: "#/components/schemas/Uuid" }
        projectId: { $ref: "#/components/schemas/Uuid" }
        supplierId:
          $ref: "#/components/schemas/Uuid"
        approvalLimit: { $ref: "#/components/schemas/Money" }
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
          readOnly: true
        expiresAt: { type: string, format: date-time, readOnly: true }
    InvitationAccept:
      type: object
      required: [token]
      properties:
        token: { type: string, writeOnly: true }
    RoleGrant:
      type: object
      required: [roleId]
      properties:
        roleId: { $ref: "#/components/schemas/Uuid" }
        roleKey: { type: string, readOnly: true }
        approvalLimit: { $ref: "#/components/schemas/Money" }
    Membership:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user: { $ref: "#/components/schemas/User" }
        kind: { type: string, enum: [staff, client, supplier, consultant] }
        status: { type: string, enum: [invited, active, suspended] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleGrant" }
    ProjectMembership:
      type: object
      required: [userId, roleId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        projectId: { type: string, format: uuid, readOnly: true }
        userId: { $ref: "#/components/schemas/Uuid" }
        roleId: { $ref: "#/components/schemas/Uuid" }
        roleKey: { type: string, readOnly: true, examples: [qs] }
        approvalLimit: { $ref: "#/components/schemas/Money" }
        user: { $ref: "#/components/schemas/User" }
    Role:
      type: object
      required: [id, key, name, isSystem, permissions]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        key: { type: string, examples: [finance] }
        name: { type: string }
        isSystem: { type: boolean }
        mfaRequired: { type: boolean }
        permissions:
          type: array
          items: { type: string, examples: [payments.approve] }
    Permission:
      type: object
      required: [key, module]
      properties:
        key: { type: string, examples: [payments.approve] }
        module: { type: string, examples: [payments] }
        description: { type: string }
        stepUp: { type: boolean, description: True when actions under it always need step-up }
    Me:
      type: object
      required: [user, memberships, permissions]
      properties:
        user: { $ref: "#/components/schemas/User" }
        activeTenant: { $ref: "#/components/schemas/Tenant" }
        memberships:
          type: array
          items:
            type: object
            properties:
              tenantId: { $ref: "#/components/schemas/Uuid" }
              tenantName: { type: string }
              kind: { type: string, enum: [staff, client, supplier, consultant] }
              status: { type: string, enum: [invited, active, suspended] }
        permissions:
          type: array
          description: Effective tenant-wide permissions in the active tenant
          items: { type: string }
        projectRoles:
          type: array
          items: { $ref: "#/components/schemas/ProjectMembership" }
        mfaFactors:
          type: array
          items: { $ref: "#/components/schemas/MfaFactor" }
        session: { $ref: "#/components/schemas/Session" }
    # ---------------------------------------------------------------- audit
    AuditLogEntry:
      type: object
      required: [id, occurredAt, action, entityType, hash]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        actorUserId: { type: [string, "null"], format: uuid }
        actorDeviceId: { type: [string, "null"], format: uuid }
        ip: { type: string }
        requestId: { type: string }
        action:
          type: string
          enum: [create, update, delete, approve, reject, login, export, reveal, override]
        entityType: { type: string, examples: [payroll_batch] }
        entityId: { $ref: "#/components/schemas/Uuid" }
        before: { type: [object, "null"], description: Values before the change (secrets redacted) }
        after: { type: [object, "null"], description: Values after the change (secrets redacted) }
        reason: { type: string }
        prevHash: { type: string, description: Hex SHA-256 of the previous entry }
        hash: { type: string, description: Hex SHA-256 chaining this entry to the previous one }
    # --------------------------------------------------------- config rules
    ComplianceStatus:
      type: string
      enum: [draft, needs_review, approved]
      description: Anything but `approved` shows the COMPLIANCE-REVIEW banner where it is used
    ConfigRule:
      type: object
      required: [key, scope, value, effectiveFrom]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        key: { type: string, examples: [payroll.shif] }
        scope: { type: string, enum: [platform, tenant, project] }
        scopeId: { type: [string, "null"], format: uuid }
        value:
          description: JSON value validated by the Zod schema registered for the key
        effectiveFrom: { $ref: "#/components/schemas/BusinessDate" }
        effectiveTo: { type: [string, "null"], format: date }
        version: { type: integer, readOnly: true }
        sourceReference:
          type: string
          description: Gazette notice, circular or other source for the value
        complianceStatus: { $ref: "#/components/schemas/ComplianceStatus" }
        proposedBy: { type: string, format: uuid, readOnly: true }
        approvedBy: { type: string, format: uuid, readOnly: true }
        approvedAt: { type: string, format: date-time, readOnly: true }
    ResolvedConfigRule:
      type: object
      required: [key, value, ruleVersionId, resolvedScope, complianceStatus]
      properties:
        key: { type: string }
        value:
          description: The effective value
        ruleVersionId:
          $ref: "#/components/schemas/Uuid"
        resolvedScope: { type: string, enum: [platform, tenant, project] }
        effectiveFrom: { $ref: "#/components/schemas/BusinessDate" }
        effectiveTo: { type: [string, "null"], format: date }
        complianceStatus: { $ref: "#/components/schemas/ComplianceStatus" }
    StatutoryRule:
      type: object
      required: [kind, params, effectiveFrom]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { type: string, enum: [paye, nssf, shif, ahl, nita] }
        scope: { type: string, enum: [platform, tenant] }
        params:
          type: object
          description: Relief, floors, caps, flat rates, and lower and upper earnings limits
          additionalProperties: true
        bands:
          type: array
          items: { $ref: "#/components/schemas/StatutoryRuleBand" }
        effectiveFrom: { $ref: "#/components/schemas/BusinessDate" }
        effectiveTo: { type: [string, "null"], format: date }
        version: { type: integer, readOnly: true }
        sourceReference: { type: string }
        complianceStatus: { $ref: "#/components/schemas/ComplianceStatus" }
    StatutoryRuleBand:
      type: object
      required: [seq, lower, rate]
      properties:
        seq: { type: integer, minimum: 1 }
        lower: { $ref: "#/components/schemas/Money" }
        upper:
          description: Upper bound of the band; null means no cap
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        rate: { $ref: "#/components/schemas/Decimal" }
    PublicHoliday:
      type: object
      required: [holidayDate, nameEn, nameSw]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        holidayDate: { $ref: "#/components/schemas/BusinessDate" }
        nameEn: { type: string, examples: [Jamhuri Day] }
        nameSw: { type: string, examples: [Siku ya Jamhuri] }
        scope: { type: string, enum: [platform, tenant] }
        gazetteReference: { type: string }
    OvertimeRule:
      type: object
      required: [dayType, multiplier, effectiveFrom]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        scope: { type: string, enum: [platform, tenant, project] }
        dayType: { type: string, enum: [weekday, rest_day, public_holiday] }
        thresholdHours: { $ref: "#/components/schemas/Decimal" }
        multiplier: { $ref: "#/components/schemas/Decimal" }
        effectiveFrom: { $ref: "#/components/schemas/BusinessDate" }
        effectiveTo: { type: [string, "null"], format: date }
        complianceStatus: { $ref: "#/components/schemas/ComplianceStatus" }
    # ------------------------------------------------------ projects, sites
    Client:
      type: object
      required: [kind, name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { type: string, enum: [individual, company] }
        name: { type: string }
        email: { type: string, format: email }
        phone: { allOf: [{ $ref: "#/components/schemas/Phone" }], writeOnly: true }
        phoneMasked: { $ref: "#/components/schemas/MaskedValue" }
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2, for diaspora clients
        preferredCurrency: { $ref: "#/components/schemas/Currency" }
    Project:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [code, name, contractType, startDate]
          properties:
            code:
              type: string
              pattern: "^[A-Z0-9-]{3,12}$"
              description: Unique in the tenant. Also the M-Pesa C2B account number.
              examples: [RUI-APT]
            name: { type: string, examples: [Ruiru 4-storey apartments] }
            clientId: { $ref: "#/components/schemas/Uuid" }
            client: { $ref: "#/components/schemas/Client" }
            contractType:
              type: string
              enum: [jbc, lump_sum, remeasurement, design_and_build]
            contractSum:
              $ref: "#/components/schemas/Money"
            startDate: { $ref: "#/components/schemas/BusinessDate" }
            endDate: { $ref: "#/components/schemas/BusinessDate" }
            county: { type: string, examples: [Kiambu] }
            status:
              type: string
              enum: [planning, active, practical_completion, dlp, closed]
            dlpMonths: { type: integer, minimum: 0 }
            currentBqVersionId: { type: string, format: uuid, readOnly: true }
    ProjectDashboard:
      type: object
      required: [projectId, asOf]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
        asOf: { $ref: "#/components/schemas/Timestamp" }
        percentComplete: { $ref: "#/components/schemas/Decimal" }
        budget: { $ref: "#/components/schemas/Money" }
        actualCost: { $ref: "#/components/schemas/Money" }
        committed: { $ref: "#/components/schemas/Money" }
        budgetBurnPct: { $ref: "#/components/schemas/Decimal" }
        cashReceived: { $ref: "#/components/schemas/Money" }
        cashPaid: { $ref: "#/components/schemas/Money" }
        labourOnSiteToday: { type: integer }
        openAnomalies: { type: integer }
        openAlerts: { type: integer }
        openSnags: { type: integer }
        nextMilestone: { $ref: "#/components/schemas/Milestone" }
    Site:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [name]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            name: { type: string, examples: [Ruiru Block A] }
            address: { type: string }
            county: { type: string }
            activeGeofence: { $ref: "#/components/schemas/Geofence" }
    Geofence:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind, activeFrom]
          properties:
            siteId: { type: string, format: uuid, readOnly: true }
            kind: { type: string, enum: [polygon, radius] }
            polygon:
              type: object
              description: GeoJSON Polygon (WGS 84) when `kind` is `polygon`
              additionalProperties: true
            centerLat: { $ref: "#/components/schemas/Coordinate" }
            centerLon: { $ref: "#/components/schemas/Coordinate" }
            radiusM: { type: integer, minimum: 10, maximum: 5000 }
            activeFrom: { $ref: "#/components/schemas/BusinessDate" }
            activeTo: { type: [string, "null"], format: date, readOnly: true }
    WbsNode:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [code, name]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            parentId: { type: [string, "null"], format: uuid }
            code: { type: string, examples: ["2.1"] }
            name: { type: string, examples: [Substructure] }
            sort: { type: integer }
    Milestone:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [name, plannedDate]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            wbsNodeId: { $ref: "#/components/schemas/Uuid" }
            name: { type: string, examples: [Roof slab cast] }
            plannedDate: { $ref: "#/components/schemas/BusinessDate" }
            actualDate: { type: [string, "null"], format: date }
            paymentLinked: { type: boolean }
    # ------------------------------------------------------------- schedule
    ScheduleActivity:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [name, plannedStart, plannedFinish]
          properties:
            wbsNodeId: { $ref: "#/components/schemas/Uuid" }
            bqItemId: { $ref: "#/components/schemas/Uuid" }
            name: { type: string }
            plannedStart: { $ref: "#/components/schemas/BusinessDate" }
            plannedFinish: { $ref: "#/components/schemas/BusinessDate" }
            actualStart: { type: [string, "null"], format: date }
            actualFinish: { type: [string, "null"], format: date }
            percentComplete: { $ref: "#/components/schemas/Decimal" }
    ActivityDependency:
      type: object
      required: [predecessorId, kind]
      properties:
        predecessorId: { $ref: "#/components/schemas/Uuid" }
        successorId: { type: string, format: uuid, readOnly: true }
        kind: { type: string, enum: [FS, SS, FF, SF] }
        lagDays: { type: integer }
    ActivityPredecessors:
      type: object
      required: [predecessors]
      properties:
        predecessors:
          type: array
          items: { $ref: "#/components/schemas/ActivityDependency" }
    ScheduleBaseline:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, examples: [Contract programme] }
        capturedAt: { type: string, format: date-time, readOnly: true }
    DelayEvent:
      type: object
      required: [cause, startDate]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        activityId: { type: string, format: uuid, readOnly: true }
        cause:
          type: string
          enum: [rain, materials, late_payment, approvals, design_change, other]
        startDate: { $ref: "#/components/schemas/BusinessDate" }
        endDate: { $ref: "#/components/schemas/BusinessDate" }
        days: { $ref: "#/components/schemas/Decimal" }
        notes: { type: string }
        diaryId: { $ref: "#/components/schemas/Uuid" }
    Schedule:
      type: object
      required: [projectId, activities, dependencies]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/ScheduleActivity" }
        dependencies:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ActivityDependency"
              - required: [successorId]
        baselines:
          type: array
          items: { $ref: "#/components/schemas/ScheduleBaseline" }
        baselineActivities:
          type: array
          description: Planned dates of the selected baseline, per activity
          items:
            type: object
            properties:
              activityId: { $ref: "#/components/schemas/Uuid" }
              plannedStart: { $ref: "#/components/schemas/BusinessDate" }
              plannedFinish: { $ref: "#/components/schemas/BusinessDate" }
        delayEvents:
          type: array
          items: { $ref: "#/components/schemas/DelayEvent" }
        criticalPathActivityIds:
          type: array
          items: { $ref: "#/components/schemas/Uuid" }
    # ------------------------------------------------------------------- bq
    BqImportUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        bqId: { $ref: "#/components/schemas/Uuid" }
        bqName: { type: string, examples: [Main contract BQ] }
        mappingTemplateId: { $ref: "#/components/schemas/Uuid" }
    BqImportJob:
      type: object
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        projectId: { $ref: "#/components/schemas/Uuid" }
        bqId: { $ref: "#/components/schemas/Uuid" }
        fileId: { $ref: "#/components/schemas/Uuid" }
        status:
          type: string
          enum: [uploaded, parsing, parsed, mapped, validated, imported, failed]
        columnMapping: { $ref: "#/components/schemas/ColumnMapping" }
        sheetTotal: { $ref: "#/components/schemas/Money" }
        computedTotal: { $ref: "#/components/schemas/Money" }
        errorCount: { type: integer }
        warningCount: { type: integer }
        bqVersionId:
          type: [string, "null"]
          format: uuid
          description: Set once the import is committed
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    BqImportSheets:
      type: object
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            type: object
            required: [name, rowCount]
            properties:
              name: { type: string, examples: [Bill 2 Substructure] }
              rowCount: { type: integer }
              detectedHeaderRow: { type: integer }
              suggestedMapping: { $ref: "#/components/schemas/ColumnMapping" }
              previewRows:
                type: array
                description: Raw cell values as text, row by row
                items:
                  type: array
                  items: { type: [string, "null"] }
    ColumnMapping:
      type: object
      required: [sheetName, headerRow, columns]
      properties:
        sheetName: { type: string }
        headerRow: { type: integer, minimum: 1 }
        firstDataRow: { type: integer, minimum: 1 }
        columns:
          type: object
          description: Spreadsheet column letters for each BQ field
          required: [description]
          properties:
            itemRef: { type: string, pattern: "^[A-Z]{1,3}$" }
            description: { type: string, pattern: "^[A-Z]{1,3}$" }
            unit: { type: string, pattern: "^[A-Z]{1,3}$" }
            quantity: { type: string, pattern: "^[A-Z]{1,3}$" }
            rate: { type: string, pattern: "^[A-Z]{1,3}$" }
            amount: { type: string, pattern: "^[A-Z]{1,3}$" }
            notes: { type: string, pattern: "^[A-Z]{1,3}$" }
        billDetection:
          type: string
          enum: [sheet_per_bill, heading_rows, item_ref_prefix]
        sectionDetection:
          type: string
          enum: [heading_rows, bold_rows, item_ref_prefix, none]
        unitAliases:
          type: object
          description: Maps spellings found in the sheet to unit codes, for example "Cu.m" to "m3"
          additionalProperties: { type: string }
        saveAsTemplateName:
          type: string
          writeOnly: true
          description: Save this mapping as a reusable template for the QS firm's format
    BqImportValidation:
      type: object
      required: [totalsMatch, sheetTotal, computedTotal, issues]
      properties:
        totalsMatch: { type: boolean }
        sheetTotal: { $ref: "#/components/schemas/Money" }
        computedTotal: { $ref: "#/components/schemas/Money" }
        difference: { $ref: "#/components/schemas/Money" }
        billTotals:
          type: array
          items:
            type: object
            properties:
              bill: { type: string }
              sheetTotal: { $ref: "#/components/schemas/Money" }
              computedTotal: { $ref: "#/components/schemas/Money" }
              matches: { type: boolean }
        counts:
          type: object
          properties:
            bills: { type: integer }
            sections: { type: integer }
            items: { type: integer }
        issues:
          type: array
          items:
            type: object
            required: [row, severity, code]
            properties:
              row: { type: integer }
              column: { type: string }
              severity: { type: string, enum: [error, warning] }
              code: { type: string, examples: [amount_mismatch] }
              message: { type: string }
    BqImportCommit:
      type: object
      properties:
        acceptTotalsDifference: { type: boolean, default: false }
        reason:
          type: string
          description: Required when `acceptTotalsDifference` is true
    BqVersion:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            bqId: { type: string, format: uuid, readOnly: true }
            versionNo: { type: integer, readOnly: true }
            status: { type: string, enum: [draft, approved, superseded], readOnly: true }
            source: { type: string, enum: [import, variation, manual], readOnly: true }
            variationOrderId: { type: [string, "null"], format: uuid, readOnly: true }
            contractSum: { $ref: "#/components/schemas/Money" }
            vatRate: { $ref: "#/components/schemas/Decimal" }
            vatRuleVersionId: { type: string, format: uuid, readOnly: true }
            approvedBy: { type: [string, "null"], format: uuid, readOnly: true }
            approvedAt: { type: [string, "null"], format: date-time, readOnly: true }
    BqTree:
      type: object
      required: [bqVersionId, bills]
      properties:
        bqVersionId: { $ref: "#/components/schemas/Uuid" }
        subtotal: { $ref: "#/components/schemas/Money" }
        vat: { $ref: "#/components/schemas/Money" }
        contractSum: { $ref: "#/components/schemas/Money" }
        bills:
          type: array
          items: { $ref: "#/components/schemas/BqBill" }
    BqBill:
      type: object
      required: [id, number, title, kind]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        number: { type: string, examples: [Bill No. 2] }
        title: { type: string, examples: [Substructure] }
        kind:
          type: string
          enum: [preliminaries, measured, provisional, pc_sum, contingency, dayworks]
        total: { $ref: "#/components/schemas/Money" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/BqSection" }
    BqSection:
      type: object
      required: [id, title]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        title: { type: string, examples: [Concrete work] }
        total: { $ref: "#/components/schemas/Money" }
        sections:
          type: array
          description: Sub-elements
          items: { $ref: "#/components/schemas/BqSection" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BqItem" }
    BqItem:
      type: object
      required: [id, lineageId, itemRef, description, unitCode, itemType]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        lineageId:
          $ref: "#/components/schemas/Uuid"
        itemRef: { type: string, examples: [B] }
        description:
          type: string
          examples: ["Vibrated reinforced concrete class 25 (1:2:4) in foundations"]
        unitCode: { type: string, examples: [m3] }
        quantity: { $ref: "#/components/schemas/Decimal" }
        rate: { $ref: "#/components/schemas/Money" }
        amount: { $ref: "#/components/schemas/Money" }
        itemType:
          type: string
          enum: [measured, prov_sum, pc_sum, lump_sum, dayworks, note]
        rateBuildUpId: { type: [string, "null"], format: uuid }
        notes: { type: string }
    RateBuildUp:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [code, name, outputUnitCode, components]
          properties:
            code: { type: string, examples: [CONC-C25] }
            name: { type: string, examples: ["Concrete class 25 (1:2:4)"] }
            outputUnitCode: { type: string, examples: [m3] }
            revision: { type: integer, readOnly: true }
            components:
              type: array
              items: { $ref: "#/components/schemas/RateBuildUpComponent" }
    RateBuildUpComponent:
      type: object
      required: [kind, quantity, unitCode]
      properties:
        kind: { type: string, enum: [material, labour, plant] }
        materialId: { $ref: "#/components/schemas/Uuid" }
        tradeId: { $ref: "#/components/schemas/Uuid" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string, examples: [bag] }
        wastagePct: { $ref: "#/components/schemas/Decimal" }
    # ----------------------------------------------------------- variations
    Instruction:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [number, issuerKind, issuedOn, subject]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            number: { type: string, examples: [AI-007] }
            issuerKind: { type: string, enum: [architect, engineer, qs, client] }
            consultantId: { $ref: "#/components/schemas/Uuid" }
            issuedOn: { $ref: "#/components/schemas/BusinessDate" }
            subject: { type: string }
            fileId: { $ref: "#/components/schemas/Uuid" }
    VariationOrder:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [instructionId, title, lines]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            instructionId: { $ref: "#/components/schemas/Uuid" }
            number: { type: string, readOnly: true, examples: [VO-004] }
            title: { type: string }
            amount: { $ref: "#/components/schemas/Money" }
            status:
              type: string
              enum: [draft, submitted, approved, rejected]
              readOnly: true
            clientDecision:
              type: string
              enum: [not_required, pending, approved, rejected]
              readOnly: true
            clientComment: { type: string, readOnly: true }
            resultingBqVersionId: { type: [string, "null"], format: uuid, readOnly: true }
            lines:
              type: array
              items: { $ref: "#/components/schemas/VariationLine" }
    VariationLine:
      type: object
      required: [action, description]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        bqItemLineageId:
          type: [string, "null"]
          format: uuid
          description: Null for new items
        action: { type: string, enum: [add, omit, adjust] }
        description: { type: string }
        unitCode: { type: string }
        quantityDelta: { $ref: "#/components/schemas/Decimal" }
        rate: { $ref: "#/components/schemas/Money" }
        amount: { $ref: "#/components/schemas/Money" }
    ClientDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        comment: { type: string, maxLength: 2000 }
        evidenceFileId:
          $ref: "#/components/schemas/Uuid"
    BqVersionSummary:
      type: object
      required: [bqVersionId, versionNo, contractSum]
      properties:
        bqVersionId: { $ref: "#/components/schemas/Uuid" }
        versionNo: { type: integer }
        contractSum: { $ref: "#/components/schemas/Money" }
    BqVersionComparison:
      type: object
      required: [base, compare, difference]
      properties:
        base: { $ref: "#/components/schemas/BqVersionSummary" }
        compare: { $ref: "#/components/schemas/BqVersionSummary" }
        difference: { $ref: "#/components/schemas/Money" }
        byBill:
          type: array
          items:
            type: object
            properties:
              billNumber: { type: string }
              title: { type: string }
              baseTotal: { $ref: "#/components/schemas/Money" }
              compareTotal: { $ref: "#/components/schemas/Money" }
              difference: { $ref: "#/components/schemas/Money" }
        variationOrders:
          type: array
          items:
            type: object
            properties:
              variationOrderId: { $ref: "#/components/schemas/Uuid" }
              number: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
    # -------------------------------------------------- progress, valuations
    ProgressMeasurement:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [bqItemId, measuredOn, quantityToDate]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            bqItemId: { $ref: "#/components/schemas/Uuid" }
            measuredOn: { $ref: "#/components/schemas/BusinessDate" }
            quantityToDate: { $ref: "#/components/schemas/Decimal" }
            quantityThisPeriod: { $ref: "#/components/schemas/Decimal" }
            percentComplete: { $ref: "#/components/schemas/Decimal" }
            valueToDate: { $ref: "#/components/schemas/Money" }
            photoIds:
              type: array
              items: { $ref: "#/components/schemas/Uuid" }
            status: { type: string, enum: [draft, submitted, approved], readOnly: true }
            overMeasured: { type: boolean, readOnly: true }
    EvmSummary:
      type: object
      required: [asOf, plannedValue, earnedValue, actualCost]
      properties:
        asOf: { $ref: "#/components/schemas/BusinessDate" }
        budgetAtCompletion: { $ref: "#/components/schemas/Money" }
        plannedValue: { $ref: "#/components/schemas/Money" }
        earnedValue: { $ref: "#/components/schemas/Money" }
        actualCost: { $ref: "#/components/schemas/Money" }
        costVariance: { $ref: "#/components/schemas/Money" }
        scheduleVariance: { $ref: "#/components/schemas/Money" }
        cpi: { $ref: "#/components/schemas/Decimal" }
        spi: { $ref: "#/components/schemas/Decimal" }
        estimateAtCompletion: { $ref: "#/components/schemas/Money" }
        percentComplete: { $ref: "#/components/schemas/Decimal" }
    SCurveSeries:
      type: object
      required: [interval, points]
      properties:
        interval: { type: string, enum: [week, month] }
        points:
          type: array
          items:
            type: object
            required: [periodEnd]
            properties:
              periodEnd: { $ref: "#/components/schemas/BusinessDate" }
              plannedCumulative: { $ref: "#/components/schemas/Money" }
              earnedCumulative: { $ref: "#/components/schemas/Money" }
              actualCumulative: { $ref: "#/components/schemas/Money" }
    Valuation:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [valuationDate]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            number: { type: integer, readOnly: true }
            valuationDate: { $ref: "#/components/schemas/BusinessDate" }
            materialsOnSite: { $ref: "#/components/schemas/Money" }
            grossWorkDone: { $ref: "#/components/schemas/Money" }
            retention: { $ref: "#/components/schemas/Money" }
            previousCertified: { $ref: "#/components/schemas/Money" }
            amountDue: { $ref: "#/components/schemas/Money" }
            vat: { $ref: "#/components/schemas/Money" }
            ruleSnapshot:
              type: object
              readOnly: true
              description: IDs of the retention and VAT rule versions used
              additionalProperties: true
            status:
              type: string
              enum: [draft, computed, approved, certified]
              readOnly: true
            lines:
              type: array
              readOnly: true
              items: { $ref: "#/components/schemas/ValuationLine" }
    ValuationLine:
      type: object
      properties:
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        quantityToDate: { $ref: "#/components/schemas/Decimal" }
        valueToDate: { $ref: "#/components/schemas/Money" }
        valueThisPeriod: { $ref: "#/components/schemas/Money" }
    PaymentCertificate:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [issuedOn, dueDate]
          properties:
            valuationId: { type: string, format: uuid, readOnly: true }
            number: { type: string, readOnly: true, examples: [IPC-04] }
            issuedOn: { $ref: "#/components/schemas/BusinessDate" }
            dueDate: { $ref: "#/components/schemas/BusinessDate" }
            amountDue: { $ref: "#/components/schemas/Money" }
            amountPaid: { $ref: "#/components/schemas/Money" }
            retentionHeld: { $ref: "#/components/schemas/Money" }
            status:
              type: string
              enum: [issued, part_paid, paid, cancelled]
              readOnly: true
            c2bAccountReference: { type: string, readOnly: true, examples: [RUI-APT] }
            fileId: { type: [string, "null"], format: uuid, readOnly: true }
    RetentionEntry:
      type: object
      required: [kind, amount, entryDate]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        certificateId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [held, release_practical_completion, release_dlp] }
        amount: { $ref: "#/components/schemas/Money" }
        entryDate: { $ref: "#/components/schemas/BusinessDate" }
    RetentionLedger:
      type: object
      required: [held, released, balance, entries]
      properties:
        held: { $ref: "#/components/schemas/Money" }
        released: { $ref: "#/components/schemas/Money" }
        balance: { $ref: "#/components/schemas/Money" }
        capReached: { type: boolean }
        entries:
          type: array
          items: { $ref: "#/components/schemas/RetentionEntry" }
    RetentionRelease:
      type: object
      required: [kind, amount, reason]
      properties:
        kind: { type: string, enum: [release_practical_completion, release_dlp] }
        amount: { $ref: "#/components/schemas/Money" }
        reason: { type: string }
    # --------------------------------------------------------------- labour
    Labourer:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [fullName, idType, idNumber, dateOfBirth, phone, tradeId, engagementType]
          properties:
            workerNo: { type: string, readOnly: true, examples: [W-00123] }
            fullName: { type: string, examples: [Wanjiru Kamau] }
            idType: { type: string, enum: [national_id, alien_id, passport] }
            idNumber:
              type: string
              writeOnly: true
              description: Encrypted at field level, with a blind index for duplicate checks
            idNumberMasked: { $ref: "#/components/schemas/MaskedValue" }
            dateOfBirth:
              $ref: "#/components/schemas/BusinessDate"
            gender: { type: string, enum: [female, male, other, undisclosed] }
            phone: { allOf: [{ $ref: "#/components/schemas/Phone" }], writeOnly: true }
            phoneMasked: { $ref: "#/components/schemas/MaskedValue" }
            photoFileId: { $ref: "#/components/schemas/Uuid" }
            tradeId: { $ref: "#/components/schemas/Uuid" }
            skillLevel: { type: string, enum: [skilled, semi_skilled, unskilled] }
            engagementType: { type: string, enum: [casual, term, piece_rate] }
            rateBasis: { type: string, enum: [hourly, daily, piece] }
            defaultRate: { $ref: "#/components/schemas/Money" }
            nextOfKin:
              type: object
              writeOnly: true
              properties:
                name: { type: string }
                relationship: { type: string }
                phone: { $ref: "#/components/schemas/Phone" }
            homeCounty: { type: string, examples: [Machakos] }
            nssfNo: { type: string, writeOnly: true }
            nssfNoMasked: { $ref: "#/components/schemas/MaskedValue" }
            shaNo: { type: string, writeOnly: true }
            shaNoMasked: { $ref: "#/components/schemas/MaskedValue" }
            kraPin: { type: string, writeOnly: true }
            kraPinMasked: { $ref: "#/components/schemas/MaskedValue" }
            inductionDate: { $ref: "#/components/schemas/BusinessDate" }
            doNotRehire:
              type: boolean
              readOnly: true
              description: Returned to managers only. The reason needs the reveal endpoint.
            casualConversionWarning:
              type: boolean
              readOnly: true
              description: Approaching the configurable continuous-engagement threshold (COMPLIANCE-REVIEW)
            biometricEnrolled: { type: boolean, readOnly: true }
            status: { type: string, enum: [active, inactive, left] }
    LabourerSensitive:
      type: object
      description: Only the fields that were requested are present
      required: [labourerId, revealedAt]
      properties:
        labourerId: { $ref: "#/components/schemas/Uuid" }
        idNumber: { type: string }
        phone: { $ref: "#/components/schemas/Phone" }
        kraPin: { type: string }
        nssfNo: { type: string }
        shaNo: { type: string }
        nextOfKin:
          type: object
          additionalProperties: true
        doNotRehireReason: { type: string }
        revealedAt: { $ref: "#/components/schemas/Timestamp" }
    RevealRequest:
      type: object
      required: [fields, reason]
      properties:
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [id_number, phone, kra_pin, nssf_no, sha_no, next_of_kin, do_not_rehire_reason]
        reason: { type: string, minLength: 5, maxLength: 500 }
    PayoutPhoneChange:
      type: object
      required: [phone, otpCode, reason]
      properties:
        phone: { $ref: "#/components/schemas/Phone" }
        otpCode: { type: string, pattern: "^\\d{6}$", writeOnly: true }
        reason: { type: string, minLength: 5 }
    Accreditation:
      type: object
      required: [kind, cardNo, expiresOn]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        labourerId: { type: string, format: uuid, readOnly: true }
        kind:
          type: string
          enum: [nca_skilled, nca_supervisor, welding, working_at_heights, other]
        cardNo: { type: string }
        issuedOn: { $ref: "#/components/schemas/BusinessDate" }
        expiresOn: { $ref: "#/components/schemas/BusinessDate" }
        fileId: { $ref: "#/components/schemas/Uuid" }
    Trade:
      type: object
      required: [id, key, nameEn, nameSw]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        key: { type: string, examples: [mason] }
        nameEn: { type: string, examples: [Mason] }
        nameSw: { type: string, examples: [Fundi mwashi] }
        active: { type: boolean }
    LabourRate:
      type: object
      required: [tradeId, skillLevel, basis, rate, effectiveFrom]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        projectId: { type: string, format: uuid, readOnly: true }
        tradeId: { $ref: "#/components/schemas/Uuid" }
        skillLevel: { type: string, enum: [skilled, semi_skilled, unskilled] }
        basis: { type: string, enum: [hourly, daily, piece] }
        rate: { $ref: "#/components/schemas/Money" }
        effectiveFrom: { $ref: "#/components/schemas/BusinessDate" }
        effectiveTo: { type: [string, "null"], format: date, readOnly: true }
    Gang:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [name, foremanLabourerId]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            name: { type: string, examples: [Masonry gang A] }
            foremanLabourerId: { $ref: "#/components/schemas/Uuid" }
            memberCount: { type: integer, readOnly: true }
    GangAssignmentSet:
      type: object
      required: [siteId, labourerIds]
      properties:
        gangId: { type: string, format: uuid, readOnly: true }
        workDate: { type: string, format: date, readOnly: true }
        siteId: { $ref: "#/components/schemas/Uuid" }
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        labourerIds:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
    LedgerTotals:
      type: object
      properties:
        daysWorked: { $ref: "#/components/schemas/Decimal" }
        normalHours: { $ref: "#/components/schemas/Decimal" }
        overtimeHours: { $ref: "#/components/schemas/Decimal" }
        earned: { $ref: "#/components/schemas/Money" }
        paid: { $ref: "#/components/schemas/Money" }
        advancesOutstanding: { $ref: "#/components/schemas/Money" }
    LabourerLedger:
      type: object
      required: [labourerId, totals]
      properties:
        labourerId: { $ref: "#/components/schemas/Uuid" }
        totals: { $ref: "#/components/schemas/LedgerTotals" }
        byProject:
          type: array
          items:
            type: object
            properties:
              projectId: { $ref: "#/components/schemas/Uuid" }
              projectName: { type: string }
              totals: { $ref: "#/components/schemas/LedgerTotals" }
    ProductivityReport:
      type: object
      required: [rows]
      properties:
        groupBy: { type: string, enum: [trade, gang, labourer] }
        rows:
          type: array
          items:
            type: object
            properties:
              key: { $ref: "#/components/schemas/Uuid" }
              label: { type: string }
              tradeKey: { type: string }
              outputQuantity: { $ref: "#/components/schemas/Decimal" }
              unitCode: { type: string, examples: [m2] }
              workerDays: { $ref: "#/components/schemas/Decimal" }
              outputPerWorkerDay: { $ref: "#/components/schemas/Decimal" }
    # --------------------------------------------------- consent, biometrics
    Consent:
      type: object
      required: [kind, textVersion, language, method, granted]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        labourerId: { type: string, format: uuid, readOnly: true }
        kind:
          type: string
          enum: [biometric_face, biometric_fingerprint, data_processing, photo]
        textVersion: { type: string, examples: [bio-consent-v3] }
        language: { $ref: "#/components/schemas/Locale" }
        method: { type: string, enum: [signed, read_aloud_witnessed] }
        granted: { type: boolean }
        witnessName: { type: string }
        evidenceFileId: { $ref: "#/components/schemas/Uuid" }
        capturedAt: { type: string, format: date-time, readOnly: true }
        capturedBy: { type: string, format: uuid, readOnly: true }
        withdrawnAt: { type: [string, "null"], format: date-time, readOnly: true }
    ConsentWithdrawal:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [signed, read_aloud_witnessed, verbal_to_supervisor] }
        witnessName: { type: string }
        note: { type: string }
    BiometricEnrolmentCreate:
      type: object
      required: [consentId, modality, algorithm, algorithmVersion, templateCiphertext, keyId]
      properties:
        consentId: { $ref: "#/components/schemas/Uuid" }
        modality: { type: string, enum: [face, fingerprint] }
        algorithm: { type: string }
        algorithmVersion: { type: string }
        qualityScore: { $ref: "#/components/schemas/Decimal" }
        templateCiphertext:
          type: string
          contentEncoding: base64
          writeOnly: true
          description: Template or embedding encrypted to the biometrics service key. Never raw images.
        keyId: { type: string, description: Version of the biometrics service key used }
    BiometricEnrolment:
      type: object
      required: [id, labourerId, modality, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        labourerId: { $ref: "#/components/schemas/Uuid" }
        consentId: { $ref: "#/components/schemas/Uuid" }
        modality: { type: string, enum: [face, fingerprint] }
        status: { type: string, enum: [active, revoked, deleted] }
        deviceId: { $ref: "#/components/schemas/Uuid" }
        deleteAfter:
          $ref: "#/components/schemas/BusinessDate"
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    RosterTemplatePackage:
      type: object
      required: [siteId, packageId, expiresAt, wrappedKey, ciphertext]
      properties:
        siteId: { $ref: "#/components/schemas/Uuid" }
        packageId: { $ref: "#/components/schemas/Uuid" }
        generatedAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        enrolmentCount: { type: integer }
        algorithm: { type: string }
        algorithmVersion: { type: string }
        wrappedKey:
          type: string
          description: Package key encrypted to the requesting device's public key
        ciphertext: { type: string, contentEncoding: base64 }
    DataSubjectRequest:
      type: object
      required: [labourerId, kind, receivedOn]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        labourerId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [access, correction, deletion, objection] }
        channel: { type: string, enum: [in_person, phone, email, letter] }
        receivedOn: { $ref: "#/components/schemas/BusinessDate" }
        dueOn: { type: string, format: date, readOnly: true }
        status:
          type: string
          enum: [received, in_progress, completed, rejected]
          readOnly: true
        notes: { type: string }
    DpiaStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [not_started, approved, withdrawn] }
        approvedOn: { $ref: "#/components/schemas/BusinessDate" }
        documentId: { $ref: "#/components/schemas/Uuid" }
        odpcRegistrationNo: { type: string }
        reviewDue: { $ref: "#/components/schemas/BusinessDate" }
        updatedAt: { type: string, format: date-time, readOnly: true }
        updatedBy: { type: string, format: uuid, readOnly: true }
    # ----------------------------------------------------------- attendance
    CaptureMethod:
      type: string
      enum:
        - qr_card_photo
        - nfc_card_photo
        - face_kiosk
        - fingerprint_usb
        - terminal_push
        - manual_override
    AnomalyKind:
      type: string
      enum:
        - duplicate
        - outside_geofence
        - two_sites
        - impossible_travel
        - clock_drift
        - time_unverified
        - mock_location
        - unregistered_device
        - low_confidence
        - manual_override
        - missing_checkout
    AttendanceDevice:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind, captureMethods]
          properties:
            siteId: { type: string, format: uuid, readOnly: true }
            deviceId: { type: [string, "null"], format: uuid, readOnly: true }
            kind: { type: string, enum: [kiosk_tablet, phone, terminal] }
            label: { type: string }
            serialNo: { type: string }
            captureMethods:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/CaptureMethod" }
            status:
              type: string
              enum: [pending_activation, active, revoked]
              readOnly: true
            provisioningCode:
              type: string
              readOnly: true
              description: One-time code (also shown as a QR). Only in the create response.
            provisioningExpiresAt: { type: string, format: date-time, readOnly: true }
    AttendanceEvent:
      type: object
      required: [id, siteId, labourerId, kind, method, deviceTime]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        siteId: { $ref: "#/components/schemas/Uuid" }
        labourerId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [check_in, check_out] }
        method: { $ref: "#/components/schemas/CaptureMethod" }
        matchConfidence: { $ref: "#/components/schemas/Decimal" }
        livenessScore: { $ref: "#/components/schemas/Decimal" }
        attendanceDeviceId: { $ref: "#/components/schemas/Uuid" }
        deviceSeq: { type: integer, format: int64 }
        deviceTime: { $ref: "#/components/schemas/Timestamp" }
        elapsedRealtimeMs: { type: integer, format: int64 }
        bootId: { type: string }
        serverReceivedAt: { type: string, format: date-time, readOnly: true }
        location: { $ref: "#/components/schemas/GeoFix" }
        insideGeofence: { type: boolean, readOnly: true }
        photoId: { $ref: "#/components/schemas/Uuid" }
        confirmedByUserId: { $ref: "#/components/schemas/Uuid" }
        overrideReason: { type: string }
        supersedesEventId: { type: [string, "null"], format: uuid }
        openAnomalies:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/AnomalyKind" }
    AttendanceAnomaly:
      type: object
      required: [id, eventId, kind, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        eventId: { $ref: "#/components/schemas/Uuid" }
        labourerId: { $ref: "#/components/schemas/Uuid" }
        siteId: { $ref: "#/components/schemas/Uuid" }
        kind: { $ref: "#/components/schemas/AnomalyKind" }
        severity: { type: string, enum: [info, warning, critical] }
        details:
          type: object
          description: Rule-specific evidence, for example the drift in seconds
          additionalProperties: true
        status: { type: string, enum: [open, accepted, rejected] }
        reviewedBy: { type: [string, "null"], format: uuid }
        reviewNote: { type: string }
        reviewedAt: { type: [string, "null"], format: date-time }
    AnomalyReview:
      type: object
      required: [decision, note]
      properties:
        decision: { type: string, enum: [accepted, rejected] }
        note: { type: string, minLength: 3 }
    AttendanceOverride:
      type: object
      required: [labourerId, siteId, kind, occurredAt, reason]
      properties:
        labourerId: { $ref: "#/components/schemas/Uuid" }
        siteId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [check_in, check_out] }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        supersedesEventId: { $ref: "#/components/schemas/Uuid" }
        reason: { type: string, minLength: 5 }
        evidencePhotoId: { $ref: "#/components/schemas/Uuid" }
    MusterRoll:
      type: object
      required: [siteId, date, rows]
      properties:
        siteId: { $ref: "#/components/schemas/Uuid" }
        date: { $ref: "#/components/schemas/BusinessDate" }
        rosteredCount: { type: integer }
        presentCount: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              labourerId: { $ref: "#/components/schemas/Uuid" }
              workerNo: { type: string }
              fullName: { type: string }
              tradeKey: { type: string }
              gangId: { $ref: "#/components/schemas/Uuid" }
              firstIn: { type: [string, "null"], format: date-time }
              lastOut: { type: [string, "null"], format: date-time }
              hours: { $ref: "#/components/schemas/Decimal" }
              method: { $ref: "#/components/schemas/CaptureMethod" }
              insideGeofence: { type: boolean }
              openAnomalies:
                type: array
                items: { $ref: "#/components/schemas/AnomalyKind" }
    TimesheetLine:
      type: object
      properties:
        workDate: { $ref: "#/components/schemas/BusinessDate" }
        dayType: { type: string, enum: [weekday, rest_day, public_holiday] }
        dayStatus: { type: string, enum: [present, half_day, absent, leave] }
        normalHours: { $ref: "#/components/schemas/Decimal" }
        overtimeHours: { $ref: "#/components/schemas/Decimal" }
        lateMinutes: { type: integer }
        sourceEventIds:
          type: array
          items: { $ref: "#/components/schemas/Uuid" }
    Timesheet:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            labourerId: { $ref: "#/components/schemas/Uuid" }
            payPeriodId: { $ref: "#/components/schemas/Uuid" }
            status: { type: string, enum: [draft, approved, locked], readOnly: true }
            daysWorked: { $ref: "#/components/schemas/Decimal" }
            normalHours: { $ref: "#/components/schemas/Decimal" }
            overtimeHours: { $ref: "#/components/schemas/Decimal" }
            ruleSnapshot:
              type: object
              readOnly: true
              description: IDs of the overtime, holiday and timesheet rule versions used
              additionalProperties: true
            lines:
              type: array
              items: { $ref: "#/components/schemas/TimesheetLine" }
    # ----------------------------------------------------------------- sync
    SyncPushRequest:
      type: object
      required: [deviceId, records]
      properties:
        deviceId: { $ref: "#/components/schemas/Uuid" }
        batchSeq:
          type: integer
          format: int64
          description: Monotonic per device, to detect gaps
        clock:
          type: object
          description: Device clock at send time, compared with server time for drift
          properties:
            deviceTime: { $ref: "#/components/schemas/Timestamp" }
            elapsedRealtimeMs: { type: integer, format: int64 }
            bootId: { type: string }
        records:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/SyncRecord" }
    SyncRecord:
      type: object
      required: [id, entityType, op, deviceSeq, deviceTime, payload, signature]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        entityType:
          type: string
          enum:
            - attendance_event
            - diary_entry
            - grn
            - stock_issue
            - progress_measurement
            - photo
            - safety_incident
            - requisition
        op: { type: string, enum: [create, update] }
        baseVersion:
          type: integer
          description: Version the device edited, for drafts (last write wins, with audit)
        deviceSeq: { type: integer, format: int64 }
        deviceTime: { $ref: "#/components/schemas/Timestamp" }
        elapsedRealtimeMs: { type: integer, format: int64 }
        bootId: { type: string }
        location: { $ref: "#/components/schemas/GeoFix" }
        payload:
          type: object
          description: The entity, validated with the shared Zod schema for `entityType`
          additionalProperties: true
        signature:
          type: string
          description: Ed25519 signature (base64url) over the canonical JSON of the other fields
    SyncRecordResult:
      type: object
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [accepted, duplicate, rejected] }
        reason:
          type: string
          enum:
            - invalid_signature
            - unknown_device
            - revoked_device
            - locked_record
            - validation_failed
            - conflict_server_wins
        serverVersion: { type: integer }
        anomalies:
          type: array
          items: { $ref: "#/components/schemas/AnomalyKind" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ProblemError" }
    SyncPushResponse:
      type: object
      required: [serverTime, results]
      properties:
        serverTime: { $ref: "#/components/schemas/Timestamp" }
        results:
          type: array
          items: { $ref: "#/components/schemas/SyncRecordResult" }
    SyncChange:
      type: object
      required: [seq, entityType, entityId, op]
      properties:
        seq: { type: integer, format: int64 }
        entityType: { type: string, examples: [gang_assignment] }
        entityId: { $ref: "#/components/schemas/Uuid" }
        op: { type: string, enum: [upsert, delete] }
        data: { type: [object, "null"], additionalProperties: true }
        changedAt: { $ref: "#/components/schemas/Timestamp" }
    SyncPullResponse:
      type: object
      required: [serverTime, changes, nextCursor, hasMore]
      properties:
        serverTime: { $ref: "#/components/schemas/Timestamp" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/SyncChange" }
        nextCursor: { type: string }
        hasMore: { type: boolean }
    # -------------------------------------------------------------- payroll
    PayPeriod:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [frequency, startDate, endDate]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            frequency: { type: string, enum: [daily, weekly, fortnightly, monthly] }
            startDate: { $ref: "#/components/schemas/BusinessDate" }
            endDate: { $ref: "#/components/schemas/BusinessDate" }
            status: { type: string, enum: [open, closed], readOnly: true }
    PayrollTotals:
      type: object
      properties:
        gross: { $ref: "#/components/schemas/Money" }
        deductions: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        employerContributions: { $ref: "#/components/schemas/Money" }
        estimatedCharges: { $ref: "#/components/schemas/Money" }
    PayrollBatch:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            payPeriodId: { type: string, format: uuid, readOnly: true }
            number: { type: string, readOnly: true, examples: [PR-2026-W45] }
            status:
              type: string
              readOnly: true
              enum:
                - draft
                - prepared
                - reviewed
                - approved
                - disbursing
                - completed
                - partially_failed
                - cancelled
            labourerIds:
              type: array
              writeOnly: true
              description: Optional subset of workers. Defaults to every approved timesheet.
              items: { $ref: "#/components/schemas/Uuid" }
            notes: { type: string }
            totals: { $ref: "#/components/schemas/PayrollTotals" }
            lineCount: { type: integer, readOnly: true }
            preparedBy: { type: string, format: uuid, readOnly: true }
            reviewedBy: { type: [string, "null"], format: uuid, readOnly: true }
            approvedBy: { type: [string, "null"], format: uuid, readOnly: true }
            approvals:
              type: array
              readOnly: true
              items: { $ref: "#/components/schemas/ApprovalRecord" }
            ruleWarnings:
              type: array
              readOnly: true
              description: Rule versions used that are not yet approved (COMPLIANCE-REVIEW)
              items:
                type: object
                properties:
                  ruleVersionId: { $ref: "#/components/schemas/Uuid" }
                  key: { type: string }
                  complianceStatus: { $ref: "#/components/schemas/ComplianceStatus" }
    PayrollLineItem:
      type: object
      required: [kind, amount]
      properties:
        kind:
          type: string
          enum:
            - basic
            - overtime
            - piece_rate
            - allowance
            - paye
            - nssf_ee
            - shif
            - ahl_ee
            - advance_recovery
            - other
            - nssf_er
            - ahl_er
            - nita
        amount: { $ref: "#/components/schemas/Money" }
        ruleVersionId: { type: [string, "null"], format: uuid }
        basis:
          type: object
          description: Inputs used, for example days x rate or the band applied
          additionalProperties: true
    PayrollLine:
      type: object
      required: [id, labourerId, gross, net, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        labourerId: { $ref: "#/components/schemas/Uuid" }
        labourerName: { type: string }
        daysWorked: { $ref: "#/components/schemas/Decimal" }
        normalHours: { $ref: "#/components/schemas/Decimal" }
        overtimeHours: { $ref: "#/components/schemas/Decimal" }
        gross: { $ref: "#/components/schemas/Money" }
        deductions: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        payoutMethod: { type: string, enum: [mpesa, bank, cash] }
        status: { type: string, enum: [pending, sent, confirmed, failed, reversed] }
        paymentId: { type: [string, "null"], format: uuid }
        mpesaReceipt: { type: [string, "null"] }
        nameCheck: { type: string, enum: [match, mismatch, n_a] }
        items:
          type: array
          items: { $ref: "#/components/schemas/PayrollLineItem" }
    Payslip:
      type: object
      required: [payrollLineId, locale, smsText]
      properties:
        payrollLineId: { $ref: "#/components/schemas/Uuid" }
        labourerName: { type: string }
        periodStart: { $ref: "#/components/schemas/BusinessDate" }
        periodEnd: { $ref: "#/components/schemas/BusinessDate" }
        daysWorked: { $ref: "#/components/schemas/Decimal" }
        rate: { $ref: "#/components/schemas/Money" }
        gross: { $ref: "#/components/schemas/Money" }
        deductions:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        mpesaReceipt: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        smsText:
          type: string
          examples:
            - "PM-Buddy: Siku 6 x KES 900. Jumla KES 5,400. Makato KES 297. Umelipwa KES 5,103."
        smsSegments: { type: integer }
    StatutoryExportRequest:
      type: object
      required: [kind, month]
      properties:
        kind: { type: string, enum: [paye, nssf, shif, ahl, nita] }
        month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          examples: ["2026-10"]
        projectId: { $ref: "#/components/schemas/Uuid" }
    RecoveryInstalment:
      type: object
      required: [dueOn, amount]
      properties:
        dueOn:
          $ref: "#/components/schemas/BusinessDate"
        amount: { $ref: "#/components/schemas/Money" }
    RecoverySchedule:
      type: object
      required: [instalments]
      properties:
        instalments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RecoveryInstalment" }
    Advance:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [labourerId, projectId, amount, payoutMethod, recoverySchedule]
          properties:
            labourerId: { $ref: "#/components/schemas/Uuid" }
            projectId: { $ref: "#/components/schemas/Uuid" }
            amount: { $ref: "#/components/schemas/Money" }
            payoutMethod: { type: string, enum: [mpesa, cash] }
            reason: { type: string }
            issuedOn: { type: [string, "null"], format: date, readOnly: true }
            outstanding: { $ref: "#/components/schemas/Money" }
            status:
              type: string
              enum: [pending_payment, active, recovered, cancelled]
              readOnly: true
            paymentId: { type: [string, "null"], format: uuid, readOnly: true }
            recoverySchedule:
              type: array
              items: { $ref: "#/components/schemas/RecoveryInstalment" }
            recoveries:
              type: array
              readOnly: true
              items:
                type: object
                properties:
                  payrollLineId: { $ref: "#/components/schemas/Uuid" }
                  amount: { $ref: "#/components/schemas/Money" }
                  recoveredOn: { $ref: "#/components/schemas/BusinessDate" }
    PieceRateJob:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [bqItemId, description, unitCode, rate]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            bqItemId: { $ref: "#/components/schemas/Uuid" }
            labourerId: { type: [string, "null"], format: uuid }
            gangId: { type: [string, "null"], format: uuid }
            description: { type: string, examples: [Internal plaster per m2] }
            unitCode: { type: string, examples: [m2] }
            rate: { $ref: "#/components/schemas/Money" }
            measuredQuantity: { $ref: "#/components/schemas/Decimal" }
            amount: { $ref: "#/components/schemas/Money" }
            status:
              type: string
              enum: [open, measured, approved, paid]
              readOnly: true
            payrollLineId: { type: [string, "null"], format: uuid, readOnly: true }
    PieceRateApproval:
      type: object
      required: [measuredQuantity]
      properties:
        measuredQuantity: { $ref: "#/components/schemas/Decimal" }
        measurementId: { $ref: "#/components/schemas/Uuid" }
        comment: { type: string }
    # ------------------------------------------------------------- payments
    PaymentPurpose:
      type: string
      enum:
        - payroll
        - supplier
        - advance
        - piece_rate
        - client_instalment
        - petty_cash_topup
        - refund
    PaymentMethod:
      type: string
      enum: [mpesa_b2c, mpesa_b2b, mpesa_stk, mpesa_c2b, bank, cash]
    PaymentStatus:
      type: string
      enum: [pending, sent, confirmed, failed, reversed]
      description: >-
        `confirmed` is set only from a matched result callback or a Transaction Status result,
        never from the initial API response or the client side.
    DarajaCredentials:
      type: object
      writeOnly: true
      description: Sent once, stored in the secrets manager, never returned or logged
      properties:
        consumerKey: { type: string }
        consumerSecret: { type: string }
        passkey: { type: string, description: STK Push passkey }
        initiatorName: { type: string }
        initiatorPassword:
          type: string
          description: Encrypted with Safaricom's certificate at call time (SecurityCredential)
    PaymentChannel:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [environment, purpose, shortcode]
          properties:
            provider: { type: string, enum: [daraja], readOnly: true }
            environment: { type: string, enum: [sandbox, production] }
            purpose: { type: string, enum: [stk, c2b, b2c, b2b] }
            shortcode: { type: string, pattern: "^\\d{5,7}$" }
            shortcodeKind: { type: string, enum: [paybill, till] }
            label: { type: string }
            credentials: { $ref: "#/components/schemas/DarajaCredentials" }
            credentialsStatus:
              type: string
              enum: [configured, missing, expired]
              readOnly: true
            status: { type: string, enum: [pending, active, disabled], readOnly: true }
            lastBalance: { $ref: "#/components/schemas/Money" }
            lastBalanceAt: { type: [string, "null"], format: date-time, readOnly: true }
    PaymentLinks:
      type: object
      description: The record a payment settles
      properties:
        payrollLineId: { $ref: "#/components/schemas/Uuid" }
        supplierInvoiceId: { $ref: "#/components/schemas/Uuid" }
        certificateId: { $ref: "#/components/schemas/Uuid" }
        advanceId: { $ref: "#/components/schemas/Uuid" }
        pettyCashFloatId: { $ref: "#/components/schemas/Uuid" }
    Payment:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          properties:
            projectId: { $ref: "#/components/schemas/Uuid" }
            direction: { type: string, enum: [in, out] }
            purpose: { $ref: "#/components/schemas/PaymentPurpose" }
            method: { $ref: "#/components/schemas/PaymentMethod" }
            payeeType: { type: string, enum: [labourer, supplier, client, custodian, other] }
            payeeId: { $ref: "#/components/schemas/Uuid" }
            payeeName: { type: string, readOnly: true }
            amount: { $ref: "#/components/schemas/Money" }
            charges: { $ref: "#/components/schemas/Money" }
            status: { $ref: "#/components/schemas/PaymentStatus" }
            approvalStatus:
              type: string
              enum: [not_required, pending, approved, rejected]
              readOnly: true
            providerReceipt:
              type: [string, "null"]
              readOnly: true
              description: M-Pesa receipt number (unique)
              examples: [SKB1X2Y3Z4]
            nameCheck: { type: string, enum: [match, mismatch, n_a], readOnly: true }
            evidenceFileId: { $ref: "#/components/schemas/Uuid" }
            reason: { type: string }
            paidAt: { type: [string, "null"], format: date-time, readOnly: true }
            links: { $ref: "#/components/schemas/PaymentLinks" }
    StkPushRequest:
      type: object
      required: [projectId, phone, amount]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
        certificateId: { $ref: "#/components/schemas/Uuid" }
        phone: { $ref: "#/components/schemas/Phone" }
        amount: { $ref: "#/components/schemas/Money" }
        accountReference:
          type: string
          maxLength: 12
          description: Defaults to the project code
        description: { type: string, maxLength: 13 }
    ClientStkPushRequest:
      type: object
      required: [certificateId, phone, amount]
      properties:
        certificateId: { $ref: "#/components/schemas/Uuid" }
        phone: { $ref: "#/components/schemas/Phone" }
        amount: { $ref: "#/components/schemas/Money" }
    Disbursement:
      type: object
      required: [payrollBatchId, status]
      properties:
        payrollBatchId: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [float_check, queued] }
        floatCheckRequestId: { $ref: "#/components/schemas/Uuid" }
        linesQueued: { type: integer }
        linesExcluded:
          type: integer
          description: Cash and bank lines, recorded separately
        totalNet: { $ref: "#/components/schemas/Money" }
        estimatedCharges: { $ref: "#/components/schemas/Money" }
    SupplierPaymentRequest:
      type: object
      required: [supplierInvoiceId, amount]
      properties:
        supplierInvoiceId: { $ref: "#/components/schemas/Uuid" }
        amount: { $ref: "#/components/schemas/Money" }
        channelId: { $ref: "#/components/schemas/Uuid" }
        remarks: { type: string, maxLength: 100 }
    ManualPaymentRequest:
      type: object
      required: [projectId, direction, purpose, method, amount, paidAt]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
        direction: { type: string, enum: [in, out] }
        purpose: { $ref: "#/components/schemas/PaymentPurpose" }
        method: { type: string, enum: [bank, cash] }
        payeeType: { type: string, enum: [labourer, supplier, client, custodian, other] }
        payeeId: { $ref: "#/components/schemas/Uuid" }
        amount: { $ref: "#/components/schemas/Money" }
        paidAt: { $ref: "#/components/schemas/Timestamp" }
        bankReference: { type: string }
        evidenceFileId: { $ref: "#/components/schemas/Uuid" }
        reason: { type: string }
        links: { $ref: "#/components/schemas/PaymentLinks" }
      if:
        properties:
          method: { const: cash }
      then:
        required: [evidenceFileId, reason]
        properties:
          evidenceFileId: { $ref: "#/components/schemas/Uuid" }
          reason: { type: string, minLength: 5 }
    PaymentCallback:
      type: object
      required: [id, kind, receivedAt, matchStatus]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        channelId: { $ref: "#/components/schemas/Uuid" }
        kind:
          type: string
          enum:
            - stk
            - c2b_validation
            - c2b_confirmation
            - b2c_result
            - b2b_result
            - status_result
            - balance_result
            - reversal_result
            - timeout
        receivedAt: { $ref: "#/components/schemas/Timestamp" }
        sourceIp: { type: string }
        matchStatus: { type: string, enum: [matched, unmatched, duplicate, invalid] }
        providerRequestId: { type: [string, "null"], format: uuid }
        processedAt: { type: [string, "null"], format: date-time }
        rawRedacted:
          type: object
          description: Raw payload with secrets and phone numbers redacted
          additionalProperties: true
    PaymentProviderRequest:
      type: object
      required: [id, operation, state]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        paymentId: { type: [string, "null"], format: uuid }
        channelId: { $ref: "#/components/schemas/Uuid" }
        operation:
          type: string
          enum: [stk_push, stk_query, b2c, b2b, tx_status, balance, reversal, c2b_register]
        state:
          type: string
          enum: [created, queued, submitted, accepted, succeeded, failed, timed_out, reversed]
        attempt: { type: integer }
        originatorConversationId: { type: string }
        conversationId: { type: string }
        checkoutRequestId: { type: string }
        merchantRequestId: { type: string }
        resultCode: { type: [string, "null"] }
        resultDesc: { type: [string, "null"] }
        requestRedacted: { type: object, additionalProperties: true }
        responseRedacted: { type: object, additionalProperties: true }
        timeoutAt: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        callbacks:
          type: array
          items: { $ref: "#/components/schemas/PaymentCallback" }
    # ------------------------------------------------------- reconciliation
    StatementUpload:
      type: object
      required: [file, periodStart, periodEnd]
      properties:
        file: { type: string, contentMediaType: text/csv }
        periodStart: { $ref: "#/components/schemas/BusinessDate" }
        periodEnd: { $ref: "#/components/schemas/BusinessDate" }
    Reconciliation:
      type: object
      required: [id, channelId, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        channelId: { $ref: "#/components/schemas/Uuid" }
        periodStart: { $ref: "#/components/schemas/BusinessDate" }
        periodEnd: { $ref: "#/components/schemas/BusinessDate" }
        source: { type: string, enum: [statement_upload, api, scheduled] }
        status: { type: string, enum: [processing, completed, failed] }
        fileId: { type: [string, "null"], format: uuid }
        matchedCount: { type: integer }
        unmatchedCount: { type: integer }
        disputedCount: { type: integer }
        chargesBooked: { $ref: "#/components/schemas/Money" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    ReconciliationItem:
      type: object
      required: [id, statementReceipt, statementAmount, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        statementReceipt: { type: string }
        statementAmount: { $ref: "#/components/schemas/Money" }
        statementTime: { $ref: "#/components/schemas/Timestamp" }
        counterparty: { $ref: "#/components/schemas/MaskedValue" }
        paymentId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [matched, unmatched, disputed, resolved] }
        outcome: { type: [string, "null"] }
        note: { type: string }
    ReconciliationResolution:
      type: object
      required: [outcome, note]
      properties:
        outcome:
          type: string
          enum: [linked_to_payment, written_off, refund_raised, dispute_confirmed, provider_error]
        paymentId:
          $ref: "#/components/schemas/Uuid"
        note: { type: string, minLength: 5 }
    # ---------------------------------------------------------- procurement
    Material:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [code, name, category, baseUnitCode]
          properties:
            code: { type: string, examples: [CEM-425-50] }
            name: { type: string, examples: [Cement 42.5N 50 kg bag] }
            category:
              type: string
              enum: [cement, aggregate, steel, timber, blocks, roofing, fuel, other]
            baseUnitCode: { type: string, examples: [bag] }
            spec: { type: string, examples: [Y12] }
            kgPerUnit: { $ref: "#/components/schemas/Decimal" }
            reorderLevel: { $ref: "#/components/schemas/Decimal" }
    UnitCatalogue:
      type: object
      required: [units, conversions]
      properties:
        units:
          type: array
          items:
            type: object
            required: [code, nameEn, nameSw, dimension]
            properties:
              code: { type: string, examples: [m3] }
              nameEn: { type: string }
              nameSw: { type: string }
              dimension: { type: string, enum: [mass, volume, area, length, count, lump] }
        conversions:
          type: array
          items:
            type: object
            required: [fromUnit, toUnit, factor]
            properties:
              fromUnit: { type: string, examples: [trip] }
              toUnit: { type: string, examples: [t] }
              materialId: { type: [string, "null"], format: uuid }
              factor: { $ref: "#/components/schemas/Decimal" }
              effectiveFrom: { $ref: "#/components/schemas/BusinessDate" }
    BankDetails:
      type: object
      writeOnly: true
      properties:
        bankName: { type: string }
        branch: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
    Supplier:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [name]
          properties:
            name: { type: string, examples: [Thika Road Hardware Ltd] }
            kraPin: { type: string, writeOnly: true, pattern: "^[AP]\\d{9}[A-Z]$" }
            kraPinMasked: { $ref: "#/components/schemas/MaskedValue" }
            etimsStatus: { type: string, enum: [registered, unknown, not_registered] }
            mpesaKind: { type: string, enum: [paybill, till, none] }
            mpesaShortcode: { type: string, pattern: "^\\d{5,7}$" }
            mpesaAccountRef: { type: string, maxLength: 12 }
            bankDetails: { $ref: "#/components/schemas/BankDetails" }
            bankAccountMasked: { $ref: "#/components/schemas/MaskedValue" }
            creditTermsDays: { type: integer, minimum: 0 }
            rating: { $ref: "#/components/schemas/Decimal" }
            balance: { $ref: "#/components/schemas/Money" }
    MaterialPrice:
      type: object
      required: [materialId, supplierId, price, observedOn, source]
      properties:
        materialId: { $ref: "#/components/schemas/Uuid" }
        supplierId: { $ref: "#/components/schemas/Uuid" }
        supplierName: { type: string }
        unitCode: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        observedOn: { $ref: "#/components/schemas/BusinessDate" }
        source: { type: string, enum: [quote, lpo, invoice] }
        changePct: { $ref: "#/components/schemas/Decimal" }
    RequisitionLine:
      type: object
      required: [materialId, quantity, unitCode]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        materialId: { $ref: "#/components/schemas/Uuid" }
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string }
        overBudget: { type: boolean, readOnly: true }
    Requisition:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [neededBy, lines]
          properties:
            siteId: { type: string, format: uuid, readOnly: true }
            number: { type: string, readOnly: true, examples: [REQ-0107] }
            requestedBy: { type: string, format: uuid, readOnly: true }
            neededBy: { $ref: "#/components/schemas/BusinessDate" }
            status:
              type: string
              enum: [draft, submitted, approved, rejected, rfq, ordered, closed]
              readOnly: true
            lines:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/RequisitionLine" }
    Rfq:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        requisitionId: { type: string, format: uuid, readOnly: true }
        number: { type: string, readOnly: true }
        minQuotes:
          type: integer
          readOnly: true
          description: From config `procurement.min_quotes`
        supplierIds:
          type: array
          description: Suppliers invited to quote
          items: { $ref: "#/components/schemas/Uuid" }
        dueBy: { $ref: "#/components/schemas/BusinessDate" }
        status: { type: string, enum: [open, closed, awarded], readOnly: true }
    Quotation:
      type: object
      required: [supplierId, lines]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        rfqId: { type: string, format: uuid, readOnly: true }
        supplierId: { $ref: "#/components/schemas/Uuid" }
        validUntil: { $ref: "#/components/schemas/BusinessDate" }
        fileId: { $ref: "#/components/schemas/Uuid" }
        total: { $ref: "#/components/schemas/Money" }
        selected: { type: boolean, readOnly: true }
        selectionReason: { type: string, readOnly: true }
        lines:
          type: array
          items:
            type: object
            required: [requisitionLineId, unitPrice]
            properties:
              requisitionLineId: { $ref: "#/components/schemas/Uuid" }
              unitPrice: { $ref: "#/components/schemas/Money" }
              quantity: { $ref: "#/components/schemas/Decimal" }
    QuotationComparison:
      type: object
      required: [rfqId, quotationCount, lines]
      properties:
        rfqId: { $ref: "#/components/schemas/Uuid" }
        minQuotes: { type: integer }
        quotationCount: { type: integer }
        belowMinQuotes: { type: boolean }
        lowestQuotationId: { $ref: "#/components/schemas/Uuid" }
        totals:
          type: array
          items:
            type: object
            properties:
              quotationId: { $ref: "#/components/schemas/Uuid" }
              supplierName: { type: string }
              total: { $ref: "#/components/schemas/Money" }
        lines:
          type: array
          items:
            type: object
            properties:
              requisitionLineId: { $ref: "#/components/schemas/Uuid" }
              materialName: { type: string }
              quantity: { $ref: "#/components/schemas/Decimal" }
              offers:
                type: array
                items:
                  type: object
                  properties:
                    quotationId: { $ref: "#/components/schemas/Uuid" }
                    unitPrice: { $ref: "#/components/schemas/Money" }
                    changeVsLastPricePct: { $ref: "#/components/schemas/Decimal" }
    QuotationSelection:
      type: object
      required: [quotationId]
      properties:
        quotationId: { $ref: "#/components/schemas/Uuid" }
        reason:
          type: string
          description: Required when not the lowest, or when below the minimum number of quotes
    LpoLine:
      type: object
      required: [materialId, quantity, unitCode, unitPrice]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        materialId: { $ref: "#/components/schemas/Uuid" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string }
        unitPrice: { $ref: "#/components/schemas/Money" }
        receivedQuantity: { $ref: "#/components/schemas/Decimal" }
    Lpo:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [projectId, supplierId, lines]
          properties:
            projectId: { $ref: "#/components/schemas/Uuid" }
            supplierId: { $ref: "#/components/schemas/Uuid" }
            quotationId: { type: [string, "null"], format: uuid }
            deliverToSiteId: { $ref: "#/components/schemas/Uuid" }
            number: { type: string, readOnly: true, examples: [LPO-0042] }
            total: { $ref: "#/components/schemas/Money" }
            vat: { $ref: "#/components/schemas/Money" }
            status:
              type: string
              readOnly: true
              enum: [draft, approved, issued, part_delivered, delivered, closed, cancelled]
            lines:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/LpoLine" }
    GrnLine:
      type: object
      required: [lpoLineId, quantityReceived]
      properties:
        lpoLineId: { $ref: "#/components/schemas/Uuid" }
        quantityReceived: { $ref: "#/components/schemas/Decimal" }
        quantityRejected: { $ref: "#/components/schemas/Decimal" }
        rejectionReason: { type: string }
    Grn:
      type: object
      required: [id, siteId, receivedAt, lines]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        lpoId: { type: string, format: uuid, readOnly: true }
        siteId: { $ref: "#/components/schemas/Uuid" }
        number: { type: string, readOnly: true, examples: [GRN-0311] }
        receivedAt: { $ref: "#/components/schemas/Timestamp" }
        receivedBy: { type: string, format: uuid, readOnly: true }
        vehicleReg: { type: string, examples: [KDA 123A] }
        deliveryNoteNo: { type: string }
        location: { $ref: "#/components/schemas/GeoFix" }
        insideGeofence: { type: boolean, readOnly: true }
        deviceId: { type: [string, "null"], format: uuid, readOnly: true }
        photos:
          type: array
          items:
            type: object
            required: [photoId, kind]
            properties:
              photoId: { $ref: "#/components/schemas/Uuid" }
              kind: { type: string, enum: [delivery_note, goods, vehicle] }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GrnLine" }
    SupplierInvoice:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [lpoId, number, invoiceDate, total]
          properties:
            supplierId: { type: string, format: uuid, readOnly: true }
            lpoId: { $ref: "#/components/schemas/Uuid" }
            number: { type: string }
            invoiceDate: { $ref: "#/components/schemas/BusinessDate" }
            etimsInvoiceNo:
              type: [string, "null"]
              description: KRA eTIMS invoice number. Missing numbers are flagged.
            etimsValidated: { type: boolean, readOnly: true }
            total: { $ref: "#/components/schemas/Money" }
            vat: { $ref: "#/components/schemas/Money" }
            fileId: { $ref: "#/components/schemas/Uuid" }
            matchStatus:
              type: string
              enum: [pending, matched, mismatch, overridden]
              readOnly: true
            status:
              type: string
              enum: [received, matched, blocked, approved, paid]
              readOnly: true
    ThreeWayMatch:
      type: object
      required: [invoiceId, status]
      properties:
        invoiceId: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [matched, mismatch, overridden] }
        differences:
          type: array
          items:
            type: object
            properties:
              lpoLineId: { $ref: "#/components/schemas/Uuid" }
              kind: { type: string, enum: [quantity, price, missing_grn, extra_line] }
              lpoValue: { type: string }
              grnValue: { type: string }
              invoiceValue: { type: string }
        tolerance:
          type: object
          description: Configured tolerances that were applied
          additionalProperties: true
        resolvedBy: { type: [string, "null"], format: uuid }
        resolutionNote: { type: [string, "null"] }
    # --------------------------------------------------------------- stores
    StockMovementKind:
      type: string
      enum: [receipt, issue, return, transfer_in, transfer_out, wastage, adjustment]
    Store:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [name]
          properties:
            siteId: { type: string, format: uuid, readOnly: true }
            name: { type: string, examples: [Main store] }
            storekeeperUserId: { $ref: "#/components/schemas/Uuid" }
    StockLedgerEntry:
      type: object
      required: [id, storeId, materialId, occurredAt, kind, quantity]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        storeId: { $ref: "#/components/schemas/Uuid" }
        materialId: { $ref: "#/components/schemas/Uuid" }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        kind: { $ref: "#/components/schemas/StockMovementKind" }
        quantity:
          $ref: "#/components/schemas/Decimal"
        unitCost: { $ref: "#/components/schemas/Money" }
        balanceAfter: { $ref: "#/components/schemas/Decimal" }
        refType: { type: string, enum: [grn, issue, return, transfer, stocktake, fuel] }
        refId: { $ref: "#/components/schemas/Uuid" }
        bqItemId: { type: [string, "null"], format: uuid }
        gangId: { type: [string, "null"], format: uuid }
        deviceId: { type: [string, "null"], format: uuid }
    StockIssue:
      type: object
      required: [id, kind, materialId, quantity, unitCode]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        kind: { type: string, enum: [issue, wastage] }
        materialId: { $ref: "#/components/schemas/Uuid" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string }
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        gangId: { $ref: "#/components/schemas/Uuid" }
        issuedTo: { type: string }
        notes: { type: string }
    StockReturn:
      type: object
      required: [materialId, quantity, unitCode]
      properties:
        materialId: { $ref: "#/components/schemas/Uuid" }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string }
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        gangId: { $ref: "#/components/schemas/Uuid" }
        notes: { type: string }
    StockTransfer:
      type: object
      required: [fromStoreId, toStoreId, lines]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        fromStoreId: { $ref: "#/components/schemas/Uuid" }
        toStoreId: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [dispatched, received, disputed], readOnly: true }
        dispatchedAt: { type: string, format: date-time, readOnly: true }
        receivedAt: { type: [string, "null"], format: date-time, readOnly: true }
        vehicleReg: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [materialId, quantity]
            properties:
              materialId: { $ref: "#/components/schemas/Uuid" }
              quantity: { $ref: "#/components/schemas/Decimal" }
              receivedQuantity: { $ref: "#/components/schemas/Decimal" }
    StockTransferReceipt:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [materialId, receivedQuantity]
            properties:
              materialId: { $ref: "#/components/schemas/Uuid" }
              receivedQuantity: { $ref: "#/components/schemas/Decimal" }
        note: { type: string }
    StockTake:
      type: object
      required: [countedOn, lines]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        storeId: { type: string, format: uuid, readOnly: true }
        countedOn: { $ref: "#/components/schemas/BusinessDate" }
        status: { type: string, enum: [draft, submitted, approved], readOnly: true }
        approvedBy: { type: [string, "null"], format: uuid, readOnly: true }
        lines:
          type: array
          items:
            type: object
            required: [materialId, countedQuantity]
            properties:
              materialId: { $ref: "#/components/schemas/Uuid" }
              systemQuantity: { $ref: "#/components/schemas/Decimal" }
              countedQuantity: { $ref: "#/components/schemas/Decimal" }
              variance: { $ref: "#/components/schemas/Decimal" }
    MaterialVarianceReport:
      type: object
      required: [rows]
      properties:
        thresholdPct: { $ref: "#/components/schemas/Decimal" }
        rows:
          type: array
          items:
            type: object
            properties:
              materialId: { $ref: "#/components/schemas/Uuid" }
              materialName: { type: string }
              bqItemId: { type: [string, "null"], format: uuid }
              unitCode: { type: string }
              theoreticalQuantity: { $ref: "#/components/schemas/Decimal" }
              issuedQuantity: { $ref: "#/components/schemas/Decimal" }
              variancePct: { $ref: "#/components/schemas/Decimal" }
              flagged: { type: boolean }
    # -------------------------------------------------------------- finance
    CostCategory:
      type: string
      enum:
        - materials
        - labour
        - plant
        - subcontract
        - preliminaries
        - fees
        - permits
        - transport
        - petty_cash
        - mpesa_charges
    CostEntry:
      type: object
      required: [occurredOn, category, amount]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        projectId: { type: string, format: uuid, readOnly: true }
        siteId: { $ref: "#/components/schemas/Uuid" }
        occurredOn: { $ref: "#/components/schemas/BusinessDate" }
        category: { $ref: "#/components/schemas/CostCategory" }
        costCodeId: { $ref: "#/components/schemas/Uuid" }
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        supplierId: { $ref: "#/components/schemas/Uuid" }
        labourerId: { $ref: "#/components/schemas/Uuid" }
        amount: { $ref: "#/components/schemas/Money" }
        sourceType:
          type: string
          enum: [payroll_line, supplier_invoice, expense, plant_usage, mpesa_charge, adjustment]
          readOnly: true
        sourceId: { type: [string, "null"], format: uuid, readOnly: true }
        paymentId: { type: [string, "null"], format: uuid }
        reversesEntryId: { type: [string, "null"], format: uuid }
        reason: { type: string, description: Required for manual adjustments }
    Budget:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [lines]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            budgetVersion: { type: integer, readOnly: true }
            status: { type: string, enum: [draft, approved], readOnly: true }
            lines:
              type: array
              items:
                type: object
                required: [amount]
                properties:
                  bqBillId: { $ref: "#/components/schemas/Uuid" }
                  bqItemId: { $ref: "#/components/schemas/Uuid" }
                  costCodeId: { $ref: "#/components/schemas/Uuid" }
                  amount: { $ref: "#/components/schemas/Money" }
    Commitment:
      type: object
      required: [sourceType, sourceId, amount, remaining]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        sourceType: { type: string, enum: [lpo, subcontract] }
        sourceId: { $ref: "#/components/schemas/Uuid" }
        reference: { type: string, examples: [LPO-0042] }
        amount: { $ref: "#/components/schemas/Money" }
        remaining: { $ref: "#/components/schemas/Money" }
    PettyCashFloat:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [siteId, custodianUserId, limit]
          properties:
            siteId: { $ref: "#/components/schemas/Uuid" }
            custodianUserId: { $ref: "#/components/schemas/Uuid" }
            limit: { $ref: "#/components/schemas/Money" }
            balance: { $ref: "#/components/schemas/Money" }
    Expense:
      type: object
      required: [spentOn, category, amount, description, receiptFileId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        floatId: { type: string, format: uuid, readOnly: true }
        projectId: { $ref: "#/components/schemas/Uuid" }
        spentOn: { $ref: "#/components/schemas/BusinessDate" }
        category: { $ref: "#/components/schemas/CostCategory" }
        amount: { $ref: "#/components/schemas/Money" }
        description: { type: string }
        receiptFileId: { $ref: "#/components/schemas/Uuid" }
        mpesaRef: { type: string, examples: [SKB1X2Y3Z4] }
        parsedFromSms: { type: boolean }
        status: { type: string, enum: [submitted, approved, rejected], readOnly: true }
        duplicateSuspected: { type: boolean, readOnly: true }
    PettyCashTopUp:
      type: object
      required: [amount, method]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        amount: { $ref: "#/components/schemas/Money" }
        method: { type: string, enum: [mpesa_b2c, bank, cash] }
        paymentId: { type: string, format: uuid, readOnly: true }
    PettyCashCount:
      type: object
      required: [countedOn, counted]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        countedOn: { $ref: "#/components/schemas/BusinessDate" }
        counted: { $ref: "#/components/schemas/Money" }
        expected: { $ref: "#/components/schemas/Money" }
        variance: { $ref: "#/components/schemas/Money" }
        note: { type: string }
    MpesaSmsParseRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 1000
          examples:
            - "SKB1X2Y3Z4 Confirmed. Ksh2,350.00 sent to JOHN KAMAU 0712345678 on 7/11/26 at 2:15 PM."
    MpesaSmsParseResult:
      type: object
      required: [recognised]
      properties:
        recognised: { type: boolean }
        kind: { type: string, enum: [sent, paid_till, paid_paybill, received, withdrawn] }
        reference: { type: string, examples: [SKB1X2Y3Z4] }
        amount: { $ref: "#/components/schemas/Money" }
        counterparty: { type: string }
        counterpartyPhone: { $ref: "#/components/schemas/Phone" }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        confidence:
          type: object
          description: Confidence per field, from 0 to 1
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
    BudgetVsActual:
      type: object
      required: [groupBy, rows]
      properties:
        groupBy: { type: string, enum: [bill, bq_item, category, cost_code] }
        asOf: { $ref: "#/components/schemas/BusinessDate" }
        rows:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              budget: { $ref: "#/components/schemas/Money" }
              actual: { $ref: "#/components/schemas/Money" }
              committed: { $ref: "#/components/schemas/Money" }
              costToComplete: { $ref: "#/components/schemas/Money" }
              forecastAtCompletion: { $ref: "#/components/schemas/Money" }
              variance: { $ref: "#/components/schemas/Money" }
    CashFlowForecast:
      type: object
      required: [interval, periods]
      properties:
        interval: { type: string, enum: [week, month] }
        openingBalance: { $ref: "#/components/schemas/Money" }
        periods:
          type: array
          items:
            type: object
            properties:
              periodStart: { $ref: "#/components/schemas/BusinessDate" }
              payroll: { $ref: "#/components/schemas/Money" }
              supplierPayments: { $ref: "#/components/schemas/Money" }
              clientReceipts: { $ref: "#/components/schemas/Money" }
              net: { $ref: "#/components/schemas/Money" }
              closingBalance: { $ref: "#/components/schemas/Money" }
    # ----------------------------------------------------- site diary, photos
    DiaryLine:
      type: object
      required: [kind, description]
      properties:
        kind:
          type: string
          enum:
            - work_done
            - material_received
            - material_used
            - plant
            - visitor
            - instruction
            - delay
            - incident
        refType: { type: string, examples: [bq_item] }
        refId: { $ref: "#/components/schemas/Uuid" }
        description: { type: string }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string }
    SiteDiary:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [diaryDate]
          properties:
            siteId: { type: string, format: uuid, readOnly: true }
            diaryDate: { $ref: "#/components/schemas/BusinessDate" }
            weather:
              type: object
              properties:
                morning: { type: string, enum: [sunny, cloudy, light_rain, heavy_rain] }
                afternoon: { type: string, enum: [sunny, cloudy, light_rain, heavy_rain] }
                rainfallMm: { $ref: "#/components/schemas/Decimal" }
            workforceByTrade:
              type: array
              readOnly: true
              description: Filled from attendance
              items:
                type: object
                properties:
                  tradeKey: { type: string }
                  count: { type: integer }
            status:
              type: string
              enum: [draft, submitted, approved, locked]
              readOnly: true
            submittedBy: { type: [string, "null"], format: uuid, readOnly: true }
            approvedBy: { type: [string, "null"], format: uuid, readOnly: true }
            lines:
              type: array
              items: { $ref: "#/components/schemas/DiaryLine" }
    DiarySignature:
      type: object
      properties:
        signatureFileId:
          $ref: "#/components/schemas/Uuid"
        comment: { type: string }
    Photo:
      type: object
      required: [id, fileId, siteId]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        fileId: { $ref: "#/components/schemas/Uuid" }
        siteId: { $ref: "#/components/schemas/Uuid" }
        bqItemId: { type: [string, "null"], format: uuid }
        locationLabel: { type: string, examples: [Block A 2nd floor] }
        deviceTime: { $ref: "#/components/schemas/Timestamp" }
        location: { $ref: "#/components/schemas/GeoFix" }
        exifTime: { type: [string, "null"], format: date-time, readOnly: true }
        serverReceivedAt: { type: string, format: date-time, readOnly: true }
        insideGeofence: { type: boolean, readOnly: true }
        verified:
          type: boolean
          readOnly: true
          description: Server-verified badge (location, time and hash checks all passed)
        verificationReasons:
          type: array
          readOnly: true
          items: { type: string, examples: [exif_gps_outside_geofence] }
        sha256: { type: string, readOnly: true }
        thumbnailUrl: { type: string, format: uri, readOnly: true }
        releasedToClient: { type: boolean }
    PhotoTimeline:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              date: { $ref: "#/components/schemas/BusinessDate" }
              locationLabel: { type: string }
              bqItemId: { type: [string, "null"], format: uuid }
              photos:
                type: array
                items: { $ref: "#/components/schemas/Photo" }
    # ------------------------------------------------------ quality, safety
    Inspection:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind, inspectedOn, result]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            templateId: { $ref: "#/components/schemas/Uuid" }
            kind: { type: string, enum: [internal, county, consultant] }
            inspectedOn: { $ref: "#/components/schemas/BusinessDate" }
            result: { type: string, enum: [pass, fail, conditional] }
            items:
              type: array
              items:
                type: object
                required: [itemKey, result]
                properties:
                  itemKey: { type: string }
                  result: { type: string, enum: [pass, fail, n_a] }
                  photoId: { $ref: "#/components/schemas/Uuid" }
                  note: { type: string }
            signedOffBy: { type: [string, "null"], format: uuid, readOnly: true }
    TestResult:
      type: object
      required: [kind, sampleRef, testedOn, value]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        kind: { type: string, enum: [cube_7d, cube_28d, slump] }
        sampleRef: { type: string }
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        castOn: { $ref: "#/components/schemas/BusinessDate" }
        testedOn: { $ref: "#/components/schemas/BusinessDate" }
        value: { $ref: "#/components/schemas/Decimal" }
        specMin: { $ref: "#/components/schemas/Decimal" }
        pass: { type: boolean, readOnly: true }
        fileId: { $ref: "#/components/schemas/Uuid" }
    Snag:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [location, description]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            location: { type: string }
            description: { type: string }
            assignedTo: { type: [string, "null"], format: uuid }
            dueDate: { $ref: "#/components/schemas/BusinessDate" }
            status: { type: string, enum: [open, fixed, verified, closed] }
            photoIds:
              type: array
              items: { $ref: "#/components/schemas/Uuid" }
    SafetyIncident:
      type: object
      required: [id, occurredAt, kind, severity, description]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        siteId: { type: string, format: uuid, readOnly: true }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        kind: { type: string, enum: [incident, near_miss, first_aid] }
        severity: { type: string, enum: [minor, serious, fatal] }
        description: { type: string }
        injuredLabourerIds:
          type: array
          items: { $ref: "#/components/schemas/Uuid" }
        photoIds:
          type: array
          items: { $ref: "#/components/schemas/Uuid" }
        wibaReportable:
          type: boolean
          readOnly: true
          description: Flag for review (COMPLIANCE-REVIEW)
        status: { type: string, enum: [reported, investigating, closed], readOnly: true }
    CorrectiveAction:
      type: object
      required: [description, ownerUserId, dueDate]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        incidentId: { type: string, format: uuid, readOnly: true }
        description: { type: string }
        ownerUserId: { $ref: "#/components/schemas/Uuid" }
        dueDate: { $ref: "#/components/schemas/BusinessDate" }
        status: { type: string, enum: [open, done, overdue], readOnly: true }
    ToolboxTalk:
      type: object
      required: [heldOn, topic, attendeeLabourerIds]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        siteId: { type: string, format: uuid, readOnly: true }
        heldOn: { $ref: "#/components/schemas/BusinessDate" }
        topic: { type: string, examples: [Working at heights] }
        conductedBy: { $ref: "#/components/schemas/Uuid" }
        attendeeLabourerIds:
          type: array
          items: { $ref: "#/components/schemas/Uuid" }
    PpeIssue:
      type: object
      required: [item, issuedOn, quantity]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        labourerId: { type: string, format: uuid, readOnly: true }
        item:
          type: string
          enum: [helmet, boots, vest, gloves, harness, goggles, ear_protection]
        issuedOn: { $ref: "#/components/schemas/BusinessDate" }
        quantity: { type: integer, minimum: 1 }
        returnedOn: { type: [string, "null"], format: date }
    InductionBatch:
      type: object
      required: [inductedOn, labourerIds]
      properties:
        inductedOn: { $ref: "#/components/schemas/BusinessDate" }
        labourerIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Uuid" }
        inductedBy: { type: string, format: uuid, readOnly: true }
        recordIds:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/Uuid" }
    # ---------------------------------------------------------------- plant
    Plant:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [code, name, ownership]
          properties:
            code: { type: string, examples: [MIX-01] }
            name: { type: string, examples: [Concrete mixer 350 L] }
            ownership: { type: string, enum: [owned, hired] }
            supplierId: { type: [string, "null"], format: uuid }
            hireRate: { $ref: "#/components/schemas/Money" }
            hireRateBasis: { type: string, enum: [hour, day, week, month] }
            currentSiteId: { type: [string, "null"], format: uuid }
            status: { type: string, enum: [available, in_use, broken_down, returned] }
    PlantUsage:
      type: object
      required: [siteId, usedOn, hours]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        plantId: { type: string, format: uuid, readOnly: true }
        siteId: { $ref: "#/components/schemas/Uuid" }
        usedOn: { $ref: "#/components/schemas/BusinessDate" }
        hours: { $ref: "#/components/schemas/Decimal" }
        operatorLabourerId: { $ref: "#/components/schemas/Uuid" }
        bqItemId: { $ref: "#/components/schemas/Uuid" }
        cost: { $ref: "#/components/schemas/Money" }
    FuelIssue:
      type: object
      required: [storeId, issuedOn, litres]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        plantId: { type: string, format: uuid, readOnly: true }
        storeId: { $ref: "#/components/schemas/Uuid" }
        issuedOn: { $ref: "#/components/schemas/BusinessDate" }
        litres: { $ref: "#/components/schemas/Decimal" }
        unitCost: { $ref: "#/components/schemas/Money" }
        meterReading: { $ref: "#/components/schemas/Decimal" }
        litresPerHour: { $ref: "#/components/schemas/Decimal" }
        stockLedgerEntryId: { type: string, format: uuid, readOnly: true }
    PlantMaintenance:
      type: object
      required: [kind, startAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        plantId: { type: string, format: uuid, readOnly: true }
        kind: { type: string, enum: [breakdown, service, repair] }
        startAt: { $ref: "#/components/schemas/Timestamp" }
        endAt: { type: [string, "null"], format: date-time }
        cost: { $ref: "#/components/schemas/Money" }
        notes: { type: string }
    # ------------------------------------------------- documents, compliance
    DocumentVersion:
      type: object
      required: [fileId]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        documentId: { type: string, format: uuid, readOnly: true }
        versionNo: { type: integer, readOnly: true }
        fileId: { $ref: "#/components/schemas/Uuid" }
        notes: { type: string }
        uploadedAt: { type: string, format: date-time, readOnly: true }
    Document:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [category, title]
          properties:
            projectId: { type: string, format: uuid, readOnly: true }
            category:
              type: string
              enum: [drawing, contract, bq, permit, certificate, insurance, other]
            title: { type: string, examples: [Structural drawings rev C] }
            fileId:
              type: string
              format: uuid
              writeOnly: true
              description: File of the first version
            currentVersion: { $ref: "#/components/schemas/DocumentVersion" }
    ComplianceItem:
      allOf:
        - $ref: "#/components/schemas/Resource"
        - type: object
          required: [kind]
          properties:
            projectId:
              type: [string, "null"]
              format: uuid
              description: Null for company-level items
            kind:
              type: string
              enum:
                - county_approval
                - nca_project_registration
                - nca_contractor_registration
                - nca_levy
                - nema_licence
                - car_insurance
                - wiba_insurance
                - osh_registration
                - site_signboard
            referenceNo: { type: string }
            issuedOn: { $ref: "#/components/schemas/BusinessDate" }
            expiresOn: { type: [string, "null"], format: date }
            documentId: { $ref: "#/components/schemas/Uuid" }
            reminderDays:
              type: array
              items: { type: integer, minimum: 1 }
              examples: [[60, 30, 7]]
            status:
              type: string
              enum: [valid, expiring, expired, missing]
              readOnly: true
    # ------------------------------------------------ notifications, alerts
    NotificationChannel:
      type: string
      enum: [sms, whatsapp, email, push]
    NotificationTemplate:
      type: object
      required: [eventKey, channel, locale, bodyIcu]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        eventKey: { type: string, examples: [payment.sent] }
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        locale: { $ref: "#/components/schemas/Locale" }
        version: { type: integer, readOnly: true }
        bodyIcu:
          type: string
          description: ICU message format
          examples: ["Umelipwa {amount} kupitia M-Pesa. Ref {receipt}."]
        whatsappTemplateName: { type: string }
        isOverride: { type: boolean, readOnly: true }
    NotificationPreferences:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            type: object
            required: [eventKey, channel, enabled]
            properties:
              eventKey: { type: string, examples: [approval.pending] }
              channel: { $ref: "#/components/schemas/NotificationChannel" }
              enabled: { type: boolean }
              locked:
                type: boolean
                readOnly: true
                description: Critical security notifications cannot be switched off
    Notification:
      type: object
      required: [id, eventKey, channel, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        eventKey: { type: string }
        channel: { $ref: "#/components/schemas/NotificationChannel" }
        recipientUserId: { type: [string, "null"], format: uuid }
        recipient: { $ref: "#/components/schemas/MaskedValue" }
        status: { type: string, enum: [queued, sent, delivered, failed] }
        providerMessageId: { type: [string, "null"] }
        attempts: { type: integer }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        deliveredAt: { type: [string, "null"], format: date-time }
    AlertKind:
      type: string
      enum:
        - budget_threshold
        - unusual_spend
        - duplicate_payment
        - missing_documents
        - material_variance
        - low_stock
        - attendance_anomaly
        - accreditation_expiry
        - document_expiry
        - casual_conversion
        - unusual_payout
        - unmatched_callback
        - price_change
        - name_mismatch
    Alert:
      type: object
      required: [id, kind, severity, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        projectId: { type: [string, "null"], format: uuid }
        kind: { $ref: "#/components/schemas/AlertKind" }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        refType: { type: string }
        refId: { $ref: "#/components/schemas/Uuid" }
        details: { type: object, additionalProperties: true }
        status: { type: string, enum: [open, acknowledged, resolved] }
        assignedTo: { type: [string, "null"], format: uuid }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        resolvedAt: { type: [string, "null"], format: date-time }
        resolutionNote: { type: [string, "null"] }
    # -------------------------------------------------------------- reports
    ReportType:
      type: object
      required: [key, name, formats]
      properties:
        key: { type: string, examples: [muster_roll] }
        name: { type: string }
        module: { type: string }
        formats:
          type: array
          items: { type: string, enum: [pdf, xlsx, csv] }
        parametersSchema:
          type: object
          description: JSON Schema of the report parameters
          additionalProperties: true
        permission: { type: string, examples: [attendance.view] }
    ReportExportRequest:
      type: object
      required: [type, format]
      properties:
        type: { type: string, examples: [payroll_summary] }
        format: { type: string, enum: [pdf, xlsx, csv] }
        params:
          type: object
          description: Validated against the report type's parameters schema
          additionalProperties: true
    ReportSchedule:
      type: object
      required: [type, format, cron, recipientUserIds]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        type: { type: string }
        format: { type: string, enum: [pdf, xlsx, csv] }
        params: { type: object, additionalProperties: true }
        cron:
          type: string
          description: Cron expression evaluated in Africa/Nairobi
          examples: ["0 7 * * MON"]
        recipientUserIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Uuid" }
        active: { type: boolean, default: true }
        nextRunAt: { type: string, format: date-time, readOnly: true }
    OwnerDashboard:
      type: object
      required: [asOf]
      properties:
        asOf: { $ref: "#/components/schemas/Timestamp" }
        cashPosition: { $ref: "#/components/schemas/Money" }
        labourCostPerDay: { $ref: "#/components/schemas/Money" }
        openAlerts: { type: integer }
        spendByCategory:
          type: array
          items:
            type: object
            properties:
              category: { $ref: "#/components/schemas/CostCategory" }
              amount: { $ref: "#/components/schemas/Money" }
        budgetBurn:
          type: array
          items:
            type: object
            properties:
              projectId: { $ref: "#/components/schemas/Uuid" }
              projectName: { type: string }
              budget: { $ref: "#/components/schemas/Money" }
              actual: { $ref: "#/components/schemas/Money" }
              burnPct: { $ref: "#/components/schemas/Decimal" }
        topVariances:
          type: array
          items:
            type: object
            properties:
              projectId: { $ref: "#/components/schemas/Uuid" }
              label: { type: string }
              variance: { $ref: "#/components/schemas/Money" }
        upcomingPayments:
          type: array
          items:
            type: object
            properties:
              dueOn: { $ref: "#/components/schemas/BusinessDate" }
              description: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
    # ---------------------------------------------------------------- files
    FileUploadIntentRequest:
      type: object
      required: [fileName, contentType, sizeBytes, sha256, purpose]
      properties:
        fileName: { type: string, maxLength: 255 }
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
            - text/csv
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: Exact size. The maximum per purpose is configurable.
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        purpose:
          type: string
          enum:
            - photo
            - receipt
            - document
            - delivery_note
            - evidence
            - consent_form
            - signature
    FileUploadIntent:
      type: object
      required: [fileId, uploadUrl, method, headers, expiresAt]
      properties:
        fileId: { $ref: "#/components/schemas/Uuid" }
        uploadUrl: { type: string, format: uri, description: Pre-signed PUT URL (quarantine) }
        method: { type: string, const: PUT }
        headers:
          type: object
          description: Headers the client must send unchanged with the PUT
          additionalProperties: { type: string }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    # -------------------------------------------------------------- portals
    FxRate:
      type: object
      required: [currency, kesPerUnit, asOf, source]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        kesPerUnit: { $ref: "#/components/schemas/Decimal" }
        asOf: { $ref: "#/components/schemas/Timestamp" }
        source: { type: string }
    ClientProjectSummary:
      type: object
      required: [projectId, name]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        percentComplete: { $ref: "#/components/schemas/Decimal" }
        originalContractSum: { $ref: "#/components/schemas/Money" }
        revisedContractSum: { $ref: "#/components/schemas/Money" }
        certifiedToDate: { $ref: "#/components/schemas/Money" }
        paidToDate: { $ref: "#/components/schemas/Money" }
        amountDue: { $ref: "#/components/schemas/Money" }
        displayFx: { $ref: "#/components/schemas/FxRate" }
        sCurve: { $ref: "#/components/schemas/SCurveSeries" }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/Milestone" }
        pendingVariationOrders:
          type: array
          items: { $ref: "#/components/schemas/VariationOrder" }
        diarySummaries:
          type: array
          items:
            type: object
            properties:
              date: { $ref: "#/components/schemas/BusinessDate" }
              summary: { type: string }
    ClientStatement:
      type: object
      required: [projectId, certificates, payments, balanceDue]
      properties:
        projectId: { $ref: "#/components/schemas/Uuid" }
        certificates:
          type: array
          items: { $ref: "#/components/schemas/PaymentCertificate" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        balanceDue: { $ref: "#/components/schemas/Money" }
        displayFx: { $ref: "#/components/schemas/FxRate" }
    SupplierStatement:
      type: object
      required: [supplierId, openingBalance, closingBalance, entries]
      properties:
        supplierId: { $ref: "#/components/schemas/Uuid" }
        openingBalance: { $ref: "#/components/schemas/Money" }
        closingBalance: { $ref: "#/components/schemas/Money" }
        entries:
          type: array
          items:
            type: object
            properties:
              date: { $ref: "#/components/schemas/BusinessDate" }
              kind: { type: string, enum: [invoice, payment, credit_note] }
              reference: { type: string }
              debit: { $ref: "#/components/schemas/Money" }
              credit: { $ref: "#/components/schemas/Money" }
              balance: { $ref: "#/components/schemas/Money" }
    # ------------------------------------------------------------- webhooks
    DarajaCallback:
      type: object
      description: >-
        Raw Daraja callback. STK callbacks carry `Body.stkCallback`. Result callbacks (B2C, B2B,
        Transaction Status, Account Balance, Reversal) carry `Result`. Field names follow the
        Daraja documentation and are verified against it in D4.2.
      properties:
        Body:
          type: object
          properties:
            stkCallback:
              type: object
              properties:
                MerchantRequestID: { type: string }
                CheckoutRequestID: { type: string }
                ResultCode: { type: integer }
                ResultDesc: { type: string }
                CallbackMetadata: { type: object, additionalProperties: true }
        Result:
          type: object
          properties:
            ResultType: { type: integer }
            ResultCode: { type: integer }
            ResultDesc: { type: string }
            OriginatorConversationID: { type: string }
            ConversationID: { type: string }
            TransactionID: { type: string }
            ResultParameters: { type: object, additionalProperties: true }
            ReferenceData: { type: object, additionalProperties: true }
      additionalProperties: true
    DarajaAck:
      type: object
      required: [ResultCode, ResultDesc]
      properties:
        ResultCode: { type: integer, const: 0 }
        ResultDesc: { type: string, examples: [Accepted] }
    C2bPayment:
      type: object
      required: [TransactionType, TransID, TransTime, TransAmount, BusinessShortCode, BillRefNumber]
      properties:
        TransactionType: { type: string, examples: [Pay Bill] }
        TransID: { type: string, examples: [SKB1X2Y3Z4] }
        TransTime: { type: string, pattern: "^\\d{14}$", description: YYYYMMDDHHmmss in EAT }
        TransAmount: { type: string, examples: ["25000.00"] }
        BusinessShortCode: { type: string }
        BillRefNumber: { type: string, description: Account number entered by the payer }
        InvoiceNumber: { type: string }
        OrgAccountBalance: { type: string }
        ThirdPartyTransID: { type: string }
        MSISDN: { type: string, description: May be masked or hashed. Never used for matching. }
        FirstName: { type: string }
        MiddleName: { type: string }
        LastName: { type: string }
    C2bValidationResponse:
      type: object
      required: [ResultCode, ResultDesc]
      properties:
        ResultCode:
          type: string
          description: "0 accepts; a C2B rejection code (for example C2B00012, invalid account) rejects"
        ResultDesc: { type: string, enum: [Accepted, Rejected] }
    UssdRequest:
      type: object
      required: [sessionId, serviceCode, phoneNumber, text]
      properties:
        sessionId: { type: string }
        serviceCode: { type: string, examples: ["*384*123#"] }
        phoneNumber:
          type: string
          pattern: "^\\+?\\d{9,15}$"
          description: Caller number, normalised to 2547 or 2541 by the handler
        networkCode: { type: string }
        text:
          type: string
          description: Inputs so far joined with `*`, empty on the first request
    UssdResponse:
      type: string
      pattern: "^(CON|END) "
      maxLength: 182
      description: "`CON` keeps the session open for input; `END` closes it"
    SmsDeliveryReport:
      type: object
      required: [id, status]
      properties:
        id: { type: string, description: Provider message ID }
        status: { type: string, examples: [Success] }
        phoneNumber: { type: string }
        networkCode: { type: string }
        failureReason: { type: string }
        retryCount: { type: string }
    WhatsappWebhookEvent:
      type: object
      required: [object, entry]
      properties:
        object: { type: string, examples: [whatsapp_business_account] }
        entry:
          type: array
          items: { type: object, additionalProperties: true }
    TerminalPushBatch:
      type: object
      required: [serialNo, records]
      properties:
        serialNo: { type: string }
        records:
          type: array
          items:
            type: object
            required: [terminalUserId, time]
            properties:
              terminalUserId: { type: string }
              time:
                type: string
                description: Terminal local time (Africa/Nairobi), converted to UTC on ingest
              verifyMode: { type: string, enum: [fingerprint, face, card, pin] }
              inOut: { type: string, enum: [in, out] }
