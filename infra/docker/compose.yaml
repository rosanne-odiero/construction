# Local development services for PM-Buddy (ARCHITECTURE §3, §20).
#   pnpm services:up     start and wait until healthy
#   pnpm services:down   stop (data is kept in named volumes; add -v to wipe)
# Ports avoid the defaults where a local install is common (Postgres 55432, Valkey 56379).
# All credentials below are local-only defaults; override them in infra/docker/.env.
name: pm-buddy

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      PMB_MIGRATOR_PASSWORD: ${PMB_MIGRATOR_PASSWORD:-pmb_migrator_dev}
      PMB_APP_PASSWORD: ${PMB_APP_PASSWORD:-pmb_app_dev}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pmb"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Redis-compatible (BSD-licensed Valkey) for queues, rate limits, sessions and cache.
  valkey:
    image: valkey/valkey:8.1-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage. MinIO no longer publishes community images, so RustFS
  # (Apache-2.0, MinIO-compatible) is used locally (decision D-24).
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-pmbdev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-pmbdevsecret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches all outgoing email in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  storage-data:
